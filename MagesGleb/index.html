/* =====================================================================
   STORAGE — загрузка, сохранение, миграции, резервные копии
   ===================================================================== */
// Миграции: ключ — версия, из которой мигрируем.
const MIGRATIONS = {
  // v1 → v2: уровень 0 = стихия не изучена (ступени сдвигаются на +1),
  // у NPC статус/фракция/место стали списками, появились география и квесты.
  1: s => {
    for (const el of s.elementalMagic?.elements || [])
      for (const st of el.stages || [])
        if (st.minLevel !== null && st.minLevel !== undefined && st.minLevel !== '') st.minLevel = Number(st.minLevel) + 1;
    for (const n of s.npcs || []) for (const k of NPC_TAG_FIELDS) n[k] = toTags(n[k]);
    s.version = 2;
    return s;
  },
  // v2 → v3: требования ступеней из текста в список «аффикс × количество», правила превращений
  2: s => {
    const em = s.elementalMagic;
    const getAffix = name => {
      let a = em.affixes.find(x => x.name.trim().toLowerCase() === name.toLowerCase());
      if (!a) { a = { id: uid('affix'), name, description: '', requirements: '', notes: '', links: [] }; em.affixes.push(a); }
      return a;
    };
    for (const el of em.elements) for (const st of el.stages || []) {
      if (!st.reqs) { st.reqs = parseReqs(st.requirements, getAffix); st.requirements = ''; }
      if (st.name === 'Идеальный материал' && !st.parentId) st.parentId = el.stages.find(x => x.name === 'Кристалл')?.id || null;
    }
    s.version = 3;
    return s;
  },
  // v3 → v4: стихия и форма дают все свои аффиксы — выбор одного аффикса стихии/формы убран
  3: s => {
    const strip = o => {
      if (!o) return;
      delete o.elementAffixId; delete o.formAffixId;
      if (o.consumed) o.consumed = o.consumed.filter(k => k !== 'elementAffixId' && k !== 'formAffixId');
      strip(o.origin);
    };
    (s.spellbook || []).forEach(strip);
    (s.untestedCombinations || []).forEach(strip);
    s.version = 4;
    return s;
  },
  // v4 → v5: правила превращений уточнены (зашиты в код), стоимость по уровню ступени;
  // здоровье: хиты + лёгкие/средние/тяжёлые раны без максимума
  4: s => {
    const r = s.elementalMagic?.rules;
    if (r) {
      for (const k of ['elementAffixCounts', 'consume', 'refill', 'manaMultiplier', 'manaPerStep']) delete r[k];
    }
    for (const sp of s.spellbook || []) delete sp.baseCost;
    const old = s.character?.health || {};
    const items = t => Array.isArray(t?.items) ? t.items
      : Array.from({ length: Number(t?.current) || 0 }, () => ({ id: uid('wound'), text: '', date: new Date().toISOString() }));
    if (s.character) s.character.health = {
      light: { items: items(old.light) }, medium: { items: [] }, heavy: { items: items(old.heavy) },
      lightPerMedium: 3, mediumPerHeavy: 3, heavyToDeath: 4,
    };
    s.version = 5;
    return s;
  },
  // v5 → v6: уровень ступени снова считается сам; у каждой ступени свой множитель стоимости.
  // Числа, вписанные в поле «ур.», переносятся в множитель. Общая таблица множителей по уровням убрана.
  5: s => {
    for (const el of s.elementalMagic?.elements || []) for (const st of el.stages || []) {
      if (st.magicLevel !== null && st.magicLevel !== undefined && st.magicLevel !== '' && st.costMultiplier == null)
        st.costMultiplier = Number(st.magicLevel);
      delete st.magicLevel;
    }
    if (s.elementalMagic?.rules) delete s.elementalMagic.rules.levelMultipliers;
    s.version = 6;
    return s;
  },
  // v6 → v7: соотношение ран — правило в коде; база ячеек свободного аффикса 0 (первую даёт «Магическая теория»)
  6: s => {
    const hp = s.character?.health;
    if (hp) { delete hp.lightPerMedium; delete hp.mediumPerHeavy; delete hp.heavyToDeath; }
    if (s.elementalMagic?.rules) s.elementalMagic.rules.freeSlots = 0;
    s.version = 7;
    return s;
  },
  // v7 → v8: база ячеек свободного аффикса и максимум маны больше не хранятся (правило и формула в коде)
  7: s => {
    if (s.elementalMagic) delete s.elementalMagic.rules;
    if (s.character?.mana) delete s.character.mana.baseMax;
    s.version = 8;
    return s;
  },
  // v8 → v9: у форм больше нет уровней (и условий повышения), у связей «аффикс — форма» нет минимального уровня
  8: s => {
    const em = s.elementalMagic;
    for (const f of em?.forms || []) { delete f.level; delete f.levels; delete f.conditions; }
    for (const a of em?.affixes || []) for (const l of a.links || []) if (l.type === 'form') delete l.minLevel;
    s.version = 9;
    return s;
  },
  // v9 → v10: множители ступеней — из правил (не хранятся); новые аффиксы «Избирательный» и «Ласковый»
  9: s => {
    const em = s.elementalMagic;
    for (const el of em?.elements || []) for (const st of el.stages || []) delete st.costMultiplier;
    for (const [name, text] of Object.entries(AFFIX_DESCRIPTIONS)) {
      const a = em?.affixes?.find(x => x.name.trim().toLowerCase() === name.toLowerCase());
      if (!a) em?.affixes?.push({ id: uid('affix'), name, description: text, requirements: '', notes: '', links: [] });
      else if (!a.description?.trim()) a.description = text;
    }
    s.version = 10;
    return s;
  },
  // v14 → v15: записи уровней дисциплин стали бонусами на выбор (отмечено не больше уровня дисциплины).
  // Действовавшие раньше (уровень записи не выше уровня дисциплины) отмечаются выбранными — в пределах уровня.
  14: s => {
    for (const d of s.disciplines || []) {
      const cur = Number(d.level) || 0;
      let left = cur;
      for (const lv of (d.levels || []).slice().sort((a, b) => (Number(a.level) || 0) - (Number(b.level) || 0)))
        lv.chosen = (Number(lv.level) || 0) <= cur && left > 0 ? (left--, true) : false;
    }
    s.version = 15;
    return s;
  },
  // v13 → v14: заклинания школ больше не хранятся в HTML. Неизученные записи прежнего списка убираются,
  // изученные становятся своими заклинаниями.
  13: s => {
    s.arcaneSpells = (s.arcaneSpells || []).filter(sp => {
      if (!('learned' in sp)) return true;            // своё заклинание — не трогаем
      if (!sp.learned) return false;                  // запись списка школы, не изученная — убираем
      delete sp.learned; delete sp.sys;
      return true;
    });
    s.version = 14;
    return s;
  },
  // v12 → v13: аффикс снова называется «Ласковый» (если были «Пацифизм» и «Ласковый» — сливаются в один)
  12: s => {
    const affs = s.elementalMagic?.affixes || [];
    const same = affs.filter(x => ['ласковый', 'пацифизм'].includes(normName(x.name)));
    if (same.length) {
      const keepId = same[0].id;
      let json = JSON.stringify(s);
      for (const x of same.slice(1)) json = json.split(x.id).join(keepId);
      s = JSON.parse(json);
      const all = s.elementalMagic.affixes, dups = all.filter(x => x.id === keepId), keep = dups[0];
      for (const x of dups.slice(1)) { keep.links = [...(keep.links || []), ...(x.links || [])]; if (!keep.description?.trim()) keep.description = x.description; }
      s.elementalMagic.affixes = all.filter(x => x.id !== keepId || x === keep);
      keep.links = keep.links.filter((l, i, arr) => l.type !== 'free' || arr.findIndex(y => y.type === 'free') === i);
      keep.name = 'Ласковый';
    }
    s.version = 13;
    return s;
  },
  // v11 → v12: появился список открытых тайных школ
  11: s => {
    s.character.arcaneSchools ||= [];
    s.version = 12;
    return s;
  },
  // v10 → v11: аффикс «Ласковый» переименован в «Пацифизм» (если были оба — сливаются в один)
  10: s => {
    const OLD_TEXT = 'Пацифистичный: не наносит урон по своим.';
    const affs = s.elementalMagic?.affixes || [];
    const same = affs.filter(x => ['ласковый', 'пацифизм'].includes(normName(x.name)));
    if (same.length) {
      // все найденные сливаются в первый: ссылки на их id в заклинаниях и эффектах переводятся на него
      const keepId = same[0].id;
      let json = JSON.stringify(s);
      for (const x of same.slice(1)) json = json.split(x.id).join(keepId);
      s = JSON.parse(json);
      const all = s.elementalMagic.affixes, dups = all.filter(x => x.id === keepId), keep = dups[0];
      for (const x of dups.slice(1)) {
        keep.links = [...(keep.links || []), ...(x.links || [])];
        if (!keep.description?.trim() || keep.description === OLD_TEXT) keep.description = x.description || keep.description;
      }
      s.elementalMagic.affixes = all.filter(x => x.id !== keepId || x === keep);
      keep.links = keep.links.filter((l, i, arr) => l.type !== 'free' || arr.findIndex(y => y.type === 'free') === i);
      keep.name = 'Пацифизм';
      if (!keep.description?.trim() || keep.description === OLD_TEXT) keep.description = 'Не наносит урон по своим.';
    }
    s.version = 11;
    return s;
  },
};

function migrate(s) {
  while (s.version < APP_VERSION) {
    const m = MIGRATIONS[s.version];
    if (!m) throw new Error('Нет миграции с версии ' + s.version);
    s = m(s);
  }
  if (s.version > APP_VERSION) throw new Error(`Файл новее приложения (версия ${s.version})`);
  return normalize(s);
}

const isPlain = o => o && typeof o === 'object' && !Array.isArray(o);
function fillMissing(t, d) {
  for (const k in d) {
    if (!(k in t) || t[k] === undefined || t[k] === null && d[k] !== null) t[k] = d[k];
    else if (isPlain(t[k]) && isPlain(d[k])) fillMissing(t[k], d[k]);
  }
}

// Дозаполняет отсутствующие поля, чтобы старые/неполные сохранения не ломали интерфейс
// Ступени стихий — правило игры из ELEMENT_SEED. При каждом открытии пересобираются из страницы:
// ярус, уровень открытия, «растёт из», требования, описание и аффиксы ступени. От сохранения берутся только id и «открыта».
function syncStagesFromSeed(s) {
  const em = s.elementalMagic;
  const getAffix = name => {
    let a = em.affixes.find(x => x.name.trim().toLowerCase() === name.toLowerCase());
    if (!a) { a = { id: uid('affix'), name, description: '', requirements: '', notes: '', links: [] }; em.affixes.push(a); }
    return a;
  };
  for (const seed of ELEMENT_SEED) {
    let el = em.elements.find(e => e.id === seed.id);
    if (!el) { el = { id: seed.id, name: seed.name, level: 0, description: seed.description, conditions: '', stages: [] }; em.elements.push(el); }
    const old = el.stages || [];
    const prevByName = new Map(old.map(st => [String(st.name || '').trim().toLowerCase(), st]));
    const idByName = {}, stages = [];
    for (const sd of seed.stages) {
      const prev = prevByName.get(sd.n.toLowerCase());
      const st = { id: prev?.id || uid('stage'), name: sd.n, tier: sd.t, minLevel: sd.lvl ?? null, unlocked: !!prev?.unlocked,
        parentId: sd.from ? idByName[sd.from] || null : null, requirements: sd.rn || '', reqs: parseReqs(sd.req, getAffix), description: sd.d || '' };
      idByName[sd.n] = st.id;
      stages.push(st);
    }
    // связи «аффикс — ступень» этой стихии собираем заново по правилам
    const ids = new Set([...old.map(st => st.id), ...stages.map(st => st.id)]);
    for (const a of em.affixes) a.links = (a.links || []).filter(l => !(l.type === 'stage' && ids.has(l.targetId)));
    for (const sd of seed.stages) for (const an of sd.a || []) getAffix(an).links.push({ id: uid('link'), type: 'stage', targetId: idByName[sd.n] });
    el.stages = stages;
  }
}

// Аффикс по названию из правил: находит (без учёта регистра и «ё») или создаёт
function seedAffix(em, name) {
  let a = em.affixes.find(x => normName(x.name) === normName(name));
  if (!a) { a = { id: uid('affix'), name, description: '', requirements: '', notes: '', links: [] }; em.affixes.push(a); }
  else a.name = name;
  a.links ||= [];
  return a;
}
function ensureSeedAffixes(s) {
  const em = s.elementalMagic;
  for (const name of [...Object.keys(AFFIX_DESCRIPTIONS), ...EXTRA_AFFIXES]) {
    const a = seedAffix(em, name);
    if (AFFIX_DESCRIPTIONS[name] && !a.description?.trim()) a.description = AFFIX_DESCRIPTIONS[name];
  }
}

// Формы из FORM_SEED: описание, предыдущая форма и аффиксы — из страницы; от сохранения — id, «изучена», источник.
// Старые названия вида «Копье Продвинутая форма стрелы» узнаются по первой части.
const formKey = n => normName(n).replace(/ (продвинутая|высшая) форма.*$/, '');
// Заменить во всём объекте строку-идентификатор (id уникальны, поэтому безопасно)
function deepReplace(o, from, to) {
  if (Array.isArray(o)) { o.forEach((v, i) => { if (v === from) o[i] = to; else if (v && typeof v === 'object') deepReplace(v, from, to); }); return; }
  for (const k in o) { const v = o[k]; if (v === from) o[k] = to; else if (v && typeof v === 'object') deepReplace(v, from, to); }
}
// Дисциплины из правил: находятся по названию (без учёта регистра, «ё», лишних пробелов); их тексты и
// заготовленные бонусы — из страницы. Бонусы узнаются по ключу или прежнему названию; «выбран» сохраняется.
function syncDisciplinesFromSeed(s) {
  const matched = new Set();
  for (const sd of DISCIPLINE_SEED) {
    const names = [sd.n, ...(sd.aka || [])].map(normName);
    const d = s.disciplines.find(x => !matched.has(x) && names.includes(normName(x.name)));
    if (!d) continue;
    matched.add(d);
    Object.assign(d, { name: sd.n, description: sd.d || '', sys: true });
    d.levels ||= [];
    const taken = new Set();
    for (const b of sd.bonuses || []) {
      const bn = [b.t, ...(b.aka || [])].map(normName);
      let lv = d.levels.find(x => x.key === b.k) || d.levels.find(x => !x.key && !taken.has(x) && bn.includes(normName(x.title)));
      if (!lv) { lv = { id: uid('dlvl'), chosen: false }; d.levels.push(lv); }
      taken.add(lv);
      Object.assign(lv, { key: b.k, sys: true, level: b.lvl ?? 1, title: b.t, description: b.d || '',
        effects: (b.eff || []).map((e, i) => ({ ...localEff(s, e), id: b.k + '-eff' + i })) });
    }
    // бонусы, убранные мастером из правил, становятся своими
    for (const lv of d.levels) if (lv.sys && !taken.has(lv)) { delete lv.sys; delete lv.key; }
  }
  for (const d of s.disciplines) if (!matched.has(d)) delete d.sys;
}
// Эффекты в правилах ссылаются на формы, ступени и аффиксы по названиям (номера у каждого игрока свои)
function portableEff(e) {
  const { id, targetId, stageId, affixId, ...rest } = e;
  if (e.type === 'unlockForm') rest.formName = findForm(targetId)?.name || '';
  if (e.type === 'unlockStage') { const r = findStage(stageId); rest.stageRef = r ? r.el.id + '|' + r.st.name : ''; }
  if (e.type === 'freeAffix') rest.affixName = affName(affixId) || '';
  return rest;
}
function localEff(s, e) {
  const em = s.elementalMagic, out = { ...e };
  if (e.formName != null) out.targetId = em.forms.find(f => normName(f.name) === normName(e.formName))?.id || '';
  if (e.stageRef != null) { const [elId, stName] = e.stageRef.split('|'); out.stageId = em.elements.find(x => x.id === elId)?.stages.find(st => st.name === stName)?.id || ''; }
  if (e.affixName != null) out.affixId = em.affixes.find(a => normName(a.name) === normName(e.affixName))?.id || '';
  return out;
}

// Карточки NPC мастера: находятся по имени или «другому имени», иначе заводятся
function syncNpcsFromSeed(s) {
  const matched = new Set();
  for (const sd of NPC_SEED) {
    const names = [sd.n, ...(sd.aka || [])].map(normName);
    let n = s.npcs.find(x => !matched.has(x) && x.kind !== 'group' && names.includes(normName(x.name)))
      || s.npcs.find(x => !matched.has(x) && x.kind !== 'group' && toTags(x.aliases).some(a => names.includes(normName(a))));
    if (!n) { n = newNpc('person', sd.n); s.npcs.push(n); }
    matched.add(n);
    if (n.name && normName(n.name) !== normName(sd.n)) n.aliases = [...new Set([...toTags(n.aliases), n.name.trim()])];
    Object.assign(n, { name: sd.n, image: sd.img || '', sys: true });
  }
  for (const n of s.npcs) if (!matched.has(n)) delete n.sys;
}

function syncFormsFromSeed(s) {
  const em = s.elementalMagic;
  const byKey = new Map();
  for (const f of em.forms) if (!byKey.has(formKey(f.name))) byKey.set(formKey(f.name), f);
  const idByName = {}, seeded = [];
  for (const sd of FORM_SEED) {
    // все карточки этой формы: по названию и старым написаниям (Луч, Лучь…). Лишние сливаются в первую.
    const keys = [sd.n, ...(sd.aka || [])].map(formKey);
    const same = em.forms.filter(x => keys.includes(formKey(x.name)));
    let f = same[0];
    for (const dup of same.slice(1)) {
      f.known = f.known || dup.known;
      f.source ||= dup.source;
      f.props = { ...(dup.props || {}), ...(f.props || {}) };
      deepReplace(s, dup.id, f.id);
      em.forms = em.forms.filter(x => x !== dup);
    }
    if (!f) { f = { id: uid('form'), known: false, source: '' }; em.forms.push(f); }
    Object.assign(f, { name: sd.n, description: sd.d || '', sys: true });
    idByName[sd.n] = f.id;
    seeded.push(f);
  }
  FORM_SEED.forEach((sd, i) => { seeded[i].prevId = sd.prev ? idByName[sd.prev] || null : null; });
  const sysIds = new Set(seeded.map(f => f.id));
  const own = em.forms.filter(f => !sysIds.has(f.id));
  for (const f of own) { delete f.sys; f.prevId ??= null; }
  for (const a of em.affixes) a.links = (a.links || []).filter(l => !(l.type === 'form' && sysIds.has(l.targetId)));
  for (const sd of FORM_SEED) for (const an of sd.a || []) seedAffix(em, an).links.push({ id: uid('link'), type: 'form', targetId: idByName[sd.n] });
  em.forms = [...seeded, ...own];
}

function normalize(s) {
  const d = defaultState();
  // ранения из старого формата (только число) — до fillMissing, иначе подставится пустой список
  for (const k of ['light', 'medium', 'heavy']) {
    const t = s.character?.health?.[k];
    if (t && !Array.isArray(t.items))
      t.items = Array.from({ length: Number(t.current) || 0 }, () => ({ id: uid('wound'), text: '', date: new Date().toISOString() }));
  }
  fillMissing(s, d);
  syncStagesFromSeed(s);
  syncFormsFromSeed(s);
  syncDisciplinesFromSeed(s);
  syncNpcsFromSeed(s);
  ensureSeedAffixes(s);
  const em = s.elementalMagic;
  for (const de of d.elementalMagic.elements)
    if (!em.elements.some(e => e.id === de.id)) em.elements.push({ ...de, stages: [] });
  for (const e of em.elements) {
    e.stages ||= [];
    e.level ??= 0;
    for (const st of e.stages) st.reqs ||= [];
  }
  for (const a of em.affixes) a.links ||= [];
  for (const it of s.inventory) it.effects ||= [];
  for (const d of s.disciplines) { d.levels ||= []; for (const lv of d.levels) lv.effects ||= []; }
  for (const n of s.npcs) {
    n.kind ||= 'person';
    n.aliases = toTags(n.aliases);
    n.contracts ||= []; n.relations ||= [];
    for (const k of NPC_TAG_FIELDS) n[k] = toTags(n[k]);
  }
  {
    const ids = new Set([...s.npcs, ...s.geography.locations, ...s.inventory].map(x => x.id));
    s.notDuplicates = (s.notDuplicates || []).filter(k => k.split('|').every(id => ids.has(id)));
  }
  for (const q of s.quests) { q.steps ||= []; q.npcIds ||= []; q.locationIds ||= []; }
  s.geography.locations ||= [];
  s.geography.links ||= [];
  for (const l of s.geography.locations) { l.pos ||= {}; l.aliases = toTags(l.aliases); }
  for (const [id, text] of EXPERIENCE_ITEMS)
    if (!s.experience.items.some(i => i.id === id)) s.experience.items.push({ id, text, checked: false, note: '', log: [] });
  for (const i of s.experience.items) i.log ||= [];
  // тексты пунктов — правило игры, всегда берутся из страницы (в сохранении — только отметки, заметки и журнал)
  const expTexts = Object.fromEntries(EXPERIENCE_ITEMS);
  for (const i of s.experience.items) if (expTexts[i.id]) i.text = expTexts[i.id];
  return s;
}

// Обёртки над localStorage: если браузер запрещает хранилище, лист работает без сохранения
const store = {
  ok: true,
  get(k) { try { return localStorage.getItem(k); } catch { this.fail(); return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { if (e.name === 'SecurityError') this.fail(); else throw e; return false; } },
  fail() {
    if (!this.ok) return;
    this.ok = false;
    setTimeout(() => toast('Браузер запретил localStorage — изменения не будут сохраняться. Используй экспорт JSON.', 'error'), 300);
  },
};

// Версия листа — номер последней записи «Что нового»
const SHEET_VERSION = () => CHANGELOG[0]?.v || '';
// Перед первым открытием новой версии листа (или нового формата сохранения) — копия сохранения как было
function backupBeforeUpdate(raw, data) {
  const was = data.ui?.sheetVersion || '', now = SHEET_VERSION();
  if (data.version >= APP_VERSION && was === now) return;
  const list = getBackups();
  list.unshift({ id: uid('bk'), date: new Date().toISOString(), data: raw,
    label: was === now ? `Перед обновлением формата сохранения (${data.version} → ${APP_VERSION})`
      : `Перед обновлением листа${was ? ' с версии ' + was : ''}${now ? ' до ' + now : ''}` });
  while (list.length > MAX_BACKUPS) list.pop();
  try { store.set(BACKUP_KEY, JSON.stringify(list)); } catch (e) { console.error(e); }
}
function loadState() {
  const raw = store.get(STORAGE_KEY);
  if (!raw) return normalize(defaultState());
  try {
    const data = JSON.parse(raw);
    if (typeof data.version !== 'number') throw new Error('нет поля version');
    backupBeforeUpdate(raw, data);
    const st = migrate(data);
    st.ui.sheetVersion = SHEET_VERSION();
    return st;
  } catch (e) {
    console.error(e);
    store.set(STORAGE_KEY + '-broken-' + Date.now(), raw);
    setTimeout(() => toast('Сохранение повреждено, загружены данные по умолчанию. Старые данные сохранены отдельно.', 'error'), 300);
    return normalize(defaultState());
  }
}

let saveTimer = null;
// Что пишется в сохранение и экспорт: ступени стихий — только id, название и отметка «открыта» (остальное — правила из страницы)
function serializeState(pretty) {
  const em = state.elementalMagic;
  const sysForms = new Set(em.forms.filter(f => f.sys).map(f => f.id));
  const slim = { ...state,
    // дисциплины из правил: уровень и выбор бонусов; свои бонусы — целиком
    disciplines: state.disciplines.map(d => !d.sys ? d : { id: d.id, name: d.name, level: d.level, notes: d.notes || '',
      levels: d.levels.map(lv => lv.sys ? { id: lv.id, key: lv.key, chosen: !!lv.chosen } : lv) }),
    elementalMagic: { ...em,
    elements: em.elements.map(el => ({ ...el, stages: el.stages.map(st => ({ id: st.id, name: st.name, unlocked: !!st.unlocked })) })),
    // общие формы: только «изучена» и источник
    forms: em.forms.map(f => f.sys ? { id: f.id, name: f.name, known: !!f.known, source: f.source || '' } : f),
    // связи «аффикс — ступень» и «аффикс — общая форма» тоже из правил: при открытии собираются заново
    affixes: em.affixes.map(a => ({ ...a, links: (a.links || []).filter(l => l.type !== 'stage' && !(l.type === 'form' && sysForms.has(l.targetId))) })) } };
  return pretty ? JSON.stringify(slim, null, 2) : JSON.stringify(slim);
}

function saveState() {
  clearTimeout(saveTimer);
  saveTimer = null;
  try {
    store.set(STORAGE_KEY, serializeState());
    document.getElementById('saveDot')?.classList.remove('dirty');
  } catch (e) {
    console.error(e);
    toast(e.name === 'QuotaExceededError' ? 'Хранилище браузера переполнено! Удали старые резервные копии во вкладке «Данные» и сделай экспорт JSON.' : 'Не удалось сохранить: ' + e.message, 'error');
  }
}
function saveSoon() {
  document.getElementById('saveDot')?.classList.add('dirty');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 400);
}
window.addEventListener('beforeunload', () => { if (saveTimer) saveState(); });

function commit() {
  clampMana();
  saveState();
  render();
}

function getBackups() {
  try { return JSON.parse(store.get(BACKUP_KEY) || '[]'); } catch { return []; }
}
function createBackup(label = 'Ручная копия') {
  const list = getBackups();
  list.unshift({ id: uid('bk'), date: new Date().toISOString(), label, data: serializeState() });
  while (list.length > MAX_BACKUPS) list.pop();
  try {
    store.set(BACKUP_KEY, JSON.stringify(list));
    return true;
  } catch (e) {
    toast('Не удалось создать копию: ' + e.message, 'error');
    return false;
  }
}

function dateStamp(d = new Date()) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function downloadText(text, filename) {
  const blob = new Blob([text], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: filename });
  document.body.append(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportJSON() {
  downloadText(serializeState(true), `${FILE_PREFIX}-${dateStamp()}.json`);
  toast('Файл экспортирован', 'ok');
}
function replaceState(data, label) {
  if (!isPlain(data)) throw new Error('это не объект JSON');
  if (typeof data.version !== 'number') throw new Error('в файле нет поля version');
  const migrated = migrate(data);
  createBackup(label);
  state = migrated;
  ui.editing.clear();
  ui.pending = {};
  ui.draft = emptyDraft();
  saveState();
  render();
}
/* ---------- визитка персонажа ---------- */
const CARD_KIND = FILE_PREFIX + '-card';
function exportCard() {
  const c = state.character;
  if (!c.name?.trim()) { toast('Сначала впиши имя персонажа', 'error'); return; }
  const card = { kind: CARD_KIND, cardVersion: 1, id: c.id, name: c.name.trim(), title: c.title || '', bio: c.bio || '',
    portrait: c.portrait || '', player: c.player || '', date: new Date().toISOString() };
  const slug = card.name.replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '');
  downloadText(JSON.stringify(card, null, 2), `${FILE_PREFIX}-card-${slug}-${dateStamp()}.json`);
}
// Визитка другого игрока → карточка «персонаж игрока» (та же — обновляется, свои заметки о нём остаются)
function importCard(card) {
  if (card.id === state.character.id) { toast('Это визитка твоего собственного персонажа', 'error'); return; }
  let n = state.npcs.find(x => x.id === card.id || x.cardId === card.id) ||
    state.npcs.find(x => x.sys && normName(x.name) === normName(card.name));
  const fresh = !n;
  if (fresh) { n = { ...newNpc('pc', card.name), id: card.id }; state.npcs.push(n); }
  Object.assign(n, { kind: 'pc', cardId: card.id, short: card.title || '', bio: card.bio || '', player: card.player || '' });
  if (!n.sys) Object.assign(n, { name: card.name || n.name, image: card.portrait || n.image || '' });
  commit();
  goToNpc(n.id);
  toast(fresh ? `Добавлен персонаж игрока «${n.name}»` : `Карточка «${n.name}» обновлена`, 'ok');
}
function cardInput() {
  const input = h('input', { type: 'file', accept: '.json,application/json', style: 'display:none', onchange: e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    f.text().then(t => {
      let d;
      try { d = JSON.parse(t); } catch { toast('Файл не является корректным JSON', 'error'); return; }
      if (d?.kind !== CARD_KIND) { toast('Это не визитка персонажа', 'error'); return; }
      importCard(d);
    });
  } });
  return [btn('📇 Загрузить визитку', () => input.click(), '', false, 'Файл-визитка другого игрока: его персонаж появится здесь'), input];
}

function importJSONFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch (e) { toast('Файл не является корректным JSON', 'error'); return; }
    if (data?.kind === CARD_KIND) { importCard(data); return; }
    if (!isPlain(data) || typeof data.version !== 'number') { toast('В файле нет поля version — это не сохранение листа', 'error'); return; }
    if (!confirm(`Заменить текущие данные содержимым файла «${file.name}»?\nТекущее состояние будет сохранено в резервную копию.`)) return;
    try {
      replaceState(data, 'Перед импортом');
      toast('Данные импортированы', 'ok');
    } catch (e) { toast('Ошибка импорта: ' + e.message, 'error'); }
  };
  reader.readAsText(file);
}

/* =====================================================================
   CHARACTER STATS — мана, золото, характеристики, модификаторы, пороги
   ===================================================================== */
const statDef = key => STAT_DEFS.find(d => d.key === key);
function getBase(key) {
  const d = statDef(key);
  if (d?.get) return Number(d.get(state)) || 0;
  return Number(state.character.stats[key]) || 0;
}
function setBase(key, v) {
  const d = statDef(key);
  if (d?.set) d.set(state, v); else state.character.stats[key] = v;
}
// Всё, что сейчас «надето»: используемые предметы и записи дисциплин, чей уровень достигнут.
// item.name — подпись источника для расшифровки бонусов.
// Бонус дисциплины действует, если он выбран и его уровень не выше уровня дисциплины
const bonusActive = (d, lv) => !!lv.chosen && (Number(d.level) || 0) >= (Number(lv.level) || 0);
const chosenCount = d => (d.levels || []).filter(lv => bonusActive(d, lv)).length;
function activeEffectSources() {
  const res = state.inventory.filter(it => it.equipped).map(it => ({ name: it.name, effects: it.effects || [] }));
  for (const d of state.disciplines) for (const lv of d.levels || [])
    if (bonusActive(d, lv))
      res.push({ name: `${d.name} ур. ${lv.level}`, effects: lv.effects || [], discipline: true });
  return res;
}
function statModifiers(key) {
  const res = [];
  for (const src of activeEffectSources())
    for (const ef of src.effects) if (ef.type === 'stat' && ef.stat === key) res.push({ item: src, ef });
  return res;
}
// Активные эффекты нужного типа: [{ src, ef }]
const activeEffects = type => activeEffectSources().flatMap(src => src.effects.filter(e => e.type === type).map(ef => ({ src, ef })));
const elementBonus = id => activeEffects('elementLevel').filter(x => x.ef.elementId === id);
const elLevel = el => Math.max(0, (Number(el.level) || 0) + elementBonus(el.id).reduce((t, x) => t + (Number(x.ef.value) || 0), 0));
const stageOpeners = id => activeEffects('unlockStage').filter(x => x.ef.stageId === id).map(x => x.src.name);
const freeAffixGivers = id => activeEffects('freeAffix').filter(x => x.ef.affixId === id).map(x => x.src.name);
// Раздел «Комбо» доступен, пока есть активный эффект «Открывает комбо»
const comboGivers = () => activeEffects('unlockCombos').map(x => x.src.name);
const isFreeAffix = a => a.links.some(l => l.type === 'free') || freeAffixGivers(a.id).length > 0;
const bonusText = key => statModifiers(key).map(({ item, ef }) => `${opText(ef)} от «${item.name}»`).join(', ');
// total = base + активные модификаторы (сначала +/−, потом ×)
function getTotal(key) {
  let add = 0, mul = 1;
  for (const { ef } of statModifiers(key)) {
    const v = Number(ef.value) || 0;
    if (ef.operation === 'mul') mul *= v;
    else if (ef.operation === 'sub') add -= v;
    else add += v;
  }
  return Math.floor((getBase(key) + add) * mul);
}
const opText = ef => (OPS[ef.operation]?.sign || '+') + ef.value;
const maxMana = () => Math.max(0, getTotal('maxMana'));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function clampMana() {
  const m = state.character.mana;
  m.current = clamp(Number(m.current) || 0, 0, maxMana());
}
function adjMana(d) {
  const m = state.character.mana;
  m.current = clamp(m.current + d, 0, maxMana());
  commit();
}
function adjGold(d) {
  state.character.gold = Math.max(0, (Number(state.character.gold) || 0) + d);
  commit();
}

const capOf = key => statDef(key)?.noMax ? Infinity : STAT_MAX;
// Потенциал открывается навсегда, как только одна из характеристик дошла до максимума (траты потом его не закрывают)
function reserveOpen() {
  const c = state.character;
  if (!c.reserveOpened && MANA_STATS.some(k => getBase(k) >= STAT_MAX)) c.reserveOpened = true;
  return !!c.reserveOpened || getBase('reserve') > 0;
}
const pendingTotal = () => Object.values(ui.pending).reduce((a, b) => a + b, 0);
function applyPending() {
  for (const [k, p] of Object.entries(ui.pending)) setBase(k, Math.min(capOf(k), getBase(k) + p));
  state.character.freeStatPoints -= pendingTotal();
  ui.pending = {};
  commit();
  toast('Очки распределены', 'ok');
}

const thrKey = (stat, t) => `thr:${stat}:${t}`;
function getThr(stat, t, create) {
  const list = state.character.statThresholds;
  let r = list.find(x => x.stat === stat && x.threshold === t);
  if (!r && create) {
    r = { id: uid('thr'), stat, threshold: t, title: '', description: '' };
    list.push(r);
  }
  return r;
}

/* =====================================================================
   ELEMENTAL MAGIC — стихии, ступени, формы, доступность
   ===================================================================== */
const EM = () => state.elementalMagic;
const findElement = id => EM().elements.find(e => e.id === id);
const findForm = id => EM().forms.find(f => f.id === id);
const findAffix = id => EM().affixes.find(a => a.id === id);
function findStage(id) {
  for (const el of EM().elements) {
    const st = el.stages.find(s => s.id === id);
    if (st) return { el, st };
  }
  return null;
}
const hasMinLevel = st => st.minLevel !== null && st.minLevel !== undefined && st.minLevel !== '';
// Уровень 0 = стихия не изучена: ни она, ни её ступени недоступны
const isElementAvailable = el => elLevel(el) >= 1 || el.stages.some(st => stageOpeners(st.id).length);
const elementLockReason = el => isElementAvailable(el) ? '' : `${el.name} не изучена (уровень 0)`;
const isStageAvailable = (el, st) => isStageShown(st) && (stageOpeners(st.id).length > 0
  || (elLevel(el) >= 1 && (!!st.unlocked || (hasMinLevel(st) && elLevel(el) >= Number(st.minLevel)))));
function stageLockReason(el, st) {
  if (isStageAvailable(el, st)) return '';
  if (!isElementAvailable(el)) return elementLockReason(el);
  if (hasMinLevel(st)) return `требуется ${el.name} ${st.minLevel}`;
  return 'ступень не открыта';
}

const formUnlockers = id => state.inventory.filter(i => (i.effects || []).some(e => e.type === 'unlockForm' && e.targetId === id));
const formUnlockedByDiscipline = id => activeEffectSources().some(src => src.discipline && src.effects.some(e => e.type === 'unlockForm' && e.targetId === id));
const isFormAvailable = f => !!f.known || formUnlockers(f.id).some(i => i.equipped) || formUnlockedByDiscipline(f.id);
function formLockReason(f) {
  if (isFormAvailable(f)) return '';
  const u = formUnlockers(f.id);
  return u.length ? 'нужен предмет: ' + u.map(i => i.name).join(' / ') : 'форма не изучена';
}

/* =====================================================================
   AFFIXES — единый справочник и связи
   ===================================================================== */
function newLink(type, targetId = '') {
  const l = { id: uid('link'), type };
  if (type !== 'free') l.targetId = targetId;
  if (type === 'element') l.minLevel = 0;
  return l;
}
function linkStatus(l) {
  switch (l.type) {
    case 'element': {
      const el = findElement(l.targetId);
      if (!el) return { ok: false, reason: 'стихия не указана' };
      const need = Math.max(1, Number(l.minLevel) || 0);
      return elLevel(el) >= need ? { ok: true } : { ok: false, reason: `требуется ${el.name} ${need}` };
    }
    case 'stage': {
      const r = findStage(l.targetId);
      if (!r) return { ok: false, reason: 'ступень не найдена' };
      if (isStageAvailable(r.el, r.st)) return { ok: true };
      return { ok: false, reason: `требуется ступень «${r.st.name}»` + (hasMinLevel(r.st) ? ` (${r.el.name} ${r.st.minLevel})` : '') };
    }
    case 'form': {
      const f = findForm(l.targetId);
      if (!f) return { ok: false, reason: 'форма не найдена' };
      return isFormAvailable(f) ? { ok: true } : { ok: false, reason: `форма «${f.name}»: ${formLockReason(f)}` };
    }
    case 'free': return { ok: true };
  }

const affixesForTarget = (type, id) => EM().affixes.filter(a => a.links.some(l => l.type === type && l.targetId === id));

/* =====================================================================
   SPELLBOOK — структура заклинания, конструктор, применение

// Правила (уточнены у мастера): при превращении аффиксы тратятся, потраченные ячейки не заполняются заново,

// Ключи ячеек свободных аффиксов: freeAffixId, freeAffixId2, freeAffixId3…

function defaultStage(el) {

// Все аффиксы ступени (плюс аффиксы, привязанные к стихии по уровню)
function elementAffixesOf(obj) {

function spellParts() {

const comboFields = () => spellParts().map(p => p.key);

function resetDependents(obj, changedKey) {

const isConsumed = (obj, key) => !!obj.consumed?.includes(key);

function spellIssues(obj) {

// Аффиксы формы с отметкой потраченных — для отображения

/* ---------- превращения ---------- */
// Аффиксы, засчитываемые в требования, в порядке траты: свободные → формы (аффиксы стихии не считаются)
function affixSlots(obj) {
  const slots = [];
  for (const k of freeKeys()) if (obj[k]) slots.push({ kind: 'free', key: k, affixId: obj[k] });
  for (const id of formAffixesOf(obj)) slots.push({ kind: 'form', affixId: id });
  return slots;
}

// Какие дочерние ступени текущей можно получить и чего не хватает до остальных
function transformCheck(obj) {
  const res = { possible: [], missing: [] };
  if (!obj.elementId || !obj.stageId) return res;
  const r = findStage(obj.stageId);
  if (!r || r.el.id !== obj.elementId) return res;
  const slots = affixSlots(obj);
  for (const st of r.el.stages.filter(s => s.parentId === obj.stageId && (s.reqs || []).length)) {
    const pool = slots.slice(), consume = [], missing = [];
    for (const q of st.reqs) {
      let need = Math.max(1, Number(q.count) || 1);
      for (let i = 0; i < pool.length && need > 0;) {
        if (pool[i].affixId === q.affixId) { consume.push(pool[i]); pool.splice(i, 1); need--; } else i++;
      }
      if (need > 0) missing.push({ affixId: q.affixId, n: need });
    }
    if (missing.length) res.missing.push({ stage: st, missing });
    else res.possible.push({ stage: st, consume });
  }
  return res;
}

const stageAffixIds = stageId => affixesForTarget('stage', stageId).sort(byName).map(a => a.id);
const snapshotParts = obj => Object.fromEntries(comboFields().map(k => [k, obj[k] || null]));

function applyTransform(obj, opt) {
  if (!obj.chain?.length) {
    obj.origin = snapshotParts(obj);
    obj.chain = [obj.stageId];
  }
  obj.chain.push(opt.stage.id);
  obj.stageId = opt.stage.id;
  for (const s of opt.consume) {
    if (s.kind === 'free') { obj[s.key] = null; obj.consumed = [...new Set([...(obj.consumed || []), s.key])]; }
    if (s.kind === 'form') obj.consumedForm = [...(obj.consumedForm || []), s.affixId];
  }
}
function clearTransform(obj) {
  delete obj.chain; delete obj.origin; delete obj.consumed; delete obj.consumedForm;
}
function undoTransform(obj) {
  if (obj.origin) Object.assign(obj, obj.origin);
  clearTransform(obj);
}

// Случайная цепочка превращений (для непроверенных комбинаций)
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function randomTransform(combo) {
  const obj = { ...combo };
  for (let step = 0; step < 6; step++) {
    const c = transformCheck(obj);
    if (!c.possible.length) break;
    applyTransform(obj, pick(c.possible));
  }
  return obj.chain ? obj : null;
}

function chainText(obj) {
  return (obj.chain || []).map(id => findStage(id)?.st.name || '?').join(' → ');
}
/* ---------- уровень ступени и стоимость ---------- */
// Уровень ступени — число шагов от стартовой ступени (Вода 1, Лёд 2, Древний лёд 3, Кровь 2). Считается сам.
function stageLevel(el, st, seen = new Set()) {
  if (seen.has(st.id)) return null;
  seen.add(st.id);
  const parent = st.parentId && el.stages.find(s => s.id === st.parentId);
  if (parent) { const p = stageLevel(el, parent, seen); return p == null ? null : p + 1; }
  return st.tier === 'linear' ? 1 : null; // стартовая ступень; у мастерских без «родителя» уровень неизвестен
}
// Множитель стоимости — свой у каждой ступени, задаётся вручную (Кровь ×8, Древний лёд ×4…)
const stageMultiplier = (el, st) => STAGE_MULTIPLIERS.get(el.id + '|' + st.name) ?? null;
function magicLevelOf(obj) {
  const r = findStage(obj.stageId);
  return r ? stageLevel(r.el, r.st) : null;
}
// Все аффиксы заклинания, кроме потраченных на превращение
const spellAffixCount = obj => elementAffixesOf(obj).length + formAffixesOf(obj).length + freeKeys().filter(k => obj[k]).length;
// Расчёт стоимости: { cost, count, level, mult } или { error }
function costCalc(obj) {
  if (!obj.stageId) return { error: 'выбери ступень стихии' };
  const r = findStage(obj.stageId), count = spellAffixCount(obj);
  if (!r) return { error: 'ступень удалена', count };
  const level = stageLevel(r.el, r.st), mult = stageMultiplier(r.el, r.st), stage = r.st.name;
  if (mult == null) return { error: `у ступени «${stage}» нет множителя в правилах`, count, level, stage };
  return { cost: Math.round(count * mult), count, level, mult, stage };
}
// Итоговая стоимость: своя (если включена) или расчётная; у тайных заклинаний — указанная
function spellCost(s) {
  if (s.costManual || !s.stageId) return Math.max(0, Number(s.manaCost) || 0);
  const c = costCalc(s);
  return c.cost ?? Math.max(0, Number(s.manaCost) || 0);
}
const costText = c => c.error ? c.error : `${c.count} аффикс. × ${c.mult} (множитель ступени «${c.stage}») = ${c.cost}`;
const reqText = reqs => (reqs || []).map(q => `${affName(q.affixId) || '?'} ×${q.count}`).join(', ');
const missingText = list => list.map(m => `${affName(m.affixId) || '?'} ×${m.n}`).join(', ');
const consumeText = list => list.map(s => affName(s.affixId)).join(', ');

// Истощение за применение (у тайных — из списка школы или своё, у стихийных — указывается вручную)
const spellExhaust = s => Math.max(0, Number(s.exhaustCost) || 0);
// Постоянная трата характеристик: { magicPower: n, … } — только ненулевые
const STAT_SHORT = { magicPower: 'Сила', magicDefense: 'Защита', magicSense: 'Чувство' };
const statCostOf = s => Object.fromEntries(MANA_STATS.map(k => [k, Math.max(0, Number(s.statCost?.[k]) || 0)]).filter(([, v]) => v));
const statCostText = st => Object.entries(st).map(([k, v]) => `${v} ${STAT_SHORT[k]}`).join(', ');
const castLabel = (cost, ex, icon = '✦ Применить', st = {}) =>
  `${icon} (−${cost}${ex ? ' · +' + ex + ' 💤' : ''}${Object.keys(st).length ? ' · −' + statCostText(st) : ''})`;
const exChip = ex => ex ? h('span', { class: 'cost ex-cost', title: 'Истощение за применение' }, '💤 ' + ex) : null;
const statChips = st => Object.entries(st).map(([k, v]) => h('span', { class: 'cost stat-cost', title: 'Постоянная трата характеристики (сначала из Потенциала)' }, `−${v} ${STAT_SHORT[k]}`));

// Строка «кроме маны тратит»: истощение и характеристики — в конструкторе, книге и тайной магии
function extraCostRow(obj, onChange = commit) {

  return h('div', { class: 'row small extra-cost' },
    h('span', { class: 'muted' }, 'Кроме маны тратит:'),

    MANA_STATS.map(k => h('label', { class: 'chk', title: 'Постоянная трата: сначала из Потенциала, потом из самой характеристики' },
      statDef(k).name, num(obj.statCost, k, { min: 0, class: 'lvl-num', onChange }))));
}

// Как заплатить характеристиками: сначала Потенциал (прежде всего там, где самой характеристики не хватает). null — не хватает.
function statPayment(need) {
  const res = { reserve: 0, stats: {} };
  let left = getBase('reserve');
  const keys = Object.keys(need);
  for (const k of keys) {
    const lack = Math.max(0, need[k] - getBase(k)), take = Math.min(left, lack);
    if (lack > take) return null;
    res.stats[k] = need[k] - take; left -= take; res.reserve += take;
  }
  for (const k of keys) { const take = Math.min(left, res.stats[k]); res.stats[k] -= take; left -= take; res.reserve += take; }
  return res;
}

// Списывает всё сразу: ману, истощение и характеристики. Характеристики — навсегда, поэтому спрашиваем.
function payCost(name, mana, ex, st) {
  const m = state.character.mana;
  if (m.current < mana) { toast('Недостаточно маны', 'error'); return false; }
  const pay = statPayment(st);
  if (!pay) { toast('Не хватает характеристик (с учётом Потенциала)', 'error'); return false; }
  if (!confirmDeadlyExhaustion(ex)) return false;
  if (Object.keys(st).length && !confirm(`«${name}» навсегда тратит: ${statCostText(st)}.` +
    (pay.reserve ? `\nИз Потенциала: ${pay.reserve}` + (Object.values(pay.stats).some(v => v) ? `, из характеристик: ${statCostText(Object.fromEntries(Object.entries(pay.stats).filter(([, v]) => v)))}` : '') + '.' : '') +
    '\nПрименить?')) return false;
  m.current -= mana;
  for (const [k, v] of Object.entries(pay.stats)) if (v) setBase(k, getBase(k) - v);
  if (pay.reserve) setBase('reserve', getBase('reserve') - pay.reserve);
  if (ex) HP().exhaustion = exhaustion() + ex;
  return true;
}
function paidToast(name, mana, ex, st) {
  toast(`${name}: −${mana} маны${ex ? `, +${ex} истощения` : ''}${Object.keys(st).length ? ', −' + statCostText(st) : ''}`, 'ok');
  if (ex && hits() <= 0) toast('☠ Хиты закончились — это смерть', 'error');
}

/* ---------- свойства заклинаний ---------- */
const PROPS = () => PROP_SEED;
const round2 = x => Math.round(x * 100) / 100;
// «50%», «+50 %», «0.5», «0,5» — одно и то же (0.5). Пусто — null, не число — NaN.
function parseFrac(raw) {
  const t = String(raw ?? '').trim().replace(/\s+/g, '').replace(',', '.');
  if (!t) return null;
  const pct = t.endsWith('%'), n = Number(pct ? t.slice(0, -1) : t);
  return isFinite(n) ? (pct ? n / 100 : n) : NaN;
}
// Множитель аффикса: «×2», «x2», «х2», «*2» → 2; иначе null (тогда это прибавка в процентах)
function parseMul(raw) {
  const t = String(raw ?? '').trim().replace(/\s+/g, '').replace(',', '.');
  const m = t.match(/^[×xх*](.+)$/i);
  if (!m) return null;
  const n = Number(m[1]);
  return isFinite(n) ? n : NaN;
}
// Как понят ввод аффикса: «×2» или «+50%»; null — пусто; ⚠ — не число
function affixValText(raw) {
  const m = parseMul(raw);
  if (m != null) return isFinite(m) ? '×' + round2(m) : null;
  const v = parseFrac(raw);
  return v == null ? '' : isFinite(v) ? fmtPct(v) : null;
}
const fmtPct = f => (f >= 0 ? '+' : '−') + round2(Math.abs(f) * 100) + '%';
function parseNumOrNull(raw) {

  if (!t) return null;
  const n = Number(t);
  if (!isFinite(n)) { toast(`«${raw}» — не число`, 'error'); return undefined; }
  return n;
}
const isNum = v => typeof v === 'number' && isFinite(v);
const stageKey = (el, st) => el.id + '|' + st.name;
const stagePropSys = (el, st, pid) => STAGE_PROPS[stageKey(el, st)]?.[pid];
const stagePropUser = (el, st, pid) => EM().stageProps?.[stageKey(el, st)]?.[pid];
const stageProp = (el, st, pid) => isNum(stagePropSys(el, st, pid)) ? stagePropSys(el, st, pid) : stagePropUser(el, st, pid);
const formSeedOf = f => f.sys ? FORM_SEED.find(x => x.n === f.name) : null;

// Свойства стихийного заклинания: отмечены у формы и есть число у (итоговой) ступени.

  warnNegative(d);
  const spell = { id: uid('spell'), uses: 0, createdAt: new Date().toISOString(), ...JSON.parse(JSON.stringify(d)) };

/* =====================================================================

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  let value;
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'value') value = v;
    else if (k === 'checked' || k === 'disabled' || k === 'open') el[k] = true;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  if (value !== undefined) el.value = value;
  return el;
}

function bottomSearch(box, bottom, top) {
  bottom.classList.add('search-bottom');
  requestAnimationFrame(() => {
    if (!box.isConnected) return;
    const need = box.offsetHeight > 2 * innerHeight;
    if (need && !bottom.isConnected) box.after(h('div', { class: 'toolbar search-bottom-row' }, bottom));
    if (!need && bottom.isConnected) {
      const had = document.activeElement === bottom;
      bottom.parentElement.remove();
      if (had) top.focus();
    }
  });

  const box = h('div', { class: wrapCls });
  const mk = () => h('input', { type: 'search', class: 'search', placeholder, value: ui.search[key] || '',
    oninput: e => { ui.search[key] = e.target.value; for (const x of [input, bottom]) if (x !== e.target) x.value = e.target.value; draw(); } });
  const input = mk(), bottom = mk();
  const draw = () => {
    const q = (ui.search[key] || '').trim().toLowerCase();
    const arr = items().filter(it => !q || filter(it, q));
    box.replaceChildren(...(arr.length ? arr.map(renderItem) : [h('div', { class: 'empty' }, q ? 'Ничего не найдено.' : empty)]));
    bottomSearch(box, bottom, input);
  };
  draw();
  return { input, box, draw };

function siteUrl(src) {
  if (!src || /^[a-z][a-z0-9+.-]*:/i.test(src) || src.startsWith('//') || location.href.startsWith(SITE_BASE)) return null;
  return SITE_BASE + encodeURI(src.replace(/^\.?\/+/, ''));
}
function imgFallback() {
  const remote = this.dataset.site ? null : siteUrl(this.getAttribute('src'));
  if (remote) { this.dataset.site = '1'; this.src = remote; return; }
  if (this.dataset.fb) return;
  this.dataset.fb = '1';
  this.src = PLACEHOLDER;
}
const thumb = src => src ? h('img', { class: 'thumb', src, alt: '', loading: 'lazy', onerror: imgFallback }) : null;

function toast(msg, kind = 'info') {
  const t = h('div', { class: 'toast ' + kind }, msg);
  document.getElementById('toasts').append(t);
  setTimeout(() => t.classList.add('hide'), 2300);
  setTimeout(() => t.remove(), 2800);
}

// Адрес вкладки в ссылке (#npc): работают «Назад» в браузере, закладки и ссылки на нужную вкладку
function syncHash() {
  const want = '#' + state.ui.tab;
  if (location.hash === want) { ui.fromHistory = false; return; }
  try {
    if (ui.fromHistory) history.replaceState(null, '', want); else history.pushState(null, '', want);
  } catch { /* в некоторых режимах просмотра история недоступна — тогда просто без адреса */ }
  ui.fromHistory = false;
}
window.addEventListener('popstate', () => {
  const id = decodeURIComponent(location.hash.slice(1));
  if (TABS.some(t => t.id === id) && id !== state.ui.tab) {
    ui.fromHistory = true;
    state.ui.tab = id;
    saveSoon();
    render();
  }
});

function render() {
  if (!TABS.some(t => t.id === state.ui.tab)) state.ui.tab = 'character';
  (state.ui.lastTab ||= {})[groupOf(state.ui.tab).id] = state.ui.tab;
  syncHash();
  renderHeader();
  renderTabs();
  document.documentElement.style.setProperty('--top-h', document.getElementById('top').offsetHeight + 'px');
  const view = document.getElementById('view');
  const tab = TABS.find(t => t.id === state.ui.tab) || TABS[0];
  view.replaceChildren();
  if (ui.master) view.append(masterBar());
  if (CHANGELOG.length && state.ui.seenVersion !== CHANGELOG[0].v) view.append(updateBanner());
  ui.mentionTargets = null;
  // append с разворачиванием массивов и пропуском пустых значений
  tab.render({ append: (...kids) => view.append(...kids.flat(Infinity).filter(k => k != null && k !== false)) });
  // после создания — курсор в поле названия, текст выделен, чтобы сразу печатать своё
  if (ui.focusCell) {
    const el = document.querySelector(`[data-cell="${ui.focusCell}"]`);
    ui.focusCell = null;
    if (el) { el.focus(); el.select?.(); }
  }
  if (ui.focusName) {
    const el = document.querySelector(`[data-name-for="${ui.focusName}"]`);
    ui.focusName = null;
    if (el) { el.scrollIntoView({ block: 'center' }); el.focus(); el.select?.(); }
  }
}

// Кнопки −100 −10 −1 [поле] +1 +10 +100
const STEPS = [100, 10, 1];
const GOLD_STEPS = [10000, 1000, 100, 10, 1];
const stepLabel = n => n >= 1000 ? n / 1000 + 'к' : String(n);
function stepCounter(fn, middle, cls, steps = STEPS) {
  return [
    steps.map(s => btn('−' + stepLabel(s), () => fn(-s), cls, false, '−' + s)),
    middle,
    steps.slice().reverse().map(s => btn('+' + stepLabel(s), () => fn(s), cls, false, '+' + s)),
  ];
}

// Строки брони: магическая — от Защиты от магии и магических предметов; физическая — от предметов. Каждая строка — свои ячейки.
function armorRows(type) {
  const rows = [];
  if (type === 'magic') rows.push({ key: 'magic', name: `Защита от магии ${getTotal('magicDefense')}`,
    cells: Math.floor(Math.max(0, getTotal('magicDefense')) / MAGIC_ARMOR_STEP), defense: null });
  for (const it of state.inventory)
    if (it.equipped && it.armor?.type === type) rows.push({ key: 'item:' + it.id, name: it.name, cells: Math.max(0, Number(it.armor.absorb) || 0), defense: Number(it.armor.defense) || 0 });
  for (const t of state.character.tempArmor || [])
    if (t.type === type) rows.push({ key: 'temp:' + t.id, name: '⏳ ' + t.name, cells: t.cells, defense: t.defense, temp: t });
  return rows;
}
const armorSpent = r => Math.min(r.cells, Math.max(0, Number(state.character.armorSpent?.[r.key]) || 0));
function setArmorSpent(key, n) {
  const m = (state.character.armorSpent ||= {});
  if (n > 0) m[key] = n; else delete m[key];
  commit();
}
function armorRow(r) {
  const spent = armorSpent(r);
  return h('div', { class: 'armor-row' },
    h('span', { class: 'armor-name' }, r.name),
    r.defense != null ? chip('Защита ' + r.defense, 'affix', 'Порог повреждений, который может заблокировать броня') : null,
    h('span', { class: 'armor-cells' }, r.cells
      ? Array.from({ length: r.cells }, (_, i) => h('input', { type: 'checkbox', class: 'armor-cell', checked: i < spent,
          title: i < spent ? 'Ячейка потрачена — снять отметку' : 'Отметить ячейку потраченной',
          onchange: () => setArmorSpent(r.key, i < spent ? i : i + 1) }))
      : h('span', { class: 'small muted' }, r.key === 'magic' ? `первая ячейка — на ${MAGIC_ARMOR_STEP} Защиты от магии` : 'нет ячеек')),
    r.cells ? h('span', { class: 'small muted' }, `свободно ${r.cells - spent} из ${r.cells}`) : null,
    spent ? btn('↺', () => setArmorSpent(r.key, 0), 'ghost small sq', false, 'Восстановить эту броню') : null,
    r.temp ? btn('✕', () => {
      state.character.tempArmor = state.character.tempArmor.filter(t => t !== r.temp);
      delete state.character.armorSpent?.[r.key];
      commit();
    }, 'ghost danger small sq', false, 'Убрать временную броню (покров рассыпался или закончился)') : null);
}
function armorPanel() {
  const mag = armorRows('magic'), phys = armorRows('phys');
  const free = rows => rows.reduce((t, r) => t + r.cells - armorSpent(r), 0), total = rows => rows.reduce((t, r) => t + r.cells, 0);
  const restoreAll = rows => { for (const r of rows) delete state.character.armorSpent?.[r.key]; commit(); };
  const restoreOne = rows => { const r = [...rows].reverse().find(x => armorSpent(x) > 0); if (r) setArmorSpent(r.key, armorSpent(r) - 1); };
  return h('section', { class: 'panel' },
    h('div', { class: 'row' },
      h('div', { class: 'panel-title', style: 'margin:0' }, '🛡 Броня'),
      h('span', { class: 'grow' }),
      btn('Как работает', () => goTab('martial'), 'ghost small'), helpBtn('armor', 'Как лист считает броню')),
    h('div', { class: 'small muted', style: 'margin:4px 0 6px' },
      'Ячейка поглощает одно тяжёлое повреждение; меньшие складываются (3 средних = тяжёлое). Отмечай потраченную ячейку, округляя вверх.'),
    h('div', { class: 'armor-block' },
      h('div', { class: 'row' }, h('b', null, '✨ Магическая'),
        h('span', { class: 'small muted' }, `свободно ${free(mag)} из ${total(mag)}`),
        h('span', { class: 'grow' }),
        btn('+1', () => restoreOne(mag), 'small', !total(mag) || free(mag) === total(mag), 'Восстановить 1 ячейку (хорошее зелье маны)'),
        btn('Восстановить всю', () => restoreAll(mag), 'small', free(mag) === total(mag), 'Сон, медитация, зелье духа')),
      mag.map(armorRow)),
    h('div', { class: 'armor-block' },

function statCard(def, left) {
  const base = getBase(def.key), p = ui.pending[def.key] || 0, total = getTotal(def.key), mods = statModifiers(def.key);
  return h('div', { class: 'stat-card' },
    h('div', { class: 'stat-head' },
      h('span', { class: 'stat-name' }, def.name),
      h('span', { class: 'stat-total' }, total, p ? h('span', { class: 'plan' }, ' → ' + (total + p)) : null)),
    h('div', { class: 'small muted' },
      'База ', base, def.allocatable && !def.noMax ? ` из ${STAT_MAX}` : null, p ? h('span', { class: 'plan' }, ` · план +${p}`) : null,
      mods.map(({ item, ef }) => ` · ${item.name} ${opText(ef)}`)),
    def.allocatable ? h('div', { class: 'row', style: 'margin-top:8px' },
      // «−N» — когда запланировано хотя бы N; «+N» — когда свободных очков хотя бы N (и не упираемся в максимум)
      [100, 10, 1].map(n => btn('−' + (n === 1 ? '' : n), () => { if (p > n) ui.pending[def.key] = p - n; else delete ui.pending[def.key]; render(); },
        'big', p < n, n === 1 ? 'Убрать запланированное очко' : `Убрать ${n} запланированных очков`)),
      [1, 10, 100].map(n => n === 1 || (left >= n && base + p + n <= capOf(def.key))
        ? btn('+' + (n === 1 ? '' : n), () => { ui.pending[def.key] = p + n; render(); }, 'big primary',
            left < n || base + p + n > capOf(def.key),
            base + p >= capOf(def.key) ? `Максимум — ${STAT_MAX}` : left < n ? 'Нет свободных очков' : n === 1 ? 'Вложить очко' : `Вложить ${n} очков`) : null))
      : null,
    def.key === 'reserve' ? h('div', { class: 'small muted', style: 'margin-top:6px' },
      'Открыт: одна из характеристик дошла до ', STAT_MAX, '. Пополняется свободными очками без максимума. ',
      'Когда заклинание тратит характеристику, сначала тратится Потенциал.') : null,
    def.thresholds ? thresholdBlock(def, total) : null);
}

function thresholdBlock(def, total) {
  const reached = Math.floor(Math.max(0, total) / THRESHOLD_STEP);
  // характеристика на максимуме — дальше не вырастет, следующих порогов не показываем
  const maxed = getBase(def.key) >= STAT_MAX;
  const next = (reached + 1) * THRESHOLD_STEP;
  const defined = state.character.statThresholds.filter(t => t.stat === def.key).map(t => t.threshold);
  const maxT = maxed ? reached * THRESHOLD_STEP : Math.max(next, ...defined);
  const rows = [];
  for (let t = THRESHOLD_STEP; t <= maxT; t += THRESHOLD_STEP)
    if (t <= next || defined.includes(t)) rows.push(thrRow(def.key, t, total));
  if (maxed) return fold('thr-' + def.key, `Пороговые свойства: открыто ${reached} · максимум достигнут`, h('div', { class: 'thr-list' }, rows));
  return fold('thr-' + def.key,
    `Пороговые свойства: открыто ${reached} · следующий ${next} (осталось ${next - total})`,
    h('div', { class: 'thr-list' }, rows,
      h('div', null, btn('+ описать порог дальше', () => {
        const t = maxT + THRESHOLD_STEP;
        getThr(def.key, t, true);
        ui.editing.add(thrKey(def.key, t));
        commit();
      }, 'ghost small'))));
}

function thrRow(stat, t, total) {
  const reached = total >= t, rec = getThr(stat, t, false), key = thrKey(stat, t), ed = ui.editing.has(key);
  return h('div', { class: 'thr ' + (reached ? 'reached' : 'future') },
    h('span', { class: 'thr-badge' }, (reached ? '✦ ' : '○ ') + t),
    ed && rec
      ? h('div', { class: 'grow form', style: 'margin:0' },
          field('Название свойства', txt(rec, 'title')),
          field('Описание', txt(rec, 'description', { multi: true, rows: 2 })))
      : h('div', { class: 'grow' },
          h('b', { class: rec?.title ? '' : 'muted' }, rec?.title || (reached ? 'свойство не описано' : '—')),
          rec?.description ? h('div', { class: 'small desc', style: 'margin:2px 0 0' }, rich(rec.description)) : null,
          !reached ? h('div', { class: 'small muted' }, `осталось ${t - total}`) : null),
    btn(ed ? '✓' : '✎', () => {
      if (ed) {
        ui.editing.delete(key);
        if (rec && !rec.title.trim() && !rec.description.trim()) {
          const l = state.character.statThresholds;
          l.splice(l.indexOf(rec), 1);
        }
      } else { getThr(stat, t, true); ui.editing.add(key); }
      commit();
    }, 'ghost small sq'));
}

/* ---------- обмен тайными заклинаниями: файл одного заклинания ---------- */
const SPELL_KIND = FILE_PREFIX + '-spell';
const ARCANE_EXPORT_FIELDS = ['name', 'school', 'level', 'manaCost', 'exhaustCost', 'statCost', 'description', 'tags', 'extra', 'image'];
function exportArcane(sp) {
  const spell = Object.fromEntries(ARCANE_EXPORT_FIELDS.filter(k => sp[k] != null && sp[k] !== '').map(k => [k, sp[k]]));
  const slug = (sp.name || 'spell').replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '');
  downloadText(JSON.stringify({ kind: SPELL_KIND, spellVersion: 1, type: 'arcane', date: new Date().toISOString(), spell }, null, 2),
    `${FILE_PREFIX}-spell-${slug}.json`);
}
// Загруженное заклинание: такое уже есть — заменить текст и стоимость (счётчик и заметки остаются) или добавить копией
function importArcane(data) {
  const src = data.spell || {};
  if (!src.name) { toast('В файле нет заклинания', 'error'); return; }
  const fields = Object.fromEntries(ARCANE_EXPORT_FIELDS.map(k => [k, src[k] ?? (k === 'statCost' ? {} : k === 'tags' ? [] : ['manaCost', 'exhaustCost'].includes(k) ? 0 : '')]));
  const same = state.arcaneSpells.find(x => normName(x.name) === normName(src.name));
  let sp;
  if (same && confirm(`У тебя уже есть «${same.name}». Заменить его описание и стоимость из файла?\nСчётчик и заметки останутся.\n\nОтмена — добавить копией.`)) {
    sp = Object.assign(same, fields);
  } else {
    sp = { id: uid('arc'), ...fields, notes: '', uses: 0 };
    state.arcaneSpells.push(sp);
  }
  if (sp.school && !schoolOpen(sp.school)) toast(`Школа «${schoolName(sp.school)}» у тебя не отмечена — заклинание видно в фильтре «все школы»`);
  commit();
  goToCard('arcane', 'arc-' + sp.id, () => { ui.search.arcane = ''; });
  toast(`Заклинание «${sp.name}» загружено`, 'ok');
}
function spellFileInput() {
  const input = h('input', { type: 'file', accept: '.json,application/json', style: 'display:none', onchange: e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    f.text().then(t => {
      let d;
      try { d = JSON.parse(t); } catch { toast('Файл не является корректным JSON', 'error'); return; }
      if (d?.kind !== SPELL_KIND || d.type !== 'arcane') { toast('Это не файл тайного заклинания', 'error'); return; }
      importArcane(d);
    });
  } });
  return [btn('⬆ Загрузить заклинание', () => input.click(), '', false, 'Файл заклинания от мастера или другого игрока'), input];
}

  const f = ui.filters;
  const order = sp => { const i = ARCANE_SCHOOLS.findIndex(x => x[0] === sp.school); return i < 0 ? 99 : i; };
  // по умолчанию — заклинания отмеченных школ и без школы (если школы не отмечены — все)
  const mine = sp => !openSchools().length || !sp.school || schoolOpen(sp.school);
  const L = searchableList({
    key: 'arcane', placeholder: 'Поиск заклинания…',
    items: () => state.arcaneSpells
      .filter(sp => !f.arcaneSchool ? mine(sp) : f.arcaneSchool === 'all' || (sp.school || 'none') === f.arcaneSchool)
      .sort((a, b) => order(a) - order(b) || byName(a, b)),
    filter: (sp, q) => has(q, sp.name, sp.description, sp.notes, sp.extra, (sp.tags || []).join(' '), schoolName(sp.school)),
    renderItem: arcaneCard, empty: 'Заклинаний нет.',
  });

    h('p', { class: 'hint' }, 'Тайные школы: ', ARCANE_SCHOOLS.map(x => x[1]).join(', '), '. ',
      h('b', null, 'За конкретными заклинаниями обращайтесь к мастеру — он экспортирует для вас красивый текст.'),
      ' Полученный файл добавляется кнопкой «⬆ Загрузить заклинание». Свои заклинания можно завести и вручную. ',
      'Кнопка «Применить» списывает ману, а также истощение и характеристики, если они указаны.'),
    h('section', { class: 'panel' },
      h('div', { class: 'row' }, h('b', null, 'Мои тайные школы:'),
        ARCANE_SCHOOLS.map(([id, name]) => h('label', { class: 'chk' + (schoolOpen(id) ? ' on' : ''), title: SCHOOL_TITLES[id] || null },
          h('input', { type: 'checkbox', checked: schoolOpen(id), onchange: e => {
            const list = (state.character.arcaneSchools ||= []);
            if (e.target.checked) { if (!list.includes(id)) list.push(id); } else list.splice(list.indexOf(id), 1);
            commit();
          } }), name))),
      h('div', { class: 'small muted', style: 'margin-top:4px' },
        'Отметь школы, доступные персонажу (в начале игры — одна). В списке по умолчанию — заклинания этих школ и без школы. ',
        helpBtn('schools', 'Про тайные школы'))),
    toolbar(btn('+ Своё заклинание', () => {
      const school = ARCANE_SCHOOLS.some(x => x[0] === f.arcaneSchool) ? f.arcaneSchool : '';
      const sp = { id: uid('arc'), name: nameFromSearch('arcane', 'Новое заклинание'), school, description: '', manaCost: 0, exhaustCost: 0, level: '', notes: '', uses: 0 };
      state.arcaneSpells.push(sp);
      ui.editing.add(sp.id);
      ui.focusName = sp.id;
      commit();
    }, 'primary'), spellFileInput(), L.input,
      sel(f.arcaneSchool || '', [['', 'мои школы'], ['all', 'все школы'], ...ARCANE_SCHOOLS, ['none', 'без школы']], val => { f.arcaneSchool = val; render(); })),
    L.box);
}

// Отметка «этот аффикс мне доступен как свободный» = связь типа free у аффикса
function setFree(a, on) {
  if (on && !a.links.some(l => l.type === 'free')) a.links.push(newLink('free'));
  if (!on) a.links = a.links.filter(l => l.type !== 'free');
}

function freeAffixesSection() {
  const fresh = { name: '' };
  const create = () => {
    const name = fresh.name.trim();
    if (!name) return;
    let a = EM().affixes.find(x => sameText(x.name, name));
    if (!a) { a = { id: uid('affix'), name, description: '', requirements: '', notes: '', links: [] }; EM().affixes.push(a); }
    setFree(a, true);
    commit();
  };
  const L = searchableList({
    key: 'free', placeholder: 'Найти аффикс…', wrapCls: 'free-grid',
    items: () => EM().affixes.slice().sort(byName),
    filter: (a, q) => has(q, a.name),
    renderItem: a => {
      const own = a.links.some(l => l.type === 'free'), given = freeAffixGivers(a.id);
      const on = own || given.length > 0;
      return h('label', { class: 'chk free-item' + (on ? ' on' : ''), title: given.length ? 'Даёт: ' + given.join(', ') : null },
        h('input', { type: 'checkbox', checked: on, disabled: !own && given.length > 0, onchange: e => { setFree(a, e.target.checked); commit(); } }),
        a.name, given.length && !own ? h('span', { class: 'muted small' }, ' ✦') : null);
    },
    empty: 'Аффиксов нет.',
  });
  const frees = availableFreeAffixes();
  return h('div', { class: 'panel' },
    h('p', { class: 'hint', style: 'margin-bottom:8px' },
      'Отметь галочкой аффиксы, которые ты можешь использовать как свободные. Они появятся в конструкторе заклинаний ',
      'и в непроверенных комбинациях.'),
    h('div', { class: 'chips', style: 'margin-bottom:10px' }, frees.length
      ? frees.map(a => {
          const given = freeAffixGivers(a.id), own = a.links.some(l => l.type === 'free');
          return h('span', { class: 'chip free tag', title: given.length ? 'Даёт: ' + given.join(', ') : null }, a.name,
            own ? h('button', { type: 'button', class: 'x', title: 'Убрать из свободных', onclick: () => { setFree(a, false); commit(); } }, '×')
              : h('span', { class: 'muted small' }, ' ✦ ' + given.join(', ')));
        })
      : h('span', { class: 'small muted' }, 'Пока ни одного.')),
    toolbar(L.input,
      h('input', { placeholder: 'новый свободный аффикс', oninput: e => { fresh.name = e.target.value; }, onkeydown: e => { if (e.key === 'Enter') create(); } }),
      btn('Создать', create, 'small')),
    L.box);
}

  const learned = isElementAvailable(el);
  const avail = el.stages.filter(st => isStageAvailable(el, st));
  return h('section', { class: 'panel element el-' + el.id + (learned ? '' : ' unlearned') },
    h('div', { class: 'card-head' },
      h('div', { class: 'el-name' }, (ELEMENT_ICON[el.id] || '') + ' ' + el.name),
      elementScheme(el.id) ? btn('?', () => showScheme(el), 'ghost small sq help-btn', false, 'Схема превращений') : null,
      h('span', { class: 'muted small' }, 'уровень'), levelCtl(el, 'level'),
      elementBonus(el.id).length ? chip(`= ${elLevel(el)} (${elementBonus(el.id).map(x => '+' + x.ef.value + ' от «' + x.src.name + '»').join(', ')})`, 'mod') : null),
    h('div', { class: 'small', style: 'margin-top:4px' }, learned
      ? [h('span', { class: 'muted' }, 'Доступно: '), avail.length ? avail.map(s => s.name).join(', ') : h('span', { class: 'muted' }, 'ничего')]
      : h('span', { class: 'lock' }, '🔒 Не изучена — подними уровень до 1, чтобы открыть стихию')),
    el.description ? h('div', { class: 'desc small muted' }, rich(el.description)) : null,
    el.conditions ? h('div', { class: 'desc small' }, h('b', null, 'Повышение: '), rich(el.conditions)) : null,
    fold('stages-' + el.id, `Ступени и уровни (${el.stages.filter(isStageShown).length})`, stagesList(el)));
}

function stagesList(el) {
  const out = [];
  for (const [tier, label] of Object.entries(TIERS)) {
    if (HIDDEN_TIERS.includes(tier)) continue;
    const list = el.stages.filter(s => (s.tier || 'advanced') === tier);
    if (!list.length) continue;
    out.push(h('div', { class: 'tier-title' }, label), list.map(st => stageRow(el, st)));
  }
  return h('div', null, out);
}

function stageRow(el, st) {
  const ok = isStageAvailable(el, st), affs = affixesForTarget('stage', st.id);
  const parent = st.parentId ? el.stages.find(s => s.id === st.parentId) : null;
  return h('div', { class: 'stage ' + (ok ? 'ok' : 'locked') },
    h('div', { class: 'stage-head' },
      h('span', { class: 'stage-icon' }, ok ? '✦' : '🔒'),
      h('b', null, st.name),
      hasMinLevel(st) ? chip('открывается с ур. ' + st.minLevel) : null,
      chip('ур. ' + (stageLevel(el, st) ?? '?'), '', stageLevel(el, st) == null ? 'Уровень неизвестен: укажи, из какой ступени она растёт' : 'Уровень ступени — шагов от стартовой'),
      stageMultiplier(el, st) != null ? chip('💧 ×' + stageMultiplier(el, st), 'affix', 'Множитель стоимости маны для этой ступени')
        : chip('💧 ×?', 'locked', 'В правилах нет множителя для этой ступени'),
      parent ? h('span', { class: 'muted small' }, '← ' + parent.name) : null,
      h('span', { class: 'grow' }),
      h('label', { class: 'chk small', title: 'Отметить, что ступень открыта (независимо от уровня)' },
        h('input', { type: 'checkbox', checked: st.unlocked, onchange: e => { st.unlocked = e.target.checked; commit(); } }), 'открыта')),
    stageOpeners(st.id).length ? h('div', { class: 'small plan' }, '✦ открыта: ' + stageOpeners(st.id).join(', ')) : null,
    affs.length ? h('div', { class: 'chips' }, affs.map(a => chip(a.name, ok ? 'affix' : 'locked', affTip(a.id)))) : null,
    stagePropChips(el, st),
    st.reqs?.length ? h('div', { class: 'small muted', style: 'margin-top:3px' }, 'Требуется: ', h('span', { class: 'req-text' }, reqText(st.reqs))) : null,
    st.requirements ? h('div', { class: 'small muted', style: 'margin-top:3px' }, '📝 ', rich(st.requirements)) : null,
    st.description ? h('div', { class: 'small desc', style: 'margin-top:3px' }, rich(st.description)) : null);
}

function targetAffixEditor(type, targetId, withLevel) {
  const linked = EM().affixes.flatMap(a => a.links.filter(l => l.type === type && l.targetId === targetId).map(l => ({ a, l })));
  const others = EM().affixes.filter(a => !linked.some(x => x.a === a)).sort(byName);
  const fresh = { name: '' };
  const create = () => {
    const name = fresh.name.trim();
    if (!name) return;
    let a = EM().affixes.find(x => x.name.toLowerCase() === name.toLowerCase());
    if (!a) { a = { id: uid('affix'), name, description: '', requirements: '', notes: '', links: [] }; EM().affixes.push(a); }
    a.links.push(newLink(type, targetId));
    commit();
  };
  return h('div', { class: 'sub' },
    h('div', { class: 'sub-title' }, 'Аффиксы'),
    linked.length ? linked.map(({ a, l }) => h('div', { class: 'row small' },
      chip(a.name, 'affix'),
      withLevel ? ['с уровня', num(l, 'minLevel', { min: 0, class: 'lvl-num' })] : null,
      btn('✕', () => { a.links.splice(a.links.indexOf(l), 1); commit(); }, 'ghost danger small sq', false, 'Отвязать')))
      : h('div', { class: 'small muted' }, 'Нет привязанных аффиксов.'),
    h('div', { class: 'row small' },
      sel('', [['', '+ привязать существующий…'], ...others.map(a => [a.id, a.name])], val => {
        if (!val) return;
        findAffix(val).links.push(newLink(type, targetId));
        commit();
      }),
      h('span', { class: 'muted' }, 'или'),
      h('input', { placeholder: 'новый аффикс', oninput: e => { fresh.name = e.target.value; },
        onkeydown: e => { if (e.key === 'Enter') create(); } }),
      btn('Создать и привязать', create, 'small')));
}

function formCard(f) {
  const canEdit = !f.sys || ui.master, ok = isFormAvailable(f), ed = canEdit && ui.editing.has(f.id), unl = formUnlockers(f.id);

function comboSelects(obj, onChange, strict) {
  return h('div', { class: 'combo' }, spellParts().map(p => {
    const opts = p.options(obj), cur = obj[p.key] || '', spent = isConsumed(obj, p.key) && !cur;
    if (spent)
      return field(p.label, h('select', { disabled: true, title: 'Аффикс потрачен на превращение' }, h('option', null, '— потрачен —')));
    const items = [['', p.optional ? '— любая —' : '— не выбрано —'],
      ...opts.map(o => [o.id, o.locked ? `🔒 ${o.label} — ${o.reason}` : o.label, { disabled: strict && o.locked }])];
    if (cur && !opts.some(o => o.id === cur)) items.push([cur, `⚠ ${p.name(cur) || 'удалено'} (не связано)`]);
    if (!opts.length && !cur) items[0][1] = emptyPartHint(p, obj);
    return field(p.label, sel(cur, items, val => {
      obj[p.key] = val || null;
      // ручная смена стихии или ступени отменяет цепочку превращений
      if ((p.key === 'elementId' || p.key === 'stageId') && obj.chain) clearTransform(obj);
      resetDependents(obj, p.key);
      if (p.key === 'elementId' && !obj.stageId && findElement(obj.elementId)) obj.stageId = defaultStage(findElement(obj.elementId));
      onChange();
    }));
  }));
}
function emptyPartHint(p, obj) {
  if (p.key === 'formId') return '— форм ещё нет —';
  if (p.free) return '— нет свободных аффиксов —';
  if (p.key === 'stageId') return '— сначала стихия —';
  return '— пусто —';
}

function issuesView(obj) {
  const iss = spellIssues(obj);
  if (!iss.length) return null;
  return h('div', { class: 'small', style: 'margin-top:4px' }, iss.map(i =>
    h('div', { class: i.kind === 'missing' ? 'muted' : i.kind === 'locked' ? 'lock' : 'warn' }, i.kind === 'missing' ? '· ' + i.text : i.text)));
}

// Описания частей заклинания (только те, у которых описание заполнено)
function partsInfo(obj) {
  const rows = [];
  const add = (name, text) => { if (name && text?.trim()) rows.push(h('div', null, h('b', null, name), ' — ', rich(text.trim()))); };
  const seen = new Set();
  const addAff = id => { if (!id || seen.has(id)) return; seen.add(id); const a = findAffix(id); if (a) add(a.name, a.description); };
  const f = findForm(obj.formId);
  elementAffixesOf(obj).forEach(addAff);
  if (f) add('Форма «' + f.name + '»', f.description);
  formAffixesOf(obj).forEach(addAff);
  freeKeys().forEach(k => addAff(obj[k]));
  return rows.length ? h('div', { class: 'parts-info small' }, rows) : null;
}

function chainLine(obj) {
  if (!obj.chain?.length) return null;
  const lvl = magicLevelOf(obj);
  return h('div', { class: 'chain small' }, '⚗ Превращение: ', h('b', null, chainText(obj)), lvl != null ? ` · уровень ступени ${lvl}` : '');
}

// Подсказки превращений в конструкторе: что можно получить, чего не хватает
function transformPanel(d) {
  const out = [];
  if (d.chain?.length) {
    out.push(h('div', { class: 'row' }, chainLine(d), btn('↶ Отменить превращение', () => { undoTransform(d); render(); }, 'ghost small')));
  }
  if (d.elementId && !d.stageId)
    out.push(h('div', { class: 'small muted' }, 'Выбери ступень стихии — тогда будут видны возможные превращения.'));
  if (d.elementId && d.stageId) {
    const c = transformCheck(d);
    for (const opt of c.possible) {
      const affs = stageAffixIds(opt.stage.id);
      out.push(h('div', { class: 'row transform-ok' },
        h('span', null, '⚗ Можно превратить → ', h('b', null, opt.stage.name)),
        affs.length ? h('span', { class: 'affs' }, '(', affs.map((id, i) => [i ? ', ' : '', h('b', { class: 'req-text' }, affName(id))]), ')') : null,
        opt.consume.length ? h('span', { class: 'small muted' }, 'потратит: ' + consumeText(opt.consume)) : null,
        btn('Превратить', () => {
          applyTransform(d, opt);
          render();
          toast(`Превращение → ${opt.stage.name}`, 'ok');
        }, 'primary small')));
    }
    for (const m of c.missing)
      out.push(h('div', { class: 'small muted' }, `До «${m.stage.name}» не хватает: `, h('span', { class: 'warn' }, missingText(m.missing))));
  }
  return out.length ? h('div', { class: 'transform-box' }, out) : null;
}

/* ---------- комбо: связка заклинаний ---------- */
const combosUsing = (kind, id) => {
  const names = state.combos.filter(c => c.steps.some(st => st.kind === kind && st.spellId === id)).map(c => '«' + c.name + '»');
  return names.length ? `\n\nОно входит в комбо: ${names.join(', ')}. Там этот шаг станет «удалено».` : '';
};
// Шаг комбо ссылается на заклинание из книги (book) или тайной школы (arcane) по id
const comboStepSpell = st => (st.kind === 'arcane' ? state.arcaneSpells : state.spellbook).find(x => x.id === st.spellId) || null;
const comboCost = c => c.steps.reduce((sum, st) => { const sp = comboStepSpell(st); return sum + (sp ? spellCost(sp) : 0); }, 0);
const comboExhaust = c => c.steps.reduce((sum, st) => { const sp = comboStepSpell(st); return sum + (sp ? spellExhaust(sp) : 0); }, 0);
const comboStatCost = c => c.steps.reduce((sum, st) => {
  const sp = comboStepSpell(st);
  if (sp) for (const [k, v] of Object.entries(statCostOf(sp))) sum[k] = (sum[k] || 0) + v;
  return sum;
}, {});
const comboBroken = c => c.steps.filter(st => !comboStepSpell(st)).length;

function castCombo(c) {
  if (!c.steps.length) { toast('В комбо нет заклинаний', 'error'); return; }
  const cost = comboCost(c), ex = comboExhaust(c), st = comboStatCost(c), name = c.name || 'Комбо';
  for (const step of c.steps) { const sp = comboStepSpell(step); if (sp?.stageId) warnNegative(sp); }
  if (!payCost(name, cost, ex, st)) return;
  c.uses = (c.uses || 0) + 1;
  for (const step of c.steps) { const sp = comboStepSpell(step); if (sp) sp.uses = (sp.uses || 0) + 1; }
  commit();
  paidToast(name, cost, ex, st);
}

// Список для выбора шага: книга и тайная школа

    { group: '✦ Тайная магия', items: state.arcaneSpells.filter(isArcaneKnown).sort(byName).map(sp => ['arcane:' + sp.id, `${sp.name} · 💧${spellCost(sp)}`]) }];
}
const parseStepValue = v => { const i = v.indexOf(':'); return { id: uid('step'), kind: v.slice(0, i), spellId: v.slice(i + 1) }; };

}

          btn('↑', () => { c.steps.splice(i, 1); c.steps.splice(i - 1, 0, st); commit(); }, 'ghost small sq', i === 0, 'Раньше'),
          btn('↓', () => { c.steps.splice(i, 1); c.steps.splice(i + 1, 0, st); commit(); }, 'ghost small sq', i === c.steps.length - 1, 'Позже'),
          btn('✕', () => { c.steps.splice(i, 1); commit(); }, 'ghost danger small sq', false, 'Убрать шаг'))),
