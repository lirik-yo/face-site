/* =====================================================================
   UNTESTED COMBINATIONS
   Пространство вариантов: (стихия + ступень) × форма × свободные аффиксы (аффиксы ступени и формы идут целиком),
   всё только из доступного сейчас. Показывается 10 случайных вариантов (из них 2–3 с превращением, если есть),
   которые не скрыты, не проверены и не записаны в книгу. В state хранятся только отмеченные / свои записи.
   ===================================================================== */
const comboKey = o => comboFields().map(k => o[k] || '').join('|');
const UNTESTED_SAMPLE = 10;
const UNTESTED_TRANSFORM_QUOTA = 3;
const availableFreeAffixes = () => EM().affixes.filter(a => a.links.some(l => l.type === 'free' && linkStatus(l).ok) || freeAffixGivers(a.id).length).sort(byName);

// Наборы свободных аффиксов без учёта порядка (повторы разрешены: Укрепление + Укрепление)
function freeTuples(ids, k) {
  if (!ids.length) return [Array(k).fill(null)];
  const res = [];
  const rec = (start, acc) => {
    if (acc.length === k) { res.push(acc.slice()); return; }
    for (let i = start; i < ids.length; i++) { acc.push(ids[i]); rec(i, acc); acc.pop(); }
  };
  rec(0, []);
  return res;
}
const freeSetKey = vals => vals.map(x => x || '').sort().join(',');

function comboSpace() {
  const elParts = [], formParts = [];
  for (const el of EM().elements.filter(isElementAvailable))
    for (const st of el.stages.filter(s => isStageAvailable(el, s))) elParts.push({ elementId: el.id, stageId: st.id });
  for (const f of EM().forms.filter(isFormAvailable)) formParts.push({ formId: f.id });
  const keys = freeKeys();
  const tuples = freeTuples(availableFreeAffixes().map(a => a.id).sort(), keys.length);
  const sets = {
    el: new Set(elParts.map(p => `${p.elementId}|${p.stageId}`)),
    form: new Set(formParts.map(p => p.formId)),
    free: new Set(tuples.map(freeSetKey)),
  };
  return { elParts, formParts, tuples, keys, sets, total: elParts.length * formParts.length * tuples.length };
}
function comboAt(sp, i) {
  const t = sp.tuples[i % sp.tuples.length];
  i = Math.floor(i / sp.tuples.length);
  const fp = sp.formParts[i % sp.formParts.length];
  i = Math.floor(i / sp.formParts.length);
  return { ...sp.elParts[i], ...fp, ...Object.fromEntries(sp.keys.map((k, j) => [k, t[j]])) };
}
function inSpace(sp, c) {
  return sp.sets.el.has(`${c.elementId}|${c.stageId}`)
    && sp.sets.form.has(c.formId) && sp.sets.free.has(freeSetKey(sp.keys.map(k => c[k])));
}
// Ключи, которые не надо предлагать: проверенные, скрытые, уже в книге (по исходной комбинации)
function excludedKeys() {
  const s = new Set(state.spellbook.map(sp => comboKey(sp.origin || sp)));
  for (const u of state.untestedCombinations) if (u.status !== 'untested') s.add(comboKey(u));
  return s;
}
function eligibleCount(sp, excl) {
  const fields = comboFields();
  let n = sp.total;
  for (const k of excl) {
    const c = Object.fromEntries(k.split('|').map((v, i) => [fields[i], v || null]));
    if (inSpace(sp, c)) n--;
  }
  return Math.max(0, n);
}
const canTransform = c => transformCheck(c).possible.length > 0;

function randomCombos(sp, count, skip, pred) {
  const res = [];
  if (!sp.total || count <= 0) return res;
  const take = c => {
    const k = comboKey(c);
    if (skip.has(k) || (pred && !pred(c))) return;
    skip.add(k);
    res.push(c);
  };
  if (sp.total <= 20000) {
    const idx = [...Array(sp.total).keys()];
    for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
    for (const i of idx) { if (res.length >= count) break; take(comboAt(sp, i)); }
  } else {
    for (let tries = 0; res.length < count && tries < count * 300; tries++) take(comboAt(sp, Math.floor(Math.random() * sp.total)));
  }
  return res;
}

// Текущая «десятка»: сохраняется между перерисовками, выбывшие варианты заменяются новыми
function currentSample(sp) {
  const excl = excludedKeys();
  const sample = (ui.untestedSample || []).filter(c => inSpace(sp, c) && !excl.has(comboKey(c)));
  const skip = new Set([...excl, ...sample.map(comboKey)]);
  const haveT = sample.filter(canTransform).length;
  if (haveT < UNTESTED_TRANSFORM_QUOTA)
    sample.push(...randomCombos(sp, Math.min(UNTESTED_TRANSFORM_QUOTA - haveT, UNTESTED_SAMPLE - sample.length), skip, canTransform));
  sample.push(...randomCombos(sp, UNTESTED_SAMPLE - sample.length, skip));
  ui.untestedSample = sample;
  return sample;
}

// Результат превращения для варианта — случайный, но запоминается, чтобы не прыгал при перерисовке
function untestedResult(u) {
  ui.untestedResults ||= {};
  const k = comboKey(u);
  if (!(k in ui.untestedResults)) ui.untestedResults[k] = randomTransform(snapshotParts(u)) || null;
  return ui.untestedResults[k];
}

function materialize(x) {
  if (!x.auto) return x.u;
  const u = { ...x.u, id: uid('try') };
  state.untestedCombinations.push(u);
  x.auto = false;
  x.u = u;
  return u;
}

          state.untestedCombinations.push(u);

    manual.length ? fold('untested-manual', `Свои комбинации (${manual.length})`, wrap(manual.map(u => ({ u, auto: false }))), true, 'section') : null,
    tested.length ? fold('untested-tested', `Проверенные (${tested.length})`, wrap(tested.map(u => ({ u, auto: false }))), false, 'section') : null,
    hidden.length ? fold('untested-hidden', `Скрытые (${hidden.length})`, wrap(hidden.map(u => ({ u, auto: false }))), false, 'section') : null);

// Формула: «Вода + Вода (Управление) + Стена (Укрепление) + Укрепление». Аффиксы полужирным, потраченные — «—».
function comboEq(u, ending) {
  const plus = () => h('span', { class: 'plus' }, ' + ');
  const q = () => h('span', { class: 'q' }, '?');
  const base = name => name ? h('span', { class: 'eq-base' }, name) : q();
  const affs = list => list.length ? [' (', list.map((x, i) => [i ? ', ' : '',
    x.spent ? h('span', { class: 'eq-spent', title: affName(x.id) + ' — потрачен' }, '—') : h('b', { class: 'eq-affix', title: affTip(x.id) }, affName(x.id))]), ')'] : null;
  const el = findElement(u.elementId);
  const out = [el ? (ELEMENT_ICON[el.id] || '') + ' ' : '', base(el?.name), plus(), base(findStage(u.stageId)?.st.name),
    affs(elementAffixesOf(u).map(id => ({ id }))), plus(), base(findForm(u.formId)?.name), affs(formAffixView(u))];
  for (const k of freeKeys()) {
    out.push(plus());
    out.push(u[k] ? h('b', { class: 'eq-affix', title: affTip(u[k]) }, affName(u[k]) || '?') : isConsumed(u, k) ? h('span', { class: 'eq-spent', title: 'потрачен' }, '—') : q());
  }
  if (ending) out.push(h('span', { class: 'plus' }, ending));
  return h('div', { class: 'untested-eq grow' }, out);
}

/* =====================================================================
   HEALTH — хиты и раны
   Раны не конвертируются, а считаются: 3 лёгкие = 1 средняя, 3 средние = 1 тяжёлая, 4 тяжёлые = смерть.
   Хиты = максимум (3 × 3 × 4 = 36) − урон в «лёгких ранах». У каждой раны — пояснение, что повреждено.
   ===================================================================== */
const WOUND_TYPES = [
  { key: 'light', name: 'Лёгкие раны', one: 'лёгкая', short: 'Лёг.', icon: '•' },
  { key: 'medium', name: 'Средние раны', one: 'средняя', short: 'Сред.', icon: '✕' },
  { key: 'heavy', name: 'Тяжёлые раны', one: 'тяжёлая', short: 'Тяж.', icon: '✖' },
];
const HP = () => state.character.health;
const newWound = (text = '') => ({ id: uid('wound'), text, date: new Date().toISOString() });

// Вес каждой раны в «лёгких ранах»
function woundWeights() {
  const lpm = WOUND_RULES.lightPerMedium, mph = WOUND_RULES.mediumPerHeavy;
  return { light: 1, medium: lpm, heavy: lpm * mph };
}
const heavyToDeath = () => Math.max(1, getTotal('heavyToDeath'));
const maxHits = () => woundWeights().heavy * heavyToDeath();
const damage = () => { const w = woundWeights(); return WOUND_TYPES.reduce((s, t) => s + HP()[t.key].items.length * w[t.key], 0); };
// Истощение копится рядом с ранами: каждое отнимает хиты как средняя рана. Сбрасывается сном.
const exhaustion = () => Math.max(0, Number(HP().exhaustion) || 0);
const hits = () => maxHits() - damage() - exhaustion() * woundWeights().medium;
// Истощение, после которого хитов не останется, — смерть: спрашиваем
const exhaustionKills = n => n > 0 && hits() > 0 && hits() - n * woundWeights().medium <= 0;
const confirmDeadlyExhaustion = n => !exhaustionKills(n) ||
  confirm(`+${n} истощения отнимет ${n * woundWeights().medium} хитов, а осталось ${hits()}. Это убьёт персонажа. Продолжить?`);
function addExhaustion(n) {
  if (!confirmDeadlyExhaustion(n)) return;
  HP().exhaustion = Math.max(0, exhaustion() + n);
  commit();
  if (n > 0 && hits() <= 0) toast('☠ Хиты закончились — это смерть', 'error');
}
function sleepWell() {
  HP().exhaustion = 0;
  commit();
  toast('Сон: истощение сброшено, раны остались', 'ok');
}

function addWound(key, text = '') {
  const w = newWound(text);
  HP()[key].items.push(w);
  ui.focusWound = w.id;
}
// Новая рана: переходим на лист персонажа и ставим курсор в поле пояснения
function takeWound(key) {
  addWound(key);
  state.ui.tab = 'character';
  commit();
  if (hits() <= 0) toast('☠ Хиты закончились — это смерть', 'error');
  const input = ui.focusWound && document.getElementById('wound-' + ui.focusWound);
  ui.focusWound = null;
  if (input) { input.scrollIntoView({ block: 'center' }); input.focus(); }
}
function healWound(key, w) {
  const t = HP()[key];
  t.items = t.items.filter(x => x !== w);
}

function hitsBar(thin) {
  const max = maxHits(), cur = hits();
  return h('div', { class: 'bar hp-bar' + (thin ? ' thin' : '') + (cur <= 0 ? ' dead' : '') },
    h('div', { style: `width:${max ? Math.max(0, cur) / max * 100 : 0}%` }));
}

function woundList(def) {

        h('span', { class: 'grow' }),
        btn('−', () => addExhaustion(-1), 'small sq', !exhaustion(), 'Снять одно истощение (если отметила по ошибке)'),

      statModifiers('heavyToDeath').length ? h('span', { class: 'plan' }, ` (${WOUND_RULES.heavyToDeath} ${bonusText('heavyToDeath')})`) : null),
    h('div', { class: 'row', style: 'margin-top:8px' },
      btn('Залечить все раны', () => {
        if (!confirm('Убрать все раны вместе с пояснениями?')) return;
        for (const t of WOUND_TYPES) hp[t.key].items = [];
        commit();
      }, 'small', !damage())));
}

function healthMini() {
  const cur = hits(), max = maxHits();
  const tipFor = def => {

/* =====================================================================
   DICE — броски кубиков
   Формат: 2d6+3, d20, 4d6kh3 (оставить 3 лучших), 2d20kl1 (худший). Можно писать «к» вместо «d».
   ===================================================================== */
const DICE = [4, 6, 8, 10, 12, 20, 100];
const MAX_DICE_HISTORY = 50;

function rnd(sides) {
  if (window.crypto?.getRandomValues) return 1 + (crypto.getRandomValues(new Uint32Array(1))[0] % sides);
  return 1 + Math.floor(Math.random() * sides);
}

function rollExpr(expr) {
  const s = String(expr || '').replace(/\s+/g, '').toLowerCase().replace(/[кд]/g, 'd');
  if (!s) throw new Error('пустая формула');
  const re = /([+-]?)(?:(\d*)d(\d+)(?:(kh|kl)(\d+))?|(\d+))/y;
  const parts = [];
  let total = 0, pos = 0;
  while (pos < s.length) {
    re.lastIndex = pos;
    const m = re.exec(s);
    if (!m || m[0] === '') throw new Error('не понимаю: «' + s.slice(pos) + '»');
    if (pos > 0 && !m[1]) throw new Error('нужен знак + или − перед «' + m[0] + '»');
    pos = re.lastIndex;
    const sign = m[1] === '-' ? -1 : 1;
    if (m[3]) {
      const n = Math.min(100, Math.max(1, parseInt(m[2] || '1'))), sides = parseInt(m[3]);
      if (sides < 2) throw new Error('у кубика должно быть хотя бы 2 грани');
      const dice = Array.from({ length: n }, () => rnd(sides));
      let kept = dice.map((_, i) => i);
      if (m[4]) {
        const k = Math.min(n, Math.max(1, parseInt(m[5])));
        kept = [...dice.keys()].sort((a, b) => m[4] === 'kh' ? dice[b] - dice[a] : dice[a] - dice[b]).slice(0, k);
      }
      const sum = kept.reduce((a, i) => a + dice[i], 0);
      total += sign * sum;
      parts.push({ sign, n, sides, dice, kept, keep: m[4] ? m[4] + m[5] : '' });
    } else {
      total += sign * parseInt(m[6]);
      parts.push({ sign, value: parseInt(m[6]) });
    }
  }
  return { expr: s, total, parts };
}

function doRoll(expr, label) {
  let r;
  try { r = rollExpr(expr); } catch (e) { toast('Ошибка броска: ' + e.message, 'error'); return; }
  r.id = uid('roll');
  r.label = (label || '').trim();
  r.time = new Date().toISOString();
  const hist = state.dice.history;
  hist.unshift(r);
  hist.length = Math.min(hist.length, MAX_DICE_HISTORY);
  commit();
}

function rollBreakdown(r) {
  return r.parts.map((p, i) => [
    i || p.sign < 0 ? h('span', { class: 'plus' }, p.sign < 0 ? ' − ' : ' + ') : null,
    p.value != null ? h('span', null, p.value) : h('span', { class: 'die-group' },
      h('span', { class: 'muted small' }, `${p.n}d${p.sides}${p.keep}: `),
      p.dice.map((v, j) => h('span', {
        class: 'die' + (p.kept.includes(j) ? '' : ' dropped') + (v === p.sides ? ' max' : v === 1 ? ' min' : ''),
      }, v)))]);
}

/* =====================================================================
   EXPERIENCE CHECKLIST
   У каждого пункта: отметка и заметка текущей сессии + журнал log того, что уже было,
   чтобы не повторяться. «Завершить сессию» переносит отмеченное в журнал.
   ===================================================================== */
const normText = s => String(s || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
// Похожие записи журнала: одна строка содержит другую или совпадает большинство слов
function similarLogs(item, text) {
  const t = normText(text);
  if (t.length < 4) return [];
  const words = new Set(t.split(' ').filter(w => w.length > 3));
  return item.log.filter(e => {
    const o = normText(e.text);
    if (!o) return false;
    if (o.includes(t) || t.includes(o)) return true;
    const ow = o.split(' ').filter(w => w.length > 3);
    const common = ow.filter(w => words.has(w)).length;
    return common >= 2 && common >= Math.min(words.size, ow.length) * 0.6;
  });
}

function logEntry(item, text) {
  if (!text.trim()) return;
  item.log.unshift({ id: uid('xp'), text: text.trim(), date: new Date().toISOString() });
}

// За сессию: базовые очки + по одному за каждый отмеченный пункт
const SESSION_BASE_POINTS = 5;
// Предупреждение об отмеченных пунктах без описания; updateUndescribed() пересчитывает его без перерисовки
function undescribedText() {
  const n = state.experience.items.filter(i => i.checked && !i.note.trim()).length;
  return n ? `Отмечено без описания: ${n}. Чтобы завершить сессию, напиши у каждого отмеченного пункта, за что он.` : '';
}
function undescribedNote() {
  const t = undescribedText();
  return h('div', { id: 'exp-undescribed', class: 'small warn', style: 'margin:-4px 0 10px' + (t ? '' : ';display:none') }, t);
}
function updateUndescribed() {
  const el = document.getElementById('exp-undescribed');
  if (!el) return;
  const t = undescribedText();
  el.textContent = t;
  el.style.display = t ? '' : 'none';
}
const isEmptyLog = e => !e.text?.trim() || e.text.trim() === '(без описания)';
function finishSession() {
  const items = state.experience.items, checked = items.filter(i => i.checked);
  const undescribed = checked.filter(i => !i.note.trim());
  if (undescribed.length) {
    toast('Опиши, за что отмечено: ' + undescribed.map(i => '«' + i.text.replace(/\.$/, '') + '»').join(', '), 'error');
    const first = document.getElementById('expnote-' + undescribed[0].id);
    if (first) { first.scrollIntoView({ block: 'center' }); first.focus(); }
    return;
  }
  const points = SESSION_BASE_POINTS + checked.length;
  if (!confirm(`Завершить сессию?

Свободные очки характеристик: +${points} (${SESSION_BASE_POINTS} + ${checked.length} за отмеченные пункты).` +
    (checked.length ? `
Отмеченные пункты уйдут в журнал, отметки снимутся.` : ''))) return;
  for (const it of checked) { logEntry(it, it.note); it.checked = false; it.note = ''; }
  state.character.freeStatPoints = (Number(state.character.freeStatPoints) || 0) + points;
  commit();
  toast(`Сессия завершена: +${points} свободных очков характеристик`, 'ok');
}

function renderExperienceTab(v) {
  const items = state.experience.items, n = items.filter(i => i.checked).length;
  const total = items.reduce((s, i) => s + i.log.length, 0);
  const empties = items.reduce((s, i) => s + i.log.filter(isEmptyLog).length, 0);
  v.append(
    toolbar(
      h('h2', { style: 'margin:0' }, `Дополнительный опыт — отмечено ${n} из ${items.length}`),
      h('span', { class: 'grow' }),
      btn(`📜 Завершить сессию (+${SESSION_BASE_POINTS + n} очков)`, finishSession, 'primary', false,
        `${SESSION_BASE_POINTS} + ${n} за отмеченные пункты пойдут в свободные очки характеристик; отмеченное уйдёт в журнал`),
      btn('Снять отметки без записи', () => { if (confirm('Снять все отметки и заметки, ничего не записывая?')) { items.forEach(i => { i.checked = false; i.note = ''; }); commit(); } }, 'ghost', !n && !items.some(i => i.note))),
    undescribedNote(),
    empties ? h('div', { class: 'row small', style: 'margin:-4px 0 10px' }, h('span', { class: 'muted' }, `В журнале пустых записей: ${empties}.`),
      btn('Убрать пустые записи', () => { items.forEach(i => { i.log = i.log.filter(e => !isEmptyLog(e)); }); commit(); toast('Пустые записи убраны', 'ok'); }, 'ghost small')) : null,
    helpBtn('experience', 'Сколько очков даёт сессия'),
    h('p', { class: 'hint' }, 'Отмечай пункты и пиши, за что именно. В конце сессии нажми «Завершить сессию» — записи уйдут в журнал «Уже было», ',
      'и при следующей заметке лист подскажет, если похожее уже случалось. ', total ? `В журнале записей: ${total}.` : ''),
    ...items.map(experienceItem));
}

function experienceItem(it) {
  const warnBox = h('div', { class: 'small warn exp-similar' });
  const showSimilar = () => {
    const sim = similarLogs(it, it.note);
    warnBox.replaceChildren(...(sim.length ? ['⚠ Похоже, уже было: ', ...sim.slice(0, 3).map((e, i) => [i ? '; ' : '',
      h('b', null, e.text), ` (${new Date(e.date).toLocaleDateString('ru-RU')})`])] : []).flat(Infinity));
  };
  const needNote = () => it.checked && !it.note.trim();
  const note = h('input', { id: 'expnote-' + it.id, placeholder: it.checked ? 'обязательно: за что отмечено?' : 'за что именно: что изучала, с кем говорила…', value: it.note,
    oninput: e => { it.note = e.target.value; saveSoon(); showSimilar(); wrap.classList.toggle('need-note', needNote()); updateUndescribed(); },
    onkeydown: e => { if (e.key === 'Enter' && it.note.trim()) { it.checked = true; commit(); } } });
  showSimilar();
  const wrap = h('div', { class: 'exp-item' + (it.checked ? ' checked' : '') + (needNote() ? ' need-note' : '') },
    h('input', { type: 'checkbox', id: 'exp-' + it.id, checked: it.checked, onchange: e => { it.checked = e.target.checked; commit(); } }),
    h('label', { class: 'exp-text', for: 'exp-' + it.id }, it.text),
    h('div', { class: 'exp-note' },
      h('div', { class: 'row' }, note,
        btn('+ в журнал', () => {
          if (!it.note.trim()) { toast('Сначала напиши, что было'); return; }
          logEntry(it, it.note);
          it.note = '';
          commit();
        }, 'ghost small', false, 'Сразу записать в журнал, не дожидаясь конца сессии')),
      warnBox,
      it.log.length ? fold('xplog-' + it.id, `Уже было (${it.log.length})`, h('div', { class: 'xp-log' }, it.log.map(e => h('div', { class: 'row small xp-entry' },
        h('span', { class: 'muted' }, new Date(e.date).toLocaleDateString('ru-RU')),
        h('input', { class: 'grow', value: e.text, oninput: ev => { e.text = ev.target.value; saveSoon(); } }),
        btn('✕', () => { if (confirm('Удалить запись из журнала?')) { it.log.splice(it.log.indexOf(e), 1); commit(); } }, 'ghost danger small sq'))))) : null));
  return wrap;
}

/* =====================================================================
   TAGS — поле с несколькими значениями (статусы, фракции, места NPC)
   ===================================================================== */
function tagsField(obj, key, listId, placeholder) {
  const arr = obj[key] = toTags(obj[key]);
  const inputId = `tag-${obj.id}-${key}`;
  const pushValues = () => {
    let added = false;
    for (const v of toTags(input.value))
      if (!arr.some(x => x.toLowerCase() === v.toLowerCase())) { arr.push(v); added = true; }
    input.value = '';
    return added;
  };
  const add = () => {
    pushValues();
    commit();
    document.getElementById(inputId)?.focus();
  };
  const input = h('input', { id: inputId, list: listId, placeholder,
    onkeydown: e => { if (e.key === 'Enter') { e.preventDefault(); add(); } },
    // выбор из подсказок datalist сразу добавляет значение
    oninput: e => { if (e.inputType === 'insertReplacementText') add(); },
    onblur: () => { if (pushValues()) saveSoon(); } });
  return h('div', { class: 'tags' },
    arr.map((t, i) => h('span', { class: 'chip tag' }, t,
      h('button', { type: 'button', class: 'x', title: 'Убрать', onclick: () => { arr.splice(i, 1); commit(); } }, '×'))),
    input);
}

/* =====================================================================
   QUESTS — квесты, цели, что хочу сделать / попробовать
   ===================================================================== */
const questOrder = s => ['active', 'planned', 'paused', 'done', 'failed'].indexOf(s);

function newQuest(title = '', kind = 'try') {
  return { id: uid('quest'), title, kind, status: kind === 'quest' ? 'active' : 'planned', description: '',
    steps: [], notes: '', npcIds: [], locationIds: [], createdAt: new Date().toISOString() };
}

        btn('+ Добавить', addQuick, 'primary'))),

      L.input,
      sel(f.kind, [['', 'все типы'], ...Object.entries(QUEST_KINDS)], val => { f.kind = val; L.draw(); }),
      sel(f.status, [['', 'все статусы'], ...Object.entries(QUEST_STATUSES)], val => { f.status = val; L.draw(); }),
      h('label', { class: 'chk small' }, h('input', { type: 'checkbox', checked: f.hideFinished,
        onchange: e => { f.hideFinished = e.target.checked; L.draw(); } }), 'скрыть выполненные и проваленные')),

// Все договоры с NPC и группами в нужном статусе: с кем (ссылка) и что за договор

function questCard(q) {
  const ed = ui.editing.has(q.id), done = q.steps.filter(s => s.done).length;

    commit();
    document.getElementById('step-' + q.id)?.focus();
  };
  return h('div', { class: 'card quest q-' + q.status },
    h('div', { class: 'card-head' },
      h('div', { class: 'card-title' }, q.title || 'Без названия'),
      chip(QUEST_KINDS[q.kind] || q.kind),
      sel(q.status, Object.entries(QUEST_STATUSES), val => { q.status = val; commit(); }, 'small'),
      editToggle(q.id)),

      q.description ? h('div', { class: 'desc' }, rich(q.description)) : null,
      h('div', { class: 'steps' },
        q.steps.length ? h('div', { class: 'small muted' }, `Шаги: ${done} из ${q.steps.length}`) : null,
        q.steps.map(s => h('label', { class: 'chk step' + (s.done ? ' done' : '') },
          h('input', { type: 'checkbox', checked: s.done, onchange: e => { s.done = e.target.checked; commit(); } }), rich(s.text || '…'))),
        h('div', { class: 'row small' },
          h('input', { id: 'step-' + q.id, class: 'step-input', placeholder: '+ шаг (Enter)',
            oninput: e => { newStep.text = e.target.value; }, onkeydown: e => { if (e.key === 'Enter') addStep(); } }))),
      questLinksView(q),
      q.notes ? h('div', { class: 'notes' }, '📝 ', rich(q.notes)) : null]);

function questLinksView(q) {
  const npcs = q.npcIds.map(findNpc).filter(Boolean), locs = q.locationIds.map(findLoc).filter(Boolean);
  if (!npcs.length && !locs.length) return null;
  return h('div', { class: 'chips' },
    npcs.map(n => h('button', { class: 'chip link', onclick: () => goToNpc(n.id) }, '👤 ' + n.name)),

/* =====================================================================
   CHRONICLE — летопись мира
   Имена NPC, локаций и фракций в тексте сами становятся ссылками (с учётом окончаний: Астра → Астру, Астрой).
   ===================================================================== */
const CHR = () => state.chronicle;

// Кого можно упомянуть: NPC, локации, фракции (из фракций NPC)
const allNames = o => [o.name, ...toTags(o.aliases)].map(x => (x || '').trim()).filter(Boolean);

function mentionTargets() {
  const raw = [];
  const add = (kind, id, name, main) => { name = (name || '').trim(); if (name) raw.push({ kind, id, name, main: main || name }); };
  add('self', 'me', state.character.name);
  for (const n of state.npcs) if (!isSelfNpc(n)) for (const nm of allNames(n)) add('npc', n.id, nm, n.name);
  for (const sp of state.spellbook) add('book', sp.id, sp.name || autoSpellName(sp));
  for (const sp of state.arcaneSpells) add('arcane', sp.id, sp.name);
  for (const it of state.inventory) add('item', it.id, it.name);
  for (const l of GEO().locations) for (const nm of allNames(l)) add('loc', l.id, nm, l.name);
  for (const f of uniqueVals('faction')) if (!raw.some(x => sameText(x.name, f))) add('faction', f, f);
  // одно и то же имя у разных объектов → «многозначное»: Старик(Лесничий/Король)
  const byName = new Map();
  for (const t of raw) {
    const k = normName(t.name), list = byName.get(k) || [];
    if (!list.some(x => x.kind === t.kind && x.id === t.id)) list.push(t);
    byName.set(k, list);
  }
  return [...byName.values()].map(list => list.length === 1 ? list[0]
    : { kind: 'multi', id: list.map(x => x.kind + ':' + x.id).join('|'), name: list[0].name, options: list });
}
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
// Падежные окончания существительных и прилагательных (длинные — первыми)
const RU_ENDINGS = ['ями', 'ами', 'ого', 'его', 'ому', 'ему', 'ыми', 'ими',
  'ой', 'ей', 'ою', 'ею', 'ом', 'ем', 'ам', 'ям', 'ах', 'ях', 'ов', 'ев', 'ий', 'ый', 'ая', 'яя', 'ое', 'ее', 'ую', 'юю', 'ые', 'ие', 'ых', 'их', 'ым', 'им',
  'а', 'я', 'у', 'ю', 'ы', 'и', 'е', 'о', 'й', 'ь'];
const ENDINGS_RE = '(?:' + RU_ENDINGS.join('|') + ')?';
// Каждое слово имени (от 4 букв) — основа + любое падежное окончание: Астра → Астру, Северные регионы → Северных регионов.
// «Астрал» при этом не совпадёт с «Астра». Короткие слова — точное совпадение.
function wordPattern(w) {
  if (w.length < 4) return escRe(w);
  const lower = w.toLowerCase();
  // у прилагательных срезаем окончание целиком (Седой → Сед-ого), у остальных — одну последнюю гласную / й / ь (Андрей → Андре-я)
  const adj = ['ой', 'ый', 'ий', 'ая', 'яя', 'ое', 'ее', 'ые', 'ие'].find(e => lower.endsWith(e) && w.length - 2 >= 3);
  const cut = adj ? 2 : /[аеёиоуыэюяйь]$/.test(lower) ? 1 : 0;
  return escRe(w.slice(0, w.length - cut)) + ENDINGS_RE;
}
const namePattern = name => name.split(/\s+/).map(wordPattern).join('\\s+');
// Явные ссылки: [[Паку]] — найти, кого имели в виду; [[Пак|Паку]] — ссылка на Пака с текстом «Паку»
const FORCED_RE = /\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g;
function findMentions(text, targets) {
  text = String(text || '');
  const res = [];
  const auto = (from, to) => res.push(...autoMentions(text.slice(from, to), targets).map(x => ({ ...x, start: x.start + from, end: x.end + from })));
  let pos = 0;
  for (const m of text.matchAll(FORCED_RE)) {
    auto(pos, m.index);
    const target = m[1].trim(), display = (m[2] ?? m[1]).trim();
    res.push({ start: m.index, end: m.index + m[0].length, t: resolveForced(target, targets), display, forced: target });
    pos = m.index + m[0].length;
  }
  auto(pos, text.length);
  return res;
}
// Кого имели в виду в [[…]]: точное имя → имя в другом падеже → имя + до 3 букв (Пак → Паку) → похожее (опечатка)
function resolveForced(q, targets) {
  const n = normName(q);
  if (!n) return null;
  const tiers = [[], [], [], []];
  for (const t of targets) {
    const tn = normName(t.name);
    if (tn === n) tiers[0].push(t);
    else if (new RegExp('^(?:' + namePattern(t.name) + ')$', 'iu').test(q)) tiers[1].push(t);
    else if (tn.length >= 2 && n.startsWith(tn) && n.length - tn.length <= 3) tiers[2].push(t);
    else if (nameSimilarity(q, t.name)) tiers[3].push(t);
  }
  const best = tiers.find(x => x.length);
  if (!best) return null;
  const opts = [];
  for (const t of best) for (const o of t.kind === 'multi' ? t.options : [t])
    if (!opts.some(x => x.kind === o.kind && x.id === o.id)) opts.push(o);
  return opts.length === 1 ? opts[0] : { kind: 'multi', id: opts.map(o => o.kind + ':' + o.id).join('|'), name: q, options: opts };
}
// Автоматические упоминания (без скобок)
function autoMentions(text, targets) {
  const found = [];
  for (const t of targets) {
    const re = new RegExp('(?<![\\p{L}\\p{N}])(?:' + namePattern(t.name) + ')(?![\\p{L}\\p{N}])', 'gu');
    for (const m of String(text || '').matchAll(re)) found.push({ start: m.index, end: m.index + m[0].length, t });
  }
  found.sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));
  const res = [];
  let pos = 0;
  for (const f of found) if (f.start >= pos) { res.push(f); pos = f.end; }
  return res;
}
const MENTION_ICON = { npc: '👤', loc: '📍', faction: '⚑', self: '🧝', book: '📖', arcane: '✦', item: '🎒' };
// Открыть карточку на её вкладке и подсветить
function goToCard(tab, domId, prep) {
  prep && prep();
  state.ui.tab = tab;
  render();
  const el = document.getElementById(domId);
  if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('flash'); }
}

function goToFaction(name) {
  const g = groupByName(name);
  if (g) { goToNpc(g.id); return; }
  ui.search.npc = '';
  ui.filters.npc = { faction: name, status: '', location: '' };
  state.ui.tab = 'npc';
  render();
  window.scrollTo(0, 0);
}
function openMention(t) {
  if (t.kind === 'npc') goToNpc(t.id);
  else if (t.kind === 'loc') goToLocation(t.id);
  else if (t.kind === 'self') goTab('character');
  else if (t.kind === 'book') goToCard('spellbook', 'spell-' + t.id, () => { ui.search.book = ''; });
  else if (t.kind === 'arcane') goToCard('arcane', 'arc-' + t.id, () => { ui.search.arcane = ''; ui.filters.arcaneSchool = 'all'; ui.filters.arcaneMine = false; });
  else if (t.kind === 'item') goToCard('inventory', 'item-' + t.id, () => { ui.search.inv = ''; ui.filters.equippedOnly = false; });
  else goToFaction(t.id);
}
function goToChronicle(id) {
  ui.search.chronicle = '';
  state.ui.tab = 'chronicle';
  render();
  const el = document.getElementById('chr-' + id);
  if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('flash'); }
}

// Текст со ссылками на упомянутых
// Любой текст пользователя со ссылками на NPC, локации и фракции
const mentionCache = () => ui.mentionTargets ||= mentionTargets();
const rich = text => linkify(String(text || ''), mentionCache());

function linkify(text, targets) {
  const out = [];
  let pos = 0;
  for (const m of findMentions(text, targets)) {
    if (m.start > pos) out.push(text.slice(pos, m.start));
    const shown = m.display ?? text.slice(m.start, m.end);
    if (!m.t) {
      out.push(h('span', { class: 'mention-missing', title: `Не нашла, на кого ссылка «${m.forced}». Проверь имя или добавь его в «Другие имена».` }, shown));
    } else if (m.t.kind === 'multi') {
      // одинаковое имя у нескольких: само слово как есть, а в скобках — варианты-ссылки
      out.push(shown, '(', m.t.options.map((o, i) => [i ? '/' : '',
        h('button', { type: 'button', class: 'mention mention-' + o.kind, title: `${MENTION_ICON[o.kind]} ${o.main}`, onclick: () => openMention(o) }, o.main)]), ')');
    } else {
      out.push(h('button', { type: 'button', class: 'mention mention-' + m.t.kind, title: `${MENTION_ICON[m.t.kind]} ${m.t.main || m.t.name}`,
        onclick: () => openMention(m.t) }, shown));
    }
    pos = m.end;
  }
  if (pos < text.length) out.push(text.slice(pos));
  return out;
}
function uniqueMentions(text, targets) {
  const seen = new Set();
  return findMentions(text, targets).flatMap(m => !m.t ? [] : m.t.kind === 'multi' ? m.t.options : [m.t]).filter(t => { const k = t.kind + ':' + t.id; if (seen.has(k)) return false; seen.add(k); return true; });
}
// Записи летописи, где упомянут объект (для карточек NPC и локаций)
function chronicleMentionsOf(kind, id) {
  const targets = mentionTargets();
  const hit = t => t.kind === kind && t.id === id;
  return CHR().filter(e => findMentions(e.text, targets).some(m => m.t && (m.t.kind === 'multi' ? m.t.options.some(hit) : hit(m.t))));
}
function chronicleChips(kind, id) {
  const list = chronicleMentionsOf(kind, id);
  if (!list.length) return null;
  return h('div', { class: 'chips' }, h('span', { class: 'small muted' }, 'Летопись:'),
    list.map(e => h('button', { class: 'chip link', onclick: () => goToChronicle(e.id) }, '📜 ' + chronicleTitle(e))));
}
const chronicleTitle = e => e.title?.trim() || (e.when ? e.when + ': ' : '') + (e.text || '').trim().slice(0, 40) + ((e.text || '').trim().length > 40 ? '…' : '');

// «2500 09 25 утро» → { y: 2500, m: 9, d: 25, note: 'утро' }. Неполная дата — как будто дописаны нули:
// 2498 < 2498 01 < 2498 01 01. Не начинается с числа — даты нет (блок «Без даты»).
function parseWhen(when) {
  const m = String(when || '').trim().match(/^(\d{1,6})(?:[\s.\/-]+(\d{1,3}))?(?:[\s.\/-]+(\d{1,3}))?(?:\s+(.*))?$/);
  return m ? { y: +m[1], m: +(m[2] || 0), d: +(m[3] || 0), note: m[4] || '' } : null;
}

// Летопись по датам. Записи одной даты — группа, порядок в ней ручной (порядок в массиве).
function chronicleView() {
  const dated = [], undated = [];
  CHR().forEach((e, i) => { const p = parseWhen(e.when); (p ? dated : undated).push({ e, p, i }); });
  dated.sort((a, b) => (a.p.y - b.p.y) || (a.p.m - b.p.m) || (a.p.d - b.p.d) || (a.i - b.i));
  const groups = [];
  for (const x of dated) {
    const key = `${x.p.y}|${x.p.m}|${x.p.d}`, last = groups[groups.length - 1];
    if (last && last.key === key) last.items.push(x); else groups.push({ key, y: x.p.y, items: [x] });
  }
  // «сначала новые» — полный переворот: и даты, и записи внутри одной даты, и блок «Без даты»
  if (ui.chrNewestFirst) { groups.reverse(); groups.forEach(g => g.items.reverse()); undated.reverse(); }
  return { groups, undated };
}

// Сдвиг записи внутри её даты: меняемся местами с соседом по группе
function moveChronicle(e, siblings, dir) {
  const k = siblings.findIndex(x => x.e === e), other = siblings[k + dir];
  if (!other) return;
  const arr = CHR(), i = arr.indexOf(e), j = arr.indexOf(other.e);
  [arr[i], arr[j]] = [arr[j], arr[i]];
  commit();
}

function renderChronicleTab(v) {
  const draft = ui.chrDraft ||= { when: '', title: '', text: '' };
  const targets = mentionTargets();
  const add = () => {
    if (!draft.text.trim()) { toast('Напиши, что произошло'); return; }
    CHR().push({ id: uid('chr'), when: draft.when.trim(), title: draft.title.trim(), text: draft.text.trim(), createdAt: new Date().toISOString() });
    ui.chrDraft = { when: draft.when, title: '', text: '' };
    ui.chrNewOpen = false;
    commit();
  };
  const box = h('div', { class: 'list' });
  const chrSearch = () => h('input', { type: 'search', class: 'search', placeholder: 'Поиск по летописи…', value: ui.search.chronicle || '',
    oninput: e => { ui.search.chronicle = e.target.value; for (const x of [chrTop, chrBottom]) if (x !== e.target) x.value = e.target.value; draw(); } });
  const chrTop = chrSearch(), chrBottom = chrSearch();
  const draw = () => {
    const q = (ui.search.chronicle || '').trim().toLowerCase();
    const match = x => !q || has(q, x.e.when, x.e.title, x.e.text);
    const { groups, undated } = chronicleView();
    const out = [];
    let year = null;
    for (const g of groups) {
      const items = g.items.filter(match);
      if (!items.length) continue;
      if (g.y !== year) { year = g.y; out.push(h('div', { class: 'chr-year' }, String(g.y))); }
      for (const x of items) out.push(chronicleCard(x.e, targets, q ? [] : g.items));
    }
    const und = undated.filter(match);
    if (und.length) {
      out.push(h('div', { class: 'chr-year undated', title: 'Поле «Когда» пустое или не начинается с года' }, 'Без даты'));
      for (const x of und) out.push(chronicleCard(x.e, targets, q ? [] : undated));
    }
    box.replaceChildren(...(out.length ? out : [h('div', { class: 'empty' }, q ? 'Ничего не найдено.' : 'Летопись пока пуста.')]));
    bottomSearch(box, chrBottom, chrTop);
  };
  draw();
  // форма открыта только по кнопке; свёрнутый черновик сохраняется до перезагрузки
  const formOpen = !!ui.chrNewOpen;
  v.append(
    formOpen ? h('section', { class: 'panel' },
      h('div', { class: 'row' }, h('div', { class: 'panel-title', style: 'margin:0' }, '📜 Новая запись'), h('span', { class: 'grow' }),
        btn('Свернуть', () => { ui.chrNewOpen = false; render(); }, 'ghost small', false,
          'Спрятать форму. Написанное останется в черновике до перезагрузки')),
      h('div', { class: 'grid3' },
        field('Когда: год месяц число описание', txt(draft, 'when', { placeholder: '2500 09 25 утро' })),
        field('Заголовок', txt(draft, 'title', { placeholder: 'необязательно' }))),
      h('div', { class: 'form' },
        h('textarea', { id: 'chr-new-text', rows: 4, placeholder: 'Вилонцы давят Астру. Астра проигрывает танкам и расселяется по захолустьям… (Ctrl+Enter — записать)',
          value: draft.text, oninput: e => { draft.text = e.target.value; },
          onkeydown: e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) add(); } }),
        h('div', { class: 'row' }, btn('Записать в летопись', add, 'primary'),
          h('span', { class: 'small muted' }, 'Записи сортируются по дате сами; одинаковые даты — в порядке, который задаёшь стрелками ↑↓. Имена NPC, локаций и фракций станут ссылками. Не подхватилось — оберни в скобки: [[Паку]] или [[Пак|Паку]].'), helpBtn('links', 'Как работают ссылки')))) : null,
    toolbar(
      formOpen ? null : btn(draft.text.trim() ? '✎ Продолжить запись' : '+ Новая запись', () => {
        ui.chrNewOpen = true;
        render();
        document.getElementById('chr-new-text')?.focus();
      }, 'primary'),
      chrTop,
      btn(ui.chrNewestFirst ? '↓ сначала новые' : '↑ сначала старые', () => { ui.chrNewestFirst = !ui.chrNewestFirst; render(); }, 'ghost small')),
    box);
}

function chronicleCard(e, targets, siblings) {
  const ed = ui.editing.has(e.id);
  const mentions = uniqueMentions(e.text, targets);
  const k = siblings.findIndex(x => x.e === e);
  const arrows = siblings.length > 1 ? [
    btn('↑', () => moveChronicle(e, siblings, -1), 'ghost small sq', k <= 0, 'Выше в пределах этой даты'),
    btn('↓', () => moveChronicle(e, siblings, 1), 'ghost small sq', k >= siblings.length - 1, 'Ниже в пределах этой даты')] : null;
  const badWhen = e.when?.trim() && !parseWhen(e.when);
  return h('div', { class: 'card chr', id: 'chr-' + e.id },
    h('div', { class: 'card-head' },
      e.when ? h('span', { class: 'chr-when' + (badWhen ? ' bad' : '') }, e.when) : null,
      h('div', { class: 'card-title' }, e.title || ''),
      arrows,
      editToggle(e.id)),
    ed ? h('div', { class: 'form' },
      h('div', { class: 'grid3' }, field('Когда: год месяц число описание', txt(e, 'when', { placeholder: '2500 09 25 утро' })), field('Заголовок', txt(e, 'title'))),
      badWhen ? h('div', { class: 'small warn' }, 'Дата не распознана — запись лежит в блоке «Без даты». Начни с года: «2500 09 25 утро».') : null,
      field('Текст', txt(e, 'text', { multi: true, rows: 6 })),
      dangerRow('Удалить запись', () => removeWithConfirm(CHR(), e, 'Удалить эту запись летописи?')))
      : h('div', { class: 'desc chr-text' }, linkify(e.text || '', targets)),
    !ed && mentions.length ? h('div', { class: 'chips' }, h('span', { class: 'small muted' }, 'Упомянуты:'),
      mentions.map(t => h('button', { class: 'chip link', onclick: () => openMention(t) }, MENTION_ICON[t.kind] + ' ' + (t.main || t.name)))) : null);
}

/* =====================================================================
   DUPLICATES — поиск похожих названий (NPC, локации, предметы)
   Пары «это разные» хранятся в state.notDuplicates как «id1|id2» (id отсортированы).
   ===================================================================== */
// латинские буквы, похожие на русские, — частая причина «невидимых» дублей
const LATIN_LOOKALIKE = { a: 'а', c: 'с', e: 'е', o: 'о', p: 'р', x: 'х', y: 'у', k: 'к', m: 'м', t: 'т', b: 'в', h: 'н' };
function normName(str) {
  let t = String(str || '').toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ').trim();
  if (/[а-я]/.test(t)) t = [...t].map(ch => LATIN_LOOKALIKE[ch] || ch).join('');
  return t;
}
// основа слова без падежного окончания: Марту → март, Седого → сед
function ruStem(w) {
  if (w.length < 4) return w;
  const adj = ['ого', 'его', 'ому', 'ему', 'ой', 'ый', 'ий', 'ая', 'яя', 'ое', 'ее', 'ые', 'ие', 'ых', 'их', 'ую'].find(e => w.endsWith(e) && w.length - e.length >= 3);
  if (adj) return w.slice(0, -adj.length);
  return /[аеиоуыэюяйь]$/.test(w) ? w.slice(0, -1) : w;
}
// Расстояние правки; перестановка соседних букв (Грегор ↔ Гергор) считается одной ошибкой
function levenshtein(a, b) {
  if (a === b) return 0;
  let prev2 = null, prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (prev2 && i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) cur[j] = Math.min(cur[j], prev2[j - 2] + 1);
    }
    prev2 = prev;
    prev = cur;
  }
  return prev[b.length];
}
// самая длинная общая подстрока — её подсвечиваем, чтобы было видно, чем похожи
function longestCommon(a, b) {
  let best = '', prev = new Array(b.length + 1).fill(0);
  for (let i = 1; i <= a.length; i++) {
    const cur = new Array(b.length + 1).fill(0);
    for (let j = 1; j <= b.length; j++) if (a[i - 1] === b[j - 1]) {
      cur[j] = prev[j - 1] + 1;
      if (cur[j] > best.length) best = a.slice(i - cur[j], i);
    }
    prev = cur;
  }
  return best.trim();
}
const ratio = (a, b) => 1 - levenshtein(a, b) / Math.max(a.length, b.length, 1);

// Похожи ли два названия: { score 0..1, common } или null
function nameSimilarity(x, y) {
  const A = normName(x), B = normName(y);
  if (!A || !B) return null;
  const common = longestCommon(A, B);
  if (A === B) return { score: 1, common };
  const wa = A.split(' ').map(ruStem), wb = B.split(' ').map(ruStem);
  const SA = wa.join(' '), SB = wb.join(' ');
  if (SA === SB && SA.length >= 3) return { score: 0.95, common };
  // одно название целиком входит в другое: «Грегор» и «Грегор Седой»
  const [small, big] = wa.length <= wb.length ? [wa, new Set(wb)] : [wb, new Set(wa)];
  if (small.every(w => big.has(w)) && small.some(w => w.length >= 4)) return { score: 0.85, common };
  if (Math.min(A.length, B.length) < 5) return null; // короткие — только точное совпадение
  // порог 70%: чуть больше 2 правок на 7 букв (перестановка соседних букв — одна правка)
  const DUP_THRESHOLD = 0.7;
  const full = ratio(A, B), stem = Math.min(SA.length, SB.length) >= 4 ? ratio(SA, SB) : 0;
  const score = Math.max(full >= DUP_THRESHOLD ? full : 0, stem >= DUP_THRESHOLD ? stem : 0);
  return score ? { score, common } : null;
}

const pairKey = (a, b) => [a, b].sort().join('|');
const dupCache = new Map();
function dupPairs(kind, items) {
  const dismissed = new Set(state.notDuplicates);
  const sig = items.map(i => i.id + ':' + allNames(i).join('/')).join('\n') + '#' + state.notDuplicates.join(',');
  const cached = dupCache.get(kind);
  if (cached && cached.sig === sig) return cached.pairs;
  const pairs = [];
  for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) {
    const a = items[i], b = items[j];
    if (dismissed.has(pairKey(a.id, b.id))) continue;
    let best = null;
    for (const na of allNames(a)) for (const nb of allNames(b)) {
      const sim = nameSimilarity(na, nb);
      if (sim && (!best || sim.score > best.score)) best = { ...sim, na, nb };
    }
    if (best) pairs.push({ a, b, ...best });
  }
  pairs.sort((p, q) => q.score - p.score);
  dupCache.set(kind, { sig, pairs });
  return pairs;
}

// имя в паре дублей; если совпало по другому имени — главное в скобках
const dupName = (item, used, common) => used && used !== item.name
  ? [highlightName(used, common), h('span', { class: 'muted small' }, ` (${item.name})`)]
  : highlightName(item.name, common);

function highlightName(name, common) {
  name = name || '';
  const i = common ? normName(name).indexOf(common) : -1;
  if (i < 0 || common.length < 2) return h('b', null, name);
  return h('b', null, name.slice(0, i), h('mark', null, name.slice(i, i + common.length)), name.slice(i + common.length));
}

// Кнопка «Возможные дубли (N)» и режим просмотра парами; когда пар нет — всё прячется само
function dupControls(kind, items, renderCard) {
  ui.dupMode ||= {};
  const pairs = dupPairs(kind, items);
  if (!pairs.length) ui.dupMode[kind] = false;
  const active = !!ui.dupMode[kind];
  const button = pairs.length ? btn(active ? '✕ Выйти из режима дублей' : `🔍 Возможные дубли (${pairs.length})`,
    () => { ui.dupMode[kind] = !active; render(); }, active ? 'primary small' : 'small', false,
    'Пары с похожими названиями — проверь, не завела ли одно и то же дважды') : null;
  const view = active ? h('div', { class: 'dup-list' },
    h('div', { class: 'small muted' }, 'Исправь название, удали лишнюю карточку или отметь «это разные» — пара пропадёт из списка.'),
    pairs.map(p => h('div', { class: 'dup-pair' },
      h('div', { class: 'dup-head' },
        dupName(p.a, p.na, p.common), h('span', { class: 'muted' }, ' ↔ '), dupName(p.b, p.nb, p.common),
        chip(`похожи на ${Math.round(p.score * 100)}%`),
        h('span', { class: 'grow' }),
        btn('Это разные', () => {
          if (!confirm(`Уверена, что «${p.a.name}» и «${p.b.name}» — разные? Эту пару больше не буду предлагать.`)) return;
          state.notDuplicates.push(pairKey(p.a.id, p.b.id));
          commit();
        }, 'ghost small')),
      h('div', { class: 'dup-cards' }, renderCard(p.a), renderCard(p.b))))) : null;
  return { button, view };
}

// Простая силовая раскладка: узлы отталкиваются, связи притягивают
// Простая силовая раскладка: узлы отталкиваются, связи притягивают.
// Область растёт с числом узлов, чтобы большие карты не слипались.

  const K = Math.sqrt(W * H / Math.max(1, nodes.length)) * 0.55;
  let t = W / 8;

    const d = P.map(() => ({ x: 0, y: 0 }));
    for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
      let dx = P[i].x - P[j].x, dy = P[i].y - P[j].y;
      const dist = Math.hypot(dx, dy) || 0.01, f = K * K / dist;
      dx /= dist; dy /= dist;
      d[i].x += dx * f; d[i].y += dy * f; d[j].x -= dx * f; d[j].y -= dy * f;
    }
    for (const e of edges) {
      const i = idx.get(e.a), j = idx.get(e.b);
      if (i == null || j == null) continue;
      let dx = P[i].x - P[j].x, dy = P[i].y - P[j].y;
      const dist = Math.hypot(dx, dy) || 0.01, f = dist * dist / K;
      dx /= dist; dy /= dist;

    }

}
// Раздвигает пересекающиеся прямоугольники узлов (с зазором) по оси, где перекрытие меньше
function separateBoxes(nodes, P, fixed, gap = 14) {
  const B = nodes.map(nodeBox);

    for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {

  if (fixed.size) {

    const v = ui.geoViews?.[geoViewKey()];
    const cx = v ? v.x + v.w / 2 : GW / 2, cy = v ? v.y + v.h / 2 : GH / 2;
    nodes.forEach((n, i) => { if (!n.pos[k]) n.pos[k] = { x: Math.round(cx + (i % 5 - 2) * 60), y: Math.round(cy + 80 + Math.floor(i / 5) * 50) }; });
  } else {
    const { W, H } = layoutArea(nodes.length);
    nodes.forEach((n, i) => {

  }

/* ---------- масштаб и перемещение карты ---------- */
// Вид (viewBox) запоминается отдельно для каждого уровня и режима
const geoViewKey = () => ui.geo.mode + ':' + (ui.geo.mode === 'level' ? ui.geo.scope || 'top' : 'all');

  const words = name.split(/\s+/);
  const variants = [[words.join(' ')]];
  for (let i = 1; i < words.length; i++) {
    variants.push([words.slice(0, i).join(' '), words.slice(i).join(' ')]);
    for (let j = i + 1; j < words.length; j++)
      variants.push([words.slice(0, i).join(' '), words.slice(i, j).join(' '), words.slice(j).join(' ')]);
  }
  const size = lines => ({ w: Math.max(80, Math.max(...lines.map(l => l.length)) * NODE_CHAR_W + 28), h: lines.length * NODE_LINE_H + 18 });
  const score = lines => { const b = size(lines); return Math.abs(Math.log(b.w / b.h / NODE_RATIO)); };
  const best = variants.reduce((a, b) => score(b) < score(a) - 0.01 ? b : a);

}

  for (const n of nodes) {
    const p = n.pos[k], b = nodeBox(n);
    x1 = Math.min(x1, p.x - b.w / 2); x2 = Math.max(x2, p.x + b.w / 2);
    y1 = Math.min(y1, p.y - b.h / 2 - 16); y2 = Math.max(y2, p.y + b.h / 2 + 18);

/* ---------- страны и территории ---------- */

// Диаграмма Вороного: сота каждого узла внутри рамки; у каждой грани — индекс соседа (или -1 для рамки)

const polyPath = poly => poly.length ? 'M' + poly.map(v => `${v.x.toFixed(1)},${v.y.toFixed(1)}`).join('L') + 'Z' : '';

// Слой территорий под узлами графа
function territoryLayer(nodes, k) {
  if (!nodes.length) return { layer: null, legend: [] };
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  for (const n of nodes) {
    const p = n.pos[k], b = nodeBox(n);
    x1 = Math.min(x1, p.x - b.w / 2); x2 = Math.max(x2, p.x + b.w / 2);
    y1 = Math.min(y1, p.y - b.h / 2 - 16); y2 = Math.max(y2, p.y + b.h / 2 + 18);
  }
  const box = { x1: x1 - 50, y1: y1 - 50, x2: x2 + 50, y2: y2 + 50 };
  const cells = voronoiCells(nodes.map(n => n.pos[k]), box);
  const owners = nodes.map(n => ownerOf(n).group);
  const key = i => owners[i]?.id || 'none';
  // заливка: одна фигура на страну, чтобы соты сливались без швов
  const byKey = new Map();
  cells.forEach((c, i) => { const kk = key(i); byKey.set(kk, (byKey.get(kk) || '') + polyPath(c)); });
  const fills = [...byKey].map(([kk, d]) => {
    const g = kk === 'none' ? null : owners[owners.findIndex(o => o?.id === kk)];
    return sv('path', { d, class: 'terr' + (g ? '' : ' none'), fill: g ? countryColor(g) : NO_COUNTRY_COLOR });
  });
  // штриховка спорных
  const defs = sv('defs'), hatches = [];
  nodes.forEach((n, i) => {
    const sides = disputeSides(n);
    if (!sides.length) return;
    const pid = 'hatch-' + sides.map(g => g.id).join('-').replace(/[^\w-]/g, '');
    if (!defs.querySelector('#' + pid))
      defs.append(sv('pattern', { id: pid, patternUnits: 'userSpaceOnUse', width: 14 * sides.length, height: 14, patternTransform: 'rotate(45)' },
        sides.map((g, j) => sv('rect', { x: 14 * j, y: 0, width: 7, height: 14, fill: countryColor(g) }))));
    hatches.push(sv('path', { d: polyPath(cells[i]), class: 'terr-hatch', fill: `url(#${pid})` }));
  });
  // границы: только между разными странами и по рамке
  const borders = [];
  cells.forEach((c, i) => c.forEach((v, m) => {
    const w = c[(m + 1) % c.length];
    if (v.t === -1) borders.push(sv('line', { x1: v.x, y1: v.y, x2: w.x, y2: w.y, class: 'terr-edge', stroke: owners[i] ? countryColor(owners[i]) : NO_COUNTRY_COLOR }));
    else if (v.t > i && key(v.t) !== key(i)) borders.push(sv('line', { x1: v.x, y1: v.y, x2: w.x, y2: w.y, class: 'terr-border' }));
  }));
  // легенда: страны на экране
  const legend = [];
  const seen = new Set();
  owners.forEach(g => { const kk = g?.id || 'none'; if (!seen.has(kk)) { seen.add(kk); legend.push(g); } });
  legend.sort((a, b) => (!a) - (!b) || byName(a, b));
  return { layer: sv('g', { class: 'territories' }, defs, fills, hatches, borders), legend, disputed: hatches.length > 0 };
}

// Новые случайные цвета всем странам, у которых есть земли на карте (на любом уровне)
function hslHex(hue, sat, light) {
  const a = sat * Math.min(light, 1 - light);
  const f = n => { const k = (n + hue / 30) % 12; return Math.round(255 * (light - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))).toString(16).padStart(2, '0'); };
  return '#' + f(0) + f(8) + f(4);
}
function recolorCountries() {
  const countries = [...new Map(GEO().locations.map(l => ownerOf(l).group).filter(Boolean).map(g => [g.id, g])).values()];
  if (!countries.length) { toast('На карте пока нет стран — укажи у локаций, какой стране они принадлежат'); return; }
  if (!confirm(`Заменить цвета ${countries.length} стран на случайные?`)) return;
  // оттенки равномерно по кругу со случайным сдвигом, чтобы соседние цвета не сливались
  const start = Math.random() * 360, order = countries.slice().sort(() => Math.random() - 0.5);
  order.forEach((g, i) => {
    const hue = (start + i * 360 / order.length + (Math.random() - 0.5) * 12) % 360;
    g.color = hslHex(hue, 0.5 + Math.random() * 0.2, 0.5 + Math.random() * 0.1);
  });
  commit();
  toast('Страны перекрашены', 'ok');
}

function geoLegend(t) {

function geoGraph() {
  const nodes = graphNodes(), edges = graphEdges(nodes), k = posKey(), vk = geoViewKey();
  ensureLayout(nodes, edges, false);
  ui.geoViews ||= {};
  let view = ui.geoViews[vk] ||= fitView(nodes, k);
  const svg = sv('svg', { class: 'geo-svg' + (ui.geo.linking ? ' linking' : '') });
  const applyView = () => svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
  const setView = v => { view = ui.geoViews[vk] = v; applyView(); };
  applyView();
  const draw = () => {
    const pos = id => findLoc(id)?.pos[k];
    svg.replaceChildren(...[
      territoryLayer(nodes, k).layer,
      edges.map(e => {
        const a = pos(e.a), b = pos(e.b);
        return a && b ? sv('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: 'edge ' + e.type }) : null;
      }),
      nodes.map(n => {
        const p = n.pos[k], { w, h: hh } = nodeBox(n), inner = childrenOf(n.id).length;
        const own = ownerOf(n).group, col = own ? countryColor(own) : NO_COUNTRY_COLOR;
        const cls = 'node' + (ui.geo.selected === n.id ? ' selected' : '') + (ui.geo.linkFrom === n.id ? ' from' : '') + (disputeSides(n).length ? ' disputed' : '');
        return sv('g', { class: cls, 'data-id': n.id, transform: `translate(${p.x},${p.y})` },
          inner && ui.geo.mode === 'level' ? sv('rect', { x: -w / 2 + 4, y: -hh / 2 + 4, width: w, height: hh, rx: 9, class: 'stack-shadow', stroke: col }) : null,
          sv('rect', { x: -w / 2, y: -hh / 2, width: w, height: hh, rx: 9, class: 'node-base' }),
          sv('rect', { x: -w / 2, y: -hh / 2, width: w, height: hh, rx: 9, class: 'node-face', fill: col, stroke: col }),
          sv('text', { 'text-anchor': 'middle' }, nodeLines(n.name).map((line, i, all) =>
            sv('tspan', { x: 0, y: 5 + (i - (all.length - 1) / 2) * NODE_LINE_H }, line))),
          n.type ? sv('text', { y: -hh / 2 - 5, 'text-anchor': 'middle', class: 'ntype' }, n.type) : null,
          inner ? sv('text', { y: hh / 2 + 14, 'text-anchor': 'middle', class: 'ninner' }, `▾ внутри: ${inner}`) : null);
      })].flat().filter(Boolean));
    if (!nodes.length) svg.append(sv('text', { x: view.x + view.w / 2, y: view.y + view.h / 2, 'text-anchor': 'middle', class: 'ntype' },
      ui.geo.scope ? 'Внутри пока ничего нет — добавь локацию' : 'Добавь первую локацию'));
  };
  draw();
  const toSvg = e => { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };

  // масштаб вокруг точки (по умолчанию — центр)
  const zoomAt = (factor, pt) => {
    const w = clamp(view.w * factor, 200, 40000), f = w / view.w, h = view.h * f;
    pt ||= { x: view.x + view.w / 2, y: view.y + view.h / 2 };
    setView({ x: pt.x - (pt.x - view.x) * f, y: pt.y - (pt.y - view.y) * f, w, h });
  };
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    zoomAt(Math.pow(1.0015, e.deltaY), toSvg(e));
  }, { passive: false });

  // перетаскивание: узел — двигаем узел, фон — двигаем карту
  let drag = null;
  svg.addEventListener('pointerdown', e => {
    const g = e.target.closest('[data-id]');
    svg.setPointerCapture(e.pointerId);
    if (!g) { drag = { pan: true, sx: e.clientX, sy: e.clientY, v: { ...view } }; svg.classList.add('panning'); return; }
    const n = findLoc(g.dataset.id), pt = toSvg(e);
    drag = { n, dx: pt.x - n.pos[k].x, dy: pt.y - n.pos[k].y, sx: e.clientX, sy: e.clientY, moved: false };
  });
  svg.addEventListener('pointermove', e => {
    if (!drag) return;
    if (drag.pan) {
      const sc = view.w / svg.clientWidth;
      setView({ ...drag.v, x: drag.v.x - (e.clientX - drag.sx) * sc, y: drag.v.y - (e.clientY - drag.sy) * sc });
      return;
    }
    if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 5) return;
    drag.moved = true;
    const pt = toSvg(e);
    drag.n.pos[k] = { x: Math.round(pt.x - drag.dx), y: Math.round(pt.y - drag.dy) };
    draw();
  });
  const end = () => {
    if (!drag) return;
    const d = drag;
    drag = null;
    svg.classList.remove('panning');
    if (d.pan) return;
    if (d.moved) saveSoon(); else nodeClick(d.n);
  };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);

  return h('div', { class: 'geo-wrap' }, svg,
    geoLegend(territoryLayer(nodes, k)),
    h('div', { class: 'geo-zoom' },
      btn('+', () => zoomAt(1 / 1.3), 'small sq', false, 'Приблизить'),
      btn('−', () => zoomAt(1.3), 'small sq', false, 'Отдалить'),
      btn('⤢', () => setView(fitView(nodes, k)), 'small sq', false, 'Вписать всё')));
}

  const fromMap = (ui.geoSearch || '').trim();
  ui.geoSearch = '';
  const l = { id: uid('loc'), name: fromMap || nameFromSearch('geo', 'Новая локация'), type: '', parentId, description: '', notes: '', pos: {} };

  commit();
}

/* =====================================================================
   HELP — справка для игроков и просмотр схем

// Схемы превращений лежат рядом со страницей, в папке schemes/ (грузятся только при открытии)
const ELEMENT_SCHEMES = { fire: 'schemes/fire.jpg', water: 'schemes/water.jpg', earth: 'schemes/earth.jpg', air: 'schemes/air.jpg' };
const elementScheme = id => ELEMENT_SCHEMES[id] || null;

// Окно с картинкой на весь экран: клик или Esc — закрыть
function showLightbox(src, title) {
  const close = () => { box.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  const box = h('div', { class: 'lightbox', onclick: close },
    h('div', { class: 'lightbox-head' }, title || '', h('span', { class: 'muted small' }, '  · клик или Esc — закрыть')),
    h('img', { src, alt: title || '', onerror: function () {
      const remote = this.dataset.site ? null : siteUrl(src);
      if (remote) { this.dataset.site = '1'; this.src = remote; return; }
      this.replaceWith(h('div', { class: 'warn' }, `Картинка не найдена: ${src}. Она должна лежать рядом со страницей.`));
    } }));
  document.addEventListener('keydown', onKey);
  document.body.append(box);
}
function showScheme(el) {
  const src = elementScheme(el.id);
  if (src) showLightbox(src, `${ELEMENT_ICON[el.id] || ''} ${el.name} — схема превращений`);
  else toast('Для этой стихии схемы нет');
}

// Редактор списка типов локаций (подсказки для поля «Тип»)
function locTypesEditor() {
  const G = GEO();
  const used = [...new Set(G.locations.map(l => (l.type || '').trim()).filter(Boolean))];
  const extra = used.filter(t => !G.types.some(x => sameText(x, t)));
  const fresh = { v: '' };
  const add = () => {
    const val = fresh.v.trim();
    if (!val) return;
    if (!G.types.some(x => sameText(x, val))) G.types.push(val);
    commit();
    document.getElementById('loctype-new')?.focus();
  };
  return h('div', { class: 'panel' },
    h('p', { class: 'hint', style: 'margin-bottom:8px' }, 'Подсказки для поля «Тип» у локаций. Тип можно вписать и не из списка. Цвет на карте задаёт страна (в её карточке), тип — только подпись. ‹ — сдвинуть левее.'),
    h('div', { class: 'chips' }, G.types.map((t, i) => h('span', { class: 'chip tag' },
      i ? h('button', { type: 'button', class: 'x', title: 'Левее', onclick: () => { G.types.splice(i, 1); G.types.splice(i - 1, 0, t); commit(); } }, '‹') : null,
      t,
      h('button', { type: 'button', class: 'x', title: 'Убрать из списка', onclick: () => { G.types.splice(i, 1); commit(); } }, '×')))),
    h('div', { class: 'row', style: 'margin-top:8px' },
      h('input', { id: 'loctype-new', placeholder: 'новый тип: оазис, застава…', oninput: e => { fresh.v = e.target.value; }, onkeydown: e => { if (e.key === 'Enter') add(); } }),

/* ---------- заполненность localStorage ---------- */
// Chrome/Edge дают одному «сайту» около 5 млн символов. Файлы, открытые с диска (file://), могут делить это место между собой.
const STORAGE_QUOTA_GUESS = 5 * 1024 * 1024;
function storageUsage() {
  const res = { total: 0, sheet: 0, backups: 0, other: 0 };
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i), len = k.length + (localStorage.getItem(k) || '').length;
      res.total += len;
      if (k === BACKUP_KEY) res.backups += len;
      else if (k.startsWith(STORAGE_KEY)) res.sheet += len;
      else res.other += len;
    }
  } catch { return null; }
  return res;
}
// Точная проверка: пробуем записать строку всё большей длины, пока браузер не откажет
function probeFreeSpace() {
  const KEY = '__gleb_mages_probe__';
  let lo = 0, hi = 12 * 1024 * 1024;
  try {
    while (hi - lo > 4096) {
      const mid = Math.floor((lo + hi) / 2);
      try { localStorage.setItem(KEY, 'a'.repeat(mid)); lo = mid; } catch { hi = mid; }
    }
  } finally { try { localStorage.removeItem(KEY); } catch {} }
  return lo;
}
const mb = n => (n / 1024 / 1024).toFixed(2) + ' МБ';

function storagePanel() {
  const u = storageUsage();
  if (!u) return h('section', { class: 'panel' }, h('div', { class: 'panel-title' }, 'Хранилище браузера'),
    h('div', { class: 'warn' }, 'Браузер не даёт доступа к localStorage — данные не сохраняются. Пользуйся экспортом JSON.'));
  const quota = ui.storageQuota || STORAGE_QUOTA_GUESS, pct = Math.min(100, u.total / quota * 100);
  const level = pct > 85 ? 'err' : pct > 60 ? 'warn' : 'muted';
  return h('section', { class: 'panel' },
    h('div', { class: 'panel-title' }, 'Хранилище браузера'),
    h('div', { class: 'bar storage-bar' + (pct > 85 ? ' full' : pct > 60 ? ' half' : '') }, h('div', { style: `width:${pct}%` })),
    h('div', { class: 'small ' + level }, `Занято ${mb(u.total)} из ${ui.storageQuota ? '' : '≈'}${mb(quota)} (${pct.toFixed(1)}%)`),
    h('div', { class: 'small muted' }, `Лист: ${mb(u.sheet)} · резервные копии: ${mb(u.backups)}` + (u.other ? ` · другие страницы с диска: ${mb(u.other)}` : '')),
    pct > 60 ? h('div', { class: 'small warn', style: 'margin-top:4px' }, 'Места становится мало: удали старые резервные копии ниже (их можно сначала скачать кнопкой ⬇) и сохраняй экспорт JSON на диск.') : null,
    h('div', { class: 'row', style: 'margin-top:8px' },
      btn('Проверить точно', () => {
        const free = probeFreeSpace();
        ui.storageQuota = storageUsage().total + free;
        render();
        toast(`Свободно ещё ${mb(free)}`, 'ok');
      }, 'ghost small', false, 'Браузер ненадолго попробует записать большой кусок данных и сразу его удалит'),
      h('span', { class: 'small muted' }, 'Картинки не занимают места — в листе хранятся только пути к ним.')));
}

/* =====================================================================
   РЕЖИМ МАСТЕРА — открывается адресом …/index.html#master
   Правит общие формы и заклинания школ. Правки живут только в этом браузере;
   чтобы они попали всем, мастер выгружает правила в файл, а их переносят в HTML.
   ===================================================================== */
const MASTER_KEY = FILE_PREFIX + '-master';
const RULES_KEY = FILE_PREFIX + '-master-rules';
const splitCsv = v => String(v || '').split(',').map(x => x.trim()).filter(Boolean);
function uniqueSeedName(list, base) {
  let n = base, i = 2;
  while (list.some(x => normName(x.n) === normName(n))) n = `${base} ${i++}`;
  return n;
}
// Если браузер не даёт сохранять (localStorage), режим держится до перезагрузки
// Правила мастера из этого браузера заменяют списки из HTML (только в режиме мастера)
function applyMasterRules() {
  try {
    const r = JSON.parse(store.get(RULES_KEY) || 'null');
    if (!r) return;
    if (Array.isArray(r.forms)) FORM_SEED.splice(0, FORM_SEED.length, ...r.forms);
    if (Array.isArray(r.extraAffixes)) EXTRA_AFFIXES.splice(0, EXTRA_AFFIXES.length, ...r.extraAffixes);
    if (Array.isArray(r.props)) PROP_SEED.splice(0, PROP_SEED.length, ...r.props);
    if (Array.isArray(r.disciplines)) DISCIPLINE_SEED.splice(0, DISCIPLINE_SEED.length, ...r.disciplines);
    if (Array.isArray(r.npcs)) NPC_SEED.splice(0, NPC_SEED.length, ...r.npcs);
    for (const [obj, src] of [[STAGE_PROPS, r.stageProps], [AFFIX_PROPS, r.affixProps], [SCHOOL_PROPS, r.schoolProps]])
      if (isPlain(src)) { for (const k in obj) delete obj[k]; Object.assign(obj, src); }
  } catch (e) { console.error(e); }
}
function rulesData() {
  return { kind: FILE_PREFIX + '-rules', savedAt: new Date().toISOString(), forms: FORM_SEED, disciplines: DISCIPLINE_SEED, npcs: NPC_SEED, extraAffixes: EXTRA_AFFIXES,
    props: PROP_SEED, stageProps: STAGE_PROPS, affixProps: AFFIX_PROPS, schoolProps: SCHOOL_PROPS,
    affixDescriptions: Object.fromEntries(EM().affixes.filter(a => a.description?.trim()).map(a => [a.name, a.description])) };
}
// После правки правил: пересобрать лист по ним и запомнить правила в браузере
function resyncRules() {
  syncFormsFromSeed(state);
  syncDisciplinesFromSeed(state);
  ensureSeedAffixes(state);
  store.set(RULES_KEY, JSON.stringify(rulesData()));
  commit();
}
function masterBar() {
  return h('div', { class: 'master-bar' },
    h('b', null, '🎓 Режим мастера'),
    h('span', { class: 'small' }, ' — кнопки 🎓 правят общие формы и заклинания школ. Правки хранятся только в этом браузере: чтобы они попали всем, выгрузи правила и пришли файл.'),
    h('div', { class: 'row', style: 'margin-top:6px' },
      btn('⬇ Выгрузить правила', () => downloadText(JSON.stringify(rulesData(), null, 2), `${FILE_PREFIX}-rules-${dateStamp()}.json`), 'primary small'),
      btn('↺ Вернуть правила из HTML', () => {
        if (!confirm('Забыть правки мастера в этом браузере и вернуть общие списки из HTML?')) return;
        store.set(RULES_KEY, '');
        location.reload();
      }, 'small'),
      btn('Выйти из режима мастера', () => { store.set(MASTER_KEY, ''); location.href = location.pathname; }, 'ghost small')));
}
// Поле правила: меняется по уходу из поля, потом лист пересобирается
const ruleInput = (value, apply, o = {}) => h(o.multi ? 'textarea' : 'input', {
  type: o.type, rows: o.multi ? 3 : null, value: value ?? '', placeholder: o.placeholder,
  onchange: e => { apply(o.type === 'number' ? Math.max(0, Number(e.target.value) || 0) : e.target.value); resyncRules(); } });

const seedOfDiscipline = d => DISCIPLINE_SEED.find(x => [x.n, ...(x.aka || [])].some(n => normName(n) === normName(d.name)));
function masterDisciplineEditor(d) {
  const sd = seedOfDiscipline(d);
  if (!sd) return null;
  sd.bonuses ||= [];
  const bonusEffects = b => {
    const proxy = { effects: (b.eff || []).map(e => localEff(state, e)) };
    return effectsEditor(proxy, 'Эффекты бонуса (действуют, если бонус выбран)', () => { b.eff = proxy.effects.map(portableEff); resyncRules(); });
  };
  return h('div', { class: 'form master-edit' },
    h('div', { class: 'grid2' },
      field('Название', ruleInput(sd.n, v => {
        v = v.trim();
        if (!v || v === sd.n) return;
        // старое название — чтобы у игроков дисциплина узналась
        if (!(sd.aka ||= []).includes(sd.n)) sd.aka.push(sd.n);
        sd.n = v; d.name = v;
      }))),
    field('Описание', ruleInput(sd.d, v => { sd.d = v; }, { multi: true })),
    field('Заметки (только твои, в правила не уходят)', txt(d, 'notes', { multi: true, rows: 3 })),
    h('div', { class: 'sub' },
      h('div', { class: 'sub-title' }, 'Бонусы мастера: игрок выбирает их галочкой'),
      sd.bonuses.map((b, i) => h('div', { class: 'disc-level sys' },
        h('div', { class: 'grid3' },
          field('Доступен с уровня', ruleInput(b.lvl ?? 1, v => { b.lvl = Math.round(v); }, { type: 'number' })),
          field('Название', ruleInput(b.t, v => {
            v = v.trim();
            if (!v || v === b.t) return;
            if (!(b.aka ||= []).includes(b.t)) b.aka.push(b.t);
            b.t = v;
          })),
          h('div', { style: 'align-self:end' }, btn('✕ убрать бонус', () => {
            if (!confirm(`Убрать бонус «${b.t}» из правил? У игроков, кто его выбрал, он останется своим.`)) return;
            sd.bonuses.splice(i, 1);
            resyncRules();
          }, 'ghost danger small'))),
        field('Описание', ruleInput(b.d, v => { b.d = v; }, { multi: true })),
        bonusEffects(b))),
      h('div', null, btn('🎓 + Бонус мастера', () => { sd.bonuses.push({ k: uid('b'), lvl: 1, t: 'Новый бонус', d: '', eff: [] }); resyncRules(); }, 'master-btn small'))),
    dangerRow('Убрать дисциплину из правил', () => {
      if (!confirm(`Убрать «${sd.n}» из правил? У игроков она останется своей дисциплиной.`)) return;
      DISCIPLINE_SEED.splice(DISCIPLINE_SEED.indexOf(sd), 1);
      resyncRules();
    }));
}
// Своя дисциплина → дисциплина мастера (её записи становятся бонусами мастера, выбор сохраняется)
function promoteDiscipline(d) {
  if (!confirm(`Сделать «${d.name}» дисциплиной мастера? Её бонусы станут общими для всех игроков.`)) return;
  const sd = { n: d.name.trim(), d: d.description || '', bonuses: [] };
  for (const lv of d.levels || []) {
    const k = uid('b');
    sd.bonuses.push({ k, lvl: Number(lv.level) || 1, t: lv.title || 'Бонус', d: lv.description || '', eff: (lv.effects || []).map(portableEff) });
    lv.key = k;
  }
  DISCIPLINE_SEED.push(sd);
  resyncRules();
}

function masterNpcFields(n) {
  const sd = NPC_SEED.find(x => x.n === n.name);
  if (!sd) return null;
  return [field('Имя', ruleInput(sd.n, v => {
      v = v.trim();
      if (!v || v === sd.n) return;
      if (!(sd.aka ||= []).includes(sd.n)) sd.aka.push(sd.n);
      sd.n = v; n.name = v;
    })),
    field('Картинка — путь или URL', ruleInput(sd.img, v => { sd.img = v.trim(); }))];
}

function masterFormEditor(f) {
  const sd = FORM_SEED.find(x => x.n === f.name);
  if (!sd) return null;
  return h('div', { class: 'form master-edit' },
    h('div', { class: 'grid2' },
      field('Название', ruleInput(sd.n, v => {
        v = v.trim();
        if (!v || v === sd.n) return;
        for (const x of FORM_SEED) if (x.prev === sd.n) x.prev = v;
        f.name = v; sd.n = v;
      })),
      field('Предыдущая форма', sel(sd.prev || '', [['', '— нет —'], ...FORM_SEED.filter(x => x !== sd).map(x => [x.n, x.n])],
        v => { if (v) sd.prev = v; else delete sd.prev; resyncRules(); }))),
    field('Описание', ruleInput(sd.d, v => { sd.d = v; }, { multi: true })),
    field('Аффиксы формы — через запятую', ruleInput((sd.a || []).join(', '), v => { sd.a = splitCsv(v); })),
    dangerRow('Убрать из общего списка', () => {
      if (!confirm(`Убрать «${sd.n}» из общего списка? У игроков, которые её отметили, она останется своей формой.`)) return;
      FORM_SEED.splice(FORM_SEED.indexOf(sd), 1);
      for (const x of FORM_SEED) if (x.prev === sd.n) delete x.prev;
      ui.editing.delete(f.id);
      resyncRules();
    }));
}

/* =====================================================================
   START
   ===================================================================== */
{
  // ?master=true включает, ?master=false выключает; #master тоже включает
  const q = new URLSearchParams(location.search).get('master');
  if (q !== null) store.set(MASTER_KEY, q === 'false' || q === '0' ? '' : '1');
  if (location.hash === '#master') store.set(MASTER_KEY, '1');
}
// #master, дописанный к адресу уже открытого листа, страницу не перезагружает — включаем сами
window.addEventListener('hashchange', () => {
  if (location.hash === '#master' && !ui.master) { store.set(MASTER_KEY, '1'); location.reload(); }
});
ui.master = store.get(MASTER_KEY) === '1' || /[?&]master=(true|1)\b/.test(location.search) || location.hash === '#master';
if (ui.master) applyMasterRules();
state = loadState();
state.ui.sheetVersion = SHEET_VERSION();
if (!store.get(STORAGE_KEY)) saveState();
{
  const fromUrl = decodeURIComponent(location.hash.slice(1));
  if (TABS.some(t => t.id === fromUrl)) state.ui.tab = fromUrl;
  ui.fromHistory = true; // первый показ не добавляет запись в историю
}
render();
</script>
