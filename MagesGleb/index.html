<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лист персонажа</title>
<style>
:root{
  --bg:#13100d; --bg2:#1b1713; --panel:#211c17; --panel2:#2a231c; --line:#3d3328; --line2:#54473a;
  --text:#ece3d4; --muted:#a39682; --gold:#d4ad62; --gold2:#f0cc82;
  --danger:#d0614f; --ok:#7dbb72; --mana:#5a8fe0; --mana2:#86b3ff; --lock:#8c7d6a;
  --fire:#e57a3f; --water:#5aa3e6; --earth:#b8925a; --air:#a6cfe0;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Segoe UI",system-ui,sans-serif}
body{background:radial-gradient(ellipse at top,#221b14 0%,var(--bg) 60%) fixed}
h1,h2,h3,.panel-title,.card-title,.el-name,.brand-name{font-family:Georgia,"Times New Roman",serif}
h2,h3{margin:.2em 0 .4em;color:var(--gold2);font-weight:normal}
a{color:var(--gold2)}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- top ---------- */
#top{position:sticky;top:0;z-index:20;background:rgba(19,16,13,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(4px)}
#topbar{display:flex;align-items:center;gap:18px;padding:8px 16px;flex-wrap:wrap}
.brand-name{font-size:21px;color:var(--gold2);line-height:1.1}
.brand-sub{font-size:12px;color:var(--muted)}
.mini{display:flex;align-items:center;gap:4px}
.mini .lbl{color:var(--muted);font-size:13px;margin-right:4px}
.mini-mana{flex-direction:column;align-items:stretch;gap:3px}
.mini-mana .row{gap:4px}
.save-dot{margin-left:auto;font-size:12px;color:var(--ok);transition:color .2s}
.save-dot.dirty{color:var(--gold)}
#tabs{display:flex;gap:2px;padding:0 12px;overflow-x:auto;scrollbar-width:thin}
#tabs:empty{display:none}
.nav-groups{display:flex;gap:4px;padding:6px 12px 0;flex-wrap:wrap}
.grp{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid transparent;border-radius:8px 8px 0 0;padding:6px 14px;color:var(--muted);cursor:pointer;font-size:15px;font-family:Georgia,serif}
.grp:hover{color:var(--text);background:var(--panel)}
.grp.active{color:var(--gold2);background:var(--panel);border-color:var(--line);border-bottom-color:var(--panel)}
.nav-groups.bottom{display:none}
.hdr-compact{display:none}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 12px;color:var(--muted);cursor:pointer;white-space:nowrap;font-size:14px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--gold2);border-bottom-color:var(--gold)}
.tab-ico,.tab-short{display:none}
.tab .badge{display:inline-block;margin-left:5px;background:var(--panel2);border-radius:9px;padding:0 6px;font-size:11px;color:var(--gold)}

main{max-width:1180px;margin:0 auto;padding:18px 16px 80px}

/* ---------- generic ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.panel-title{font-size:18px;color:var(--gold2);margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.stack>.panel{margin-bottom:0}
.grow{flex:1 1 auto;min-width:0}
.small{font-size:13px}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:13.5px;margin:0 0 12px;max-width:900px}
.empty{color:var(--muted);font-style:italic;padding:14px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius)}
.desc{white-space:pre-wrap;margin-top:6px}
.notes{white-space:pre-wrap;margin-top:6px;color:var(--muted);font-size:13.5px}
.lock{color:var(--lock)}
.warn{color:#e3a35a}
.err{color:var(--danger)}

.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:6px 12px;cursor:pointer;transition:background .12s,border-color .12s;line-height:1.2}
.btn:hover:not(:disabled){background:#352c23;border-color:var(--gold)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:#5b4423;border-color:var(--gold);color:#fff3da}
.btn.primary:hover:not(:disabled){background:#6f532b}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:#6a3a32}
.btn.danger:hover:not(:disabled){border-color:var(--danger);background:#3a221d}
.btn.small{padding:3px 8px;font-size:13px}
.btn.sq{width:28px;padding:3px 0;text-align:center}
.btn.big{font-size:18px;padding:10px 0;min-width:58px;font-weight:600}
.btn.cast{font-size:15px;padding:9px 18px}
.btn.toggle{font-size:13px}
.btn.toggle.on{background:#2f3d24;border-color:var(--ok);color:#d4f0c8}

input,select,textarea{background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:6px 8px;outline:none;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{width:100%;resize:vertical;min-height:60px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold);margin:0;cursor:pointer}
select option:disabled{color:#7a6d5c}
.num{width:80px;text-align:center}
.lvl{display:inline-flex;align-items:center;gap:3px}
.lvl-num{width:52px;padding:3px 4px}
.search{min-width:220px;flex:0 1 320px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.field input:not([type=checkbox]),.field select{width:100%}
.form{display:grid;gap:10px;margin-top:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}

.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:1px 9px;font-size:12.5px;white-space:nowrap}
.chip.mod{border-color:#4e6a3e;color:#c4e3b2}
.chip.affix{border-color:#5d4a2c;color:var(--gold2)}
.chip.locked{border-color:var(--line);color:var(--lock)}
.chip.free{border-color:#5b4a7a;color:#cdbaf2}
.chip.st-active{border-color:#4e6a3e;color:#c4e3b2}
.chip.st-done{border-color:#3e5a6a;color:#b2d6e3}
.chip.st-failed{border-color:#6a3a32;color:#f0a99c}
.chip.st-paused{border-color:#6a5a32;color:#e9d18f}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:11px 14px}
.card.equipped{border-color:#4e6a3e;box-shadow:inset 3px 0 0 var(--ok)}
.card.locked{opacity:.8}
.card-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-title{font-size:17px;color:var(--gold2);flex:1 1 auto;min-width:0}
.qty{color:var(--muted);font-size:14px}
.list{display:grid;gap:8px}
.sub{border-top:1px dashed var(--line);margin-top:10px;padding-top:8px;display:grid;gap:6px}
.sub-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.danger-row{display:flex;justify-content:flex-end;margin-top:4px}

details.fold{margin-top:8px}
details.fold>summary{cursor:pointer;color:var(--gold);font-size:14px;list-style:none;padding:3px 0;user-select:none}
details.fold>summary::before{content:"▸ ";display:inline-block;width:1em}
details.fold[open]>summary::before{content:"▾ "}
details.fold.section>summary{font-family:Georgia,serif;font-size:20px;color:var(--gold2);padding:6px 0}
details.fold.section{margin:6px 0 14px}

/* ---------- character ---------- */
.grid-char{display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,1.2fr);gap:14px;margin-bottom:14px}
.grid-char>.panel{margin-bottom:0}
.hero{display:flex;flex-direction:column;gap:14px}
.hero-top{display:flex;gap:16px;align-items:flex-start}
.hero-stats{border-top:1px solid var(--line);padding-top:12px}
.hero-stats .stat-grid{grid-template-columns:1fr;gap:8px}
.hero-stats .stat-card{padding:10px}
.hero-stats .stat-card .btn.big{min-width:40px}
.portrait{width:150px;height:200px;object-fit:cover;border-radius:8px;border:1px solid var(--line2);flex:none;background:var(--panel2)}
.hero-info{flex:1;min-width:0}
.hero-info h2{font-size:26px;margin:0}
.bio{white-space:pre-wrap;font-size:13.5px;color:#cfc4b2;margin:8px 0 0}
.big-counter{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.counter-val{display:flex;align-items:baseline;gap:4px;padding:0 8px}
.big-num{width:96px;font-size:28px;font-weight:600;padding:4px;text-align:center}
.of{font-size:22px;color:var(--muted)}
.bar{height:10px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:10px 0 8px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--mana),var(--mana2));transition:width .2s}
.bar.thin{height:5px;margin:0}
.gold-val{color:var(--gold2)}
.points{font-size:15px;padding:4px 12px;border:1px solid var(--line);border-radius:16px}
.points.has{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 8px rgba(212,173,98,.25)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:10px}
.stat-card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.stat-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stat-name{font-family:Georgia,serif;font-size:17px;color:var(--gold2)}
.stat-total{font-size:28px;font-weight:600}
.plan{color:var(--ok)}
.stat-card .btn.big{min-width:48px;padding:6px 0}
.thr-list{display:grid;gap:6px;margin-top:6px}
.thr{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:6px;background:var(--panel)}
.thr.future{opacity:.65}
.thr-badge{font-weight:600;color:var(--gold);min-width:46px}
.thr.future .thr-badge{color:var(--muted)}

/* ---------- elemental ---------- */
.el-grid{display:grid;grid-template-columns:1fr;gap:14px}
.element{border-top:3px solid var(--c,var(--gold));margin:0}
.element .el-name{font-size:21px;color:var(--c);flex:1}
.el-fire{--c:var(--fire)} .el-water{--c:var(--water)} .el-earth{--c:var(--earth)} .el-air{--c:var(--air)}
.tier-title{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:10px 0 4px}
.stage{border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-bottom:6px;background:var(--bg2)}
.stage.ok{border-left:3px solid var(--c,var(--ok))}
.stage.locked{opacity:.72}
.stage-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.stage-icon{width:18px;text-align:center}
.stage-lvl{display:inline-flex;align-items:center;gap:3px;color:var(--gold)}
.stage-lvl input{width:48px;padding:2px 4px;text-align:center}
.stage-lvl.unset input{border-color:#8a6a3a;background:#2c2418}

/* ---------- spells ---------- */
.combo{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:10px 0 4px;font-size:15px}
.formula .plus{color:var(--muted)}
.formula .q{color:var(--muted);font-style:italic}
.formula .part{padding:2px 9px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2)}
.formula .part.el{border-color:var(--c);color:var(--c)}
.formula .part.locked{color:var(--lock);border-style:dashed}
.formula.big{font-size:17px}
.cost{color:var(--mana2);font-weight:600;white-space:nowrap}
.uses{color:var(--muted);font-size:13px}
.spell .row.actions{margin-top:8px}
.untested-eq{font-size:17px;color:var(--text);line-height:1.6}
.untested-eq .eq-affix{color:var(--gold2);font-weight:700}
.untested-eq .plus{color:var(--muted)}
.tested .untested-eq .eq-affix{color:var(--ok)}

/* ---------- experience ---------- */
.exp-item{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);margin-bottom:8px}
.exp-item.checked{border-color:#4e6a3e;background:#1f251a}
.exp-item input[type=checkbox]{width:24px;height:24px}
.exp-item .exp-text{font-size:15.5px;cursor:pointer}
.exp-item .exp-note{grid-column:2}
.exp-item .exp-note input{width:100%;font-size:13px;padding:4px 8px}

/* ---------- npc ---------- */
.npc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.npc{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.npc.open{grid-column:1/-1}
.npc-top{display:flex;gap:12px}
.npc-img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line2);flex:none;background:var(--panel2)}
.npc.open .npc-img{width:120px;height:120px}
.npc-name{font-family:Georgia,serif;font-size:17px;color:var(--gold2)}
.npc .chips{margin-top:3px}
.rel-link{background:none;border:none;color:var(--gold2);text-decoration:underline dotted;cursor:pointer;padding:0}
.flash{animation:flash 1.4s}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:0 0 0 0 transparent}}

/* ---------- toasts ---------- */
#toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:6px;z-index:50;pointer-events:none}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--gold);padding:8px 14px;border-radius:7px;box-shadow:0 4px 18px rgba(0,0,0,.5);transition:opacity .4s,transform .4s}
.toast.error{border-left-color:var(--danger)}
.toast.ok{border-left-color:var(--ok)}
.toast.hide{opacity:0;transform:translateY(8px)}

/* ---------- header portrait ---------- */
.top-portrait{width:58px;height:76px;object-fit:cover;object-position:top;border-radius:8px;border:2px solid var(--gold);cursor:pointer;
  background:var(--panel2);transition:transform .2s,box-shadow .2s;transform-origin:top left;position:relative;z-index:30}
.top-portrait:hover{transform:scale(3.2);box-shadow:0 10px 40px rgba(0,0,0,.8)}
.btn.big{min-width:52px}

/* ---------- tags ---------- */
.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center;background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:4px 6px}
.tags input{border:none;background:transparent;padding:3px 2px;min-width:90px;flex:1}
.chip.tag{display:inline-flex;align-items:center;gap:4px}
.chip .x{background:none;border:none;color:var(--muted);cursor:pointer;padding:0 0 0 2px;font-size:14px;line-height:1}
.chip .x:hover{color:var(--danger)}
.chip.link{cursor:pointer;color:var(--gold2);border-color:#5d4a2c}
.chip.link:hover{border-color:var(--gold);background:#352c23}

/* ---------- free affixes / elements ---------- */
.free-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 10px}
.free-item{padding:3px 6px;border-radius:6px}
.free-item.on{background:#2a2238;color:#ddd0f7}
.element.unlearned{opacity:.7;border-top-color:var(--line2)}
.element.unlearned .el-name{color:var(--muted)}

/* ---------- untested ---------- */
.combo-card{padding:8px 12px}
.hidden-combo{opacity:.55}

/* ---------- quests ---------- */
.quest{border-left:3px solid var(--line2)}
.quest.q-active{border-left-color:var(--gold)}
.quest.q-planned{border-left-color:#7d8fb0}
.quest.q-done{border-left-color:var(--ok);opacity:.75}
.quest.q-failed{border-left-color:var(--danger);opacity:.7}
.quest.q-paused{border-left-color:#8c7d6a;opacity:.85}
.steps{display:grid;gap:3px;margin-top:8px}
.step.done{color:var(--muted);text-decoration:line-through}
.step-input{font-size:13px;padding:3px 8px;width:260px;background:transparent;border-style:dashed}

/* ---------- geography ---------- */
.seg{display:inline-flex;gap:2px}
.crumbs{margin:-4px 0 10px;font-size:14px}
.crumb{background:none;border:none;color:var(--gold2);cursor:pointer;padding:2px 4px;border-radius:4px}
.crumb:hover{background:var(--panel2)}
.geo-panel{padding:8px}
.geo-svg{width:100%;height:auto;display:block;background:radial-gradient(ellipse at center,#221c16,#17130f);border-radius:8px;touch-action:none;user-select:none}
.geo-svg .edge{stroke:#b49a6a;stroke-width:2.5;opacity:.75}
.geo-svg .edge.inner{stroke:#7d8fb0;stroke-dasharray:7 6;stroke-width:2}
.geo-svg .node{cursor:grab}
.geo-svg .node rect{stroke-width:2}
.geo-svg .node text{fill:var(--text);font-size:15px;font-family:Georgia,serif;pointer-events:none}
.geo-svg .node .ntype,.geo-svg .ntype{fill:var(--muted);font-size:11px;font-family:"Segoe UI",sans-serif}
.geo-svg .node .ninner{fill:var(--gold);font-size:11px;font-family:"Segoe UI",sans-serif}
.geo-svg .stack-shadow{fill:#1b1713;stroke-width:1.5;opacity:.8}
.geo-svg .node.selected rect:not(.stack-shadow){stroke:var(--gold2);stroke-width:3.5}
.geo-svg .node.from rect:not(.stack-shadow){stroke:var(--ok);stroke-width:4}
.geo-svg.linking .node{cursor:crosshair}
.geo-legend{padding:6px 4px 0}
.card.featured{border-color:var(--gold)}

/* ---------- transformations ---------- */
.transform-box{margin-top:10px;padding:8px 12px;border:1px dashed #5b4a7a;border-radius:8px;background:#1e1a26;display:grid;gap:6px}
.transform-ok{color:#ddd0f7}
.chain{color:#cdbaf2;margin-top:4px}
.origin .formula{display:inline-flex;margin:0 0 0 4px;font-size:13px}
.formula .part.consumed{color:var(--muted);border-style:dashed}
.formula .part.affix{font-weight:600}
.transform-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;margin:4px 0 0 18px;padding-left:10px;border-left:2px solid #5b4a7a}
.transform-line .untested-eq{font-size:15.5px;flex:0 1 auto}
.tr-mark{color:#cdbaf2;font-weight:600}
.has-transform{border-color:#5b4a7a}
.eq-spent{color:var(--muted)}
.req-text{color:var(--gold2)}
.rules{display:grid;gap:8px}
.rule{align-items:flex-start}

/* ---------- thumbnails ---------- */
.thumb{width:46px;height:46px;object-fit:cover;border-radius:7px;border:1px solid var(--line2);flex:none;background:var(--panel2);
  transition:transform .2s,box-shadow .2s;transform-origin:left center;position:relative;z-index:2}
.thumb:hover{transform:scale(3.5);box-shadow:0 8px 30px rgba(0,0,0,.8);z-index:10}
.formula .affs{color:var(--muted)}

/* ---------- health ---------- */
.track{padding:6px 0;border-bottom:1px dashed var(--line)}
.track:last-of-type{border-bottom:none}
.track-head{display:flex;align-items:center;gap:8px}
.track-name{font-family:Georgia,serif;color:var(--gold2)}
.track-val{font-weight:700}
.track-val.pool{color:#ef7d7d}
.track-val.wound{color:#e3a35a}
.pips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.pip{width:28px;height:28px;border-radius:6px;border:1px solid var(--line2);background:var(--bg2);cursor:pointer;
  font-size:15px;line-height:1;color:#4a3e33;padding:0}
.pips.pool .pip.on{color:#ef5f5f;border-color:#8a3a3a;background:#2c1a1a}
.pips.wound .pip.on{color:#f0b56a;border-color:#8a6a3a;background:#2c2418}
.pip:hover{border-color:var(--gold)}
.mini-health{gap:10px;flex-wrap:wrap}
.mini-track{display:inline-flex;align-items:center;gap:3px}
.mini-track .lbl{margin-right:2px}

/* ---------- dice ---------- */
.dice-panel{display:grid;gap:12px}
.dice-buttons{display:flex;flex-wrap:wrap;gap:8px}
.die-btn{font-size:18px;font-weight:600;min-width:76px;padding:12px 10px}
.dice-expr{font-size:16px}
.presets .preset{display:inline-flex;align-items:center;gap:2px}
.presets .x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px}
.presets .x:hover{color:var(--danger)}
.dice-result{display:flex;gap:18px;align-items:center;border-color:var(--gold)}
.dice-total{font-size:54px;font-weight:700;color:var(--gold2);min-width:90px;text-align:center;font-family:Georgia,serif}
.dice-break{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:4px}
.die{display:inline-block;min-width:26px;padding:2px 6px;text-align:center;border:1px solid var(--line2);border-radius:6px;background:var(--bg2);font-weight:600}
.die.max{color:var(--ok);border-color:var(--ok)}
.die.min{color:var(--danger);border-color:#6a3a32}
.die.dropped{opacity:.4;text-decoration:line-through}
.roll-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 12px}
.roll-total{font-size:20px;color:var(--gold2);min-width:40px}

/* ---------- wounds & experience log ---------- */
.wounds{display:grid;gap:4px;margin-top:6px}
.wound{flex-wrap:nowrap}
.wound input{font-size:13.5px;padding:4px 8px}
.wound-n{color:#f0b56a;font-size:13px;min-width:34px}
.exp-note .row{flex-wrap:nowrap}
.exp-note .row input{flex:1;width:auto}
.exp-similar:empty{display:none}
.exp-similar{margin-top:4px}
.xp-log{display:grid;gap:3px;margin-top:4px}
.xp-entry input{font-size:13px;padding:3px 8px;background:transparent}

/* ---------- hits & cost ---------- */
.hp-bar>div{background:linear-gradient(90deg,#b23b3b,#ef7d7d)}
.hp-bar.dead{border-color:var(--danger)}
.hp-val{font-size:22px;font-weight:700;color:#ef7d7d;font-family:Georgia,serif}
.hp-val.small-hp{font-size:15px}
.hp-val.dead{color:var(--muted);text-decoration:line-through}
.wound-n.light{color:#e9d18f}
.wound-n.medium{color:#f0b56a}
.wound-n.heavy{color:#ef7d7d}
.cost-box{margin-top:10px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg2)}
.big-cost{font-size:20px}
.mult-grid{display:flex;flex-wrap:wrap;gap:8px}
.mult-cell{display:flex;flex-direction:column;gap:2px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg2)}

/* ---------- chronicle ---------- */
.chr-when{font-size:13px;color:var(--gold);border:1px solid #5d4a2c;border-radius:12px;padding:1px 10px;white-space:nowrap}
.chr-text{line-height:1.6}
.mention{background:none;border:none;padding:0;font:inherit;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.mention-npc{color:#9fd0ff}
.mention-loc{color:#a8dca0}
.mention-faction{color:#e0b4f0}
.mention:hover{text-decoration-style:solid}

/* ---------- groups & storage ---------- */
.npc.group{border-color:#5b4a7a}
.npc.group .npc-name{color:#e0c8f7}
.kind-mark{font-size:15px}
.chip.group-count{border-color:#5b4a7a;color:#e0c8f7}
.chip.link.group-link{border-color:#5b4a7a;color:#e0c8f7}
.members{display:flex;flex-wrap:wrap;gap:6px}
.member{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line2);border-radius:20px;padding:2px 10px 2px 2px;cursor:pointer;color:var(--text)}
.member:hover{border-color:var(--gold)}
.member img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.orphan-row{margin:-4px 0 10px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip .x.add{color:var(--ok);font-weight:700}
.storage-bar>div{background:linear-gradient(90deg,#4e8a46,#7dbb72)}
.storage-bar.half>div{background:linear-gradient(90deg,#a07a32,#e3a35a)}
.storage-bar.full>div{background:linear-gradient(90deg,#9a3a2e,#d0614f)}

.chr-year{font-family:Georgia,serif;font-size:20px;color:var(--gold2);margin:10px 0 0;padding-bottom:2px;border-bottom:1px solid var(--line)}
.chr-year.undated{color:var(--muted);font-size:16px}
.chr-when.bad{border-color:#6a3a32;color:#e3a35a}

.exp-item.need-note{border-color:#8a6a3a}
.exp-item.need-note .exp-note input:not(.grow){border-color:#e3a35a;background:#2c2418}

.geo-wrap{position:relative}
.geo-zoom{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px}
.geo-zoom .btn{background:rgba(42,35,28,.9)}
.geo-svg{cursor:grab;aspect-ratio:1000/560}
.geo-svg.panning{cursor:grabbing}

/* ---------- territories ---------- */
.geo-svg .terr{fill-opacity:.17}
.geo-svg .terr.none{fill-opacity:.1}
.geo-svg .terr-hatch{opacity:.38}
.geo-svg .terr-border{stroke:#e8dcc0;stroke-width:2.5;stroke-opacity:.55;stroke-dasharray:9 5}
.geo-svg .terr-edge{stroke-width:2;stroke-opacity:.5}
.geo-svg .node rect.node-base{fill:#1b1713;stroke:none}
.geo-svg .node rect.node-face{fill-opacity:.32;stroke-width:2}
.geo-svg .node.disputed rect.node-face{stroke-dasharray:6 3}
.geo-svg .node.selected rect.node-face{stroke:var(--gold2);stroke-width:3.5}
.geo-svg .node.from rect.node-face{stroke:var(--ok);stroke-width:4}
.geo-legend-box{position:absolute;left:8px;bottom:8px;background:rgba(27,23,19,.88);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;display:grid;gap:3px;max-height:45%;overflow:auto}
.leg-row{display:flex;align-items:center;gap:6px}
.leg-row.link{cursor:pointer}
.leg-row.link:hover{color:var(--gold2)}
.leg-sw{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}
.leg-sw.hatch{background:repeating-linear-gradient(45deg,#c9a45c 0 3px,#5a8fe0 3px 6px)}
.owner-line{margin:4px 0}

/* ---------- duplicates ---------- */
.dup-list{display:grid;gap:12px}
.dup-pair{border:1px dashed #8a6a3a;border-radius:var(--radius);padding:8px;background:rgba(227,163,90,.04)}
.dup-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;font-size:15px}
.dup-head mark{background:rgba(227,163,90,.35);color:inherit;border-radius:3px;padding:0 1px}
.dup-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
.dup-cards .npc.open{grid-column:auto}

.aka{font-family:"Segoe UI",sans-serif;font-size:12.5px;color:var(--muted);font-weight:normal}

.mention-missing{text-decoration:underline wavy #d0614f;text-underline-offset:3px;cursor:help}

/* ---------- help ---------- */
.help-btn{font-weight:700;color:var(--gold2);border-color:#5d4a2c}
.help-section.current{border-color:var(--gold)}
.help-body{line-height:1.6;max-width:860px}
.help-body h4{margin:14px 0 4px;color:var(--gold2);font-family:Georgia,serif;font-weight:normal;font-size:16px}
.help-body p{margin:6px 0}
.help-body code{background:var(--bg2);border:1px solid var(--line2);border-radius:4px;padding:1px 6px;font-family:Consolas,monospace;font-size:13.5px;color:#f0d8a8}
.help-rule{padding:8px 12px;border-left:3px solid var(--gold);background:rgba(212,173,98,.08);border-radius:4px;margin:6px 0}
.help-table{border-collapse:collapse;margin:8px 0;font-size:14px}
.help-table th,.help-table td{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
.help-table th{color:var(--muted);font-weight:normal}
.mention-npc,.mention-loc,.mention-faction{text-decoration:underline dotted;text-underline-offset:3px}
.scheme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.scheme-thumb{display:flex;flex-direction:column;gap:4px;align-items:center;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:6px;cursor:zoom-in;color:var(--text)}
.scheme-thumb:hover{border-color:var(--gold)}
.scheme-thumb img{width:100%;height:180px;object-fit:cover;object-position:top;border-radius:5px}
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(8,6,4,.92);overflow:auto;cursor:zoom-out;display:flex;flex-direction:column;align-items:center;padding:14px}
.lightbox-head{color:var(--gold2);font-family:Georgia,serif;font-size:18px;margin-bottom:10px}
.lightbox img{max-width:min(900px,96vw);height:auto;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.7)}

.parts-info{margin:4px 0 0;padding:6px 10px;border-left:2px solid #5d4a2c;color:#d8cdb8;display:grid;gap:2px}

/* ---------- geo search ---------- */
.geo-search{position:relative}
.geo-search-input{min-width:240px}
.geo-search-list{position:absolute;top:calc(100% + 4px);left:0;z-index:45;min-width:320px;max-height:360px;overflow:auto;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.6);display:grid}
.geo-search-item{display:block;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:6px 10px;color:var(--text);cursor:pointer}
.geo-search-item:hover{background:#352c23}
.geo-svg .node.dim{opacity:.28}
.geo-svg .node.match rect.node-face{stroke:#fff;stroke-width:3.5}
.geo-svg .node.found rect.node-face{animation:nodeFound 1.6s ease-out}
@keyframes nodeFound{0%{stroke:#fff;stroke-width:9}100%{stroke-width:2}}

/* ---------- combos ---------- */
.card.spell-combo{border-left:3px solid #5b4a7a}
.combo-steps{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.combo-step{background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:2px 10px;font-size:14px}
.combo-step.broken{border-style:dashed;color:var(--warn,#e3a35a)}
.combo-arrow{color:var(--muted)}

.disc-level{border:1px dashed var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:6px}

/* золото до 7 цифр */
#topbar .gold-val{width:96px}
.big-num.gold-val{width:170px}
.gold-counter{display:grid;justify-items:center;gap:8px}
.gold-row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}

@media (max-width:760px){
  /* телефон: группы — панелью внизу экрана, шапка — только значения */
  .nav-groups.top{display:none}
  .nav-groups.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;padding:4px 2px calc(4px + env(safe-area-inset-bottom));
    background:rgba(19,16,13,.97);border-top:1px solid var(--line);justify-content:space-around;flex-wrap:nowrap;gap:0}
  .nav-groups.bottom .grp{flex-direction:column;gap:1px;padding:4px 6px;font-size:11px;font-family:"Segoe UI",sans-serif;border:none;border-radius:8px;flex:1}
  .nav-groups.bottom .grp .ico{font-size:21px}
  .nav-groups.bottom .grp.active{background:var(--panel2)}
  main{padding-bottom:90px}
  #tabs{padding:0 2px;overflow:visible;justify-content:space-around}
  #tabs .tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px 6px;font-size:11px;position:relative}
  #tabs .tab-full{display:none}
  #tabs .tab-ico{display:block;font-size:19px;line-height:1.1}
  #tabs .tab-short{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  #tabs .tab .badge{position:absolute;top:1px;right:calc(50% - 26px);margin:0;font-size:10px;padding:0 4px}
  #toasts{bottom:78px;right:10px;left:10px}
  #topbar{gap:8px;padding:6px 10px;flex-wrap:nowrap}
  #topbar .mini,#topbar .brand-sub,#topbar .save-dot{display:none}
  .top-portrait{width:38px;height:48px}
  .top-portrait:hover{transform:none;box-shadow:none}
  .brand-name{font-size:17px}
  .hdr-compact{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;margin-left:auto;justify-content:flex-end}
  .hc-hp{color:#ef7d7d;font-weight:700}
  .hc-hp.dead{color:var(--muted);text-decoration:line-through}
  .hc-wounds{color:#f0b56a}
  .hc-mana{color:var(--mana2);font-weight:700}
  .hc-gold{color:var(--gold2)}
  .dup-cards{grid-template-columns:1fr}
  .grid-char{grid-template-columns:1fr}
  .hero-top{flex-direction:column}
  .portrait{width:100%;height:260px}
  #topbar{gap:10px}
}
</style>
</head>
<body>
<div id="top">
  <header id="topbar"></header>
  <nav id="groups" class="nav-groups top"></nav>
  <nav id="tabs"></nav>
</div>
<main id="view"></main>
<nav id="groups-bottom" class="nav-groups bottom"></nav>
<div id="toasts"></div>

<script>

const MANA_BASE = 50;

  { key: 'heavyToDeath', name: 'Тяжёлых ран до смерти', short: 'Тяжёлых ран до смерти',
    get: () => WOUND_RULES.heavyToDeath, set: () => {} },
  { key: 'freeSlots', name: 'Ячеек свободного аффикса', short: 'Ячеек свободного аффикса',

const OPS = {

// Поля NPC, где может быть несколько значений
const NPC_TAG_FIELDS = ['status', 'faction', 'location'];
const toTags = v => Array.isArray(v) ? v.map(x => String(x).trim()).filter(Boolean)
  : String(v || '').split(',').map(x => x.trim()).filter(Boolean);

const QUEST_KINDS = { quest: 'Квест', goal: 'Цель', try: 'Хочу попробовать', idea: 'Идея' };

  element: 'Стихия (по уровню)',

  ['studiedOrTaughtMagic', 'Изучал магию или обучал магии.'],
  ['spiritualPracticeOrEntities', 'Использовал духовные практики или общался с потусторонними силами.'],

// Стартовые данные по схемам стихий (с картинок). Всё редактируется в приложении.

  { id: "fire", name: "Огонь", description: "Стихия роста. Огонь по своей природе стремится расти, распространяться и становиться сильнее.", stages: [

    { n: "Дым", t: "advanced", from: "Истинное пламя", a: ["Сокрытие","Удушение"], req: "Энтропия ×2, Рост ×1", m: 8 },
    { n: "Жар", t: "advanced", from: "Истинное пламя", a: ["Пробивание","Прозрачность"], req: "Пробивание ×3", m: 8 },
    { n: "Свет", t: "advanced", from: "Истинное пламя", a: ["Моментальный","Очищение"], req: "Ускорение ×3", m: 8 },
    { n: "Пепел", t: "advanced", from: "Истинное пламя", a: ["Заряд","Укрепление"], req: "Энтропия ×1, Укрепление ×1, Заряд ×1", m: 8 },
    { n: "Плазма", t: "master", from: "Чистое пламя", a: ["Независимость","Плазменная Энтропия","Плазменное Пробивание"], req: "Великое Укрепление ×1, Великое Ускорение ×1, Великий Рост ×1", m: 16, rn: "надо разблокировать крупным бонусом после открытия предыдущих стихий" },
  ]},
  { id: "water", name: "Вода", description: "Стихия управления. Вода принимает форму и подчиняет себе окружающую среду.", stages: [
    { n: "Вода", t: "linear", lvl: 1, a: ["Управление"], m: 1 },
    { n: "Лёд", t: "advanced", from: "Вода", a: ["Укрепление"], req: "Укрепление ×2", m: 2 },
    { n: "Пар", t: "advanced", from: "Вода", a: ["Заряд","Рост"], req: "Ускорение ×1, Рост ×1", m: 2 },
    { n: "Древний лёд", t: "advanced", from: "Лёд", a: ["Преломление","Укрепление"], req: "Укрепление ×3, Заряд ×1, Управление ×2", m: 4 },
    { n: "Кислота", t: "advanced", from: "Вода", a: ["Коррозия","Энтропия"], req: "Энтропия ×2, Управление ×2, Деление ×2", m: 8 },
    { n: "Кровь", t: "advanced", from: "Вода", a: ["Восстановление","Пробивание"], req: "Управление ×5, Пробивание ×5", m: 8 },
    { n: "Вечный лёд", t: "master", from: "Древний лёд", a: ["Вечный Заряд","Моментальная Заморозка","Неподвижность"], req: "Великое Укрепление ×1, Великий Заряд ×1, Великое Управление ×1", d: "Парадоксальная форма воды: время останавливается, материя застывает в абсолютной неподвижности.", m: 16, rn: "надо разблокировать крупным бонусом после открытия предыдущих стихий" },

const AFFIX_DESCRIPTIONS = {
  "Укрепление": "Замедляет заклинание.\nТри Укрепления замедляют вдвое.",
  "Избирательный": "Не попадает по своим.",

};

// Множители стоимости маны по ступеням — правило игры, берутся только отсюда (ключ «стихия|ступень»)
const STAGE_MULTIPLIERS = new Map(ELEMENT_SEED.flatMap(e => e.stages.filter(st => st.m != null).map(st => [e.id + '|' + st.n, st.m])));

// «Рост ×2, Укрепление ×1» → [{affixId, count}]. getAffix(name) находит или создаёт аффикс.
function parseReqs(text, getAffix) {
  const reqs = [];
  for (const part of String(text || '').split(/[,;\n]/)) {
    const m = part.trim().match(/^(.+?)\s*(?:[×xхX*]\s*(\d+))?$/);
    if (!m || !m[1].trim()) continue;
    const a = getAffix(m[1].trim());
    const count = Number(m[2]) || 1;
    const same = reqs.find(r => r.affixId === a.id);
    if (same) same.count += count; else reqs.push({ id: uid('req'), affixId: a.id, count });
  }
  return reqs;
}

function buildDefaultMagic() {
  const affixes = [];
  const byName = {};
  const affix = name => {
    if (!byName[name]) {
      byName[name] = { id: uid('affix'), name, description: '', requirements: '', notes: '', links: [] };
      affixes.push(byName[name]);
    }
    return byName[name];
  };
  const elements = ELEMENT_SEED.map(seed => {
    const el = { id: seed.id, name: seed.name, level: 0, description: seed.description, conditions: '', stages: [] };
    const idByName = {};
    for (const s of seed.stages) {
      const st = {
        id: uid('stage'), name: s.n, tier: s.t, minLevel: s.lvl ?? null, unlocked: false,
        parentId: s.from ? idByName[s.from] || null : null, requirements: s.rn || '', reqs: parseReqs(s.req, affix), description: s.d || '',
      };
      idByName[s.n] = st.id;
      el.stages.push(st);
      for (const an of s.a || []) affix(an).links.push({ id: uid('link'), type: 'stage', targetId: st.id });
    }
    return el;
  });
  const forms = FORM_SEED.map(f => {
    const form = { id: uid('form'), name: f.n, description: f.d || '', known: false, source: f.src || '' };
    (f.a || []).forEach(an => affix(an).links.push({ id: uid('link'), type: 'form', targetId: form.id }));
    return form;
  });
  for (const [name, text] of Object.entries(AFFIX_DESCRIPTIONS)) affix(name).description = text;
  affixes.sort((a, b) => a.name.localeCompare(b.name, 'ru'));
  return { elements, forms, affixes };
}

/* =====================================================================
   STORAGE — загрузка, сохранение, миграции, резервные копии
   ===================================================================== */
// Миграции: ключ — версия, из которой мигрируем.
const MIGRATIONS = {
  // v1 → v2: уровень 0 = стихия не изучена (ступени сдвигаются на +1),
  // у NPC статус/фракция/место стали списками, появились география и квесты.
  1: s => {
    for (const el of s.elementalMagic?.elements || [])
      for (const st of el.stages || [])
        if (st.minLevel !== null && st.minLevel !== undefined && st.minLevel !== '') st.minLevel = Number(st.minLevel) + 1;
    for (const n of s.npcs || []) for (const k of NPC_TAG_FIELDS) n[k] = toTags(n[k]);
    s.version = 2;
    return s;
  },
  // v2 → v3: требования ступеней из текста в список «аффикс × количество», правила превращений
  2: s => {
    const em = s.elementalMagic;
    const getAffix = name => {
      let a = em.affixes.find(x => x.name.trim().toLowerCase() === name.toLowerCase());
      if (!a) { a = { id: uid('affix'), name, description: '', requirements: '', notes: '', links: [] }; em.affixes.push(a); }
      return a;
    };
    for (const el of em.elements) for (const st of el.stages || []) {
      if (!st.reqs) { st.reqs = parseReqs(st.requirements, getAffix); st.requirements = ''; }
      if (st.name === 'Идеальный материал' && !st.parentId) st.parentId = el.stages.find(x => x.name === 'Кристалл')?.id || null;
    }
    s.version = 3;
    return s;
  },
  // v3 → v4: стихия и форма дают все свои аффиксы — выбор одного аффикса стихии/формы убран
  3: s => {
    const strip = o => {
      if (!o) return;
      delete o.elementAffixId; delete o.formAffixId;
      if (o.consumed) o.consumed = o.consumed.filter(k => k !== 'elementAffixId' && k !== 'formAffixId');
      strip(o.origin);
    };
    (s.spellbook || []).forEach(strip);
    (s.untestedCombinations || []).forEach(strip);
    s.version = 4;
    return s;
  },
  // v4 → v5: правила превращений уточнены (зашиты в код), стоимость по уровню ступени;
  // здоровье: хиты + лёгкие/средние/тяжёлые раны без максимума
  4: s => {
    const r = s.elementalMagic?.rules;
    if (r) {
      for (const k of ['elementAffixCounts', 'consume', 'refill', 'manaMultiplier', 'manaPerStep']) delete r[k];
    }
    for (const sp of s.spellbook || []) delete sp.baseCost;
    const old = s.character?.health || {};
    const items = t => Array.isArray(t?.items) ? t.items
      : Array.from({ length: Number(t?.current) || 0 }, () => ({ id: uid('wound'), text: '', date: new Date().toISOString() }));
    if (s.character) s.character.health = {
      light: { items: items(old.light) }, medium: { items: [] }, heavy: { items: items(old.heavy) },
      lightPerMedium: 3, mediumPerHeavy: 3, heavyToDeath: 4,
    };
    s.version = 5;
    return s;
  },
  // v5 → v6: уровень ступени снова считается сам; у каждой ступени свой множитель стоимости.
  // Числа, вписанные в поле «ур.», переносятся в множитель. Общая таблица множителей по уровням убрана.
  5: s => {
    for (const el of s.elementalMagic?.elements || []) for (const st of el.stages || []) {
      if (st.magicLevel !== null && st.magicLevel !== undefined && st.magicLevel !== '' && st.costMultiplier == null)
        st.costMultiplier = Number(st.magicLevel);
      delete st.magicLevel;
    }
    if (s.elementalMagic?.rules) delete s.elementalMagic.rules.levelMultipliers;
    s.version = 6;
    return s;
  },
  // v6 → v7: соотношение ран — правило в коде; база ячеек свободного аффикса 0 (первую даёт «Магическая теория»)
  6: s => {
    const hp = s.character?.health;
    if (hp) { delete hp.lightPerMedium; delete hp.mediumPerHeavy; delete hp.heavyToDeath; }
    if (s.elementalMagic?.rules) s.elementalMagic.rules.freeSlots = 0;
    s.version = 7;
    return s;
  },
  // v7 → v8: база ячеек свободного аффикса и максимум маны больше не хранятся (правило и формула в коде)
  7: s => {
    if (s.elementalMagic) delete s.elementalMagic.rules;
    if (s.character?.mana) delete s.character.mana.baseMax;
    s.version = 8;
    return s;
  },
  // v8 → v9: у форм больше нет уровней (и условий повышения), у связей «аффикс — форма» нет минимального уровня
  8: s => {
    const em = s.elementalMagic;
    for (const f of em?.forms || []) { delete f.level; delete f.levels; delete f.conditions; }
    for (const a of em?.affixes || []) for (const l of a.links || []) if (l.type === 'form') delete l.minLevel;
    s.version = 9;
    return s;
  },
  // v9 → v10: множители ступеней — из правил (не хранятся); новые аффиксы «Избирательный» и «Ласковый»
  9: s => {
    const em = s.elementalMagic;
    for (const el of em?.elements || []) for (const st of el.stages || []) delete st.costMultiplier;
    for (const [name, text] of Object.entries(AFFIX_DESCRIPTIONS)) {
      const a = em?.affixes?.find(x => x.name.trim().toLowerCase() === name.toLowerCase());
      if (!a) em?.affixes?.push({ id: uid('affix'), name, description: text, requirements: '', notes: '', links: [] });
      else if (!a.description?.trim()) a.description = text;
    }
    s.version = 10;
    return s;
  },
};

function migrate(s) {
  while (s.version < APP_VERSION) {
    const m = MIGRATIONS[s.version];
    if (!m) throw new Error('Нет миграции с версии ' + s.version);
    s = m(s);
  }
  if (s.version > APP_VERSION) throw new Error(`Файл новее приложения (версия ${s.version})`);
  return normalize(s);
}

const isPlain = o => o && typeof o === 'object' && !Array.isArray(o);
function fillMissing(t, d) {
  for (const k in d) {
    if (!(k in t) || t[k] === undefined || t[k] === null && d[k] !== null) t[k] = d[k];
    else if (isPlain(t[k]) && isPlain(d[k])) fillMissing(t[k], d[k]);
  }
}

// Дозаполняет отсутствующие поля, чтобы старые/неполные сохранения не ломали интерфейс
// Ступени стихий — правило игры из ELEMENT_SEED. При каждом открытии пересобираются из страницы:
// ярус, уровень открытия, «растёт из», требования, описание и аффиксы ступени. От сохранения берутся только id и «открыта».
function syncStagesFromSeed(s) {
  const em = s.elementalMagic;
  const getAffix = name => {
    let a = em.affixes.find(x => x.name.trim().toLowerCase() === name.toLowerCase());
    if (!a) { a = { id: uid('affix'), name, description: '', requirements: '', notes: '', links: [] }; em.affixes.push(a); }
    return a;
  };
  for (const seed of ELEMENT_SEED) {
    let el = em.elements.find(e => e.id === seed.id);
    if (!el) { el = { id: seed.id, name: seed.name, level: 0, description: seed.description, conditions: '', stages: [] }; em.elements.push(el); }
    const old = el.stages || [];
    const prevByName = new Map(old.map(st => [String(st.name || '').trim().toLowerCase(), st]));
    const idByName = {}, stages = [];
    for (const sd of seed.stages) {
      const prev = prevByName.get(sd.n.toLowerCase());
      const st = { id: prev?.id || uid('stage'), name: sd.n, tier: sd.t, minLevel: sd.lvl ?? null, unlocked: !!prev?.unlocked,
        parentId: sd.from ? idByName[sd.from] || null : null, requirements: sd.rn || '', reqs: parseReqs(sd.req, getAffix), description: sd.d || '' };
      idByName[sd.n] = st.id;
      stages.push(st);
    }
    // связи «аффикс — ступень» этой стихии собираем заново по правилам
    const ids = new Set([...old.map(st => st.id), ...stages.map(st => st.id)]);
    for (const a of em.affixes) a.links = (a.links || []).filter(l => !(l.type === 'stage' && ids.has(l.targetId)));
    for (const sd of seed.stages) for (const an of sd.a || []) getAffix(an).links.push({ id: uid('link'), type: 'stage', targetId: idByName[sd.n] });
    el.stages = stages;
  }
}

function normalize(s) {
  const d = defaultState();
  // ранения из старого формата (только число) — до fillMissing, иначе подставится пустой список
  for (const k of ['light', 'medium', 'heavy']) {
    const t = s.character?.health?.[k];
    if (t && !Array.isArray(t.items))
      t.items = Array.from({ length: Number(t.current) || 0 }, () => ({ id: uid('wound'), text: '', date: new Date().toISOString() }));
  }
  fillMissing(s, d);
  syncStagesFromSeed(s);
  const em = s.elementalMagic;
  for (const de of d.elementalMagic.elements)
    if (!em.elements.some(e => e.id === de.id)) em.elements.push({ ...de, stages: [] });
  for (const e of em.elements) {
    e.stages ||= [];
    e.level ??= 0;
    for (const st of e.stages) st.reqs ||= [];
  }
  for (const a of em.affixes) a.links ||= [];
  for (const it of s.inventory) it.effects ||= [];
  for (const d of s.disciplines) { d.levels ||= []; for (const lv of d.levels) lv.effects ||= []; }
  for (const n of s.npcs) {
    n.kind ||= 'person';
    n.aliases = toTags(n.aliases);
    n.contracts ||= []; n.relations ||= [];
    for (const k of NPC_TAG_FIELDS) n[k] = toTags(n[k]);
  }
  {
    const ids = new Set([...s.npcs, ...s.geography.locations, ...s.inventory].map(x => x.id));
    s.notDuplicates = (s.notDuplicates || []).filter(k => k.split('|').every(id => ids.has(id)));
  }
  for (const q of s.quests) { q.steps ||= []; q.npcIds ||= []; q.locationIds ||= []; }
  s.geography.locations ||= [];
  s.geography.links ||= [];
  for (const l of s.geography.locations) { l.pos ||= {}; l.aliases = toTags(l.aliases); }
  for (const [id, text] of EXPERIENCE_ITEMS)
    if (!s.experience.items.some(i => i.id === id)) s.experience.items.push({ id, text, checked: false, note: '', log: [] });
  for (const i of s.experience.items) i.log ||= [];
  // тексты пунктов — правило игры, всегда берутся из страницы (в сохранении — только отметки, заметки и журнал)
  const expTexts = Object.fromEntries(EXPERIENCE_ITEMS);
  for (const i of s.experience.items) if (expTexts[i.id]) i.text = expTexts[i.id];
  return s;
}

// Обёртки над localStorage: если браузер запрещает хранилище, лист работает без сохранения
const store = {
  ok: true,
  get(k) { try { return localStorage.getItem(k); } catch { this.fail(); return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { if (e.name === 'SecurityError') this.fail(); else throw e; return false; } },
  fail() {
    if (!this.ok) return;
    this.ok = false;
    setTimeout(() => toast('Браузер запретил localStorage — изменения не будут сохраняться. Используй экспорт JSON.', 'error'), 300);
  },
};

function loadState() {
  const raw = store.get(STORAGE_KEY);
  if (!raw) return defaultState();
  try {
    const data = JSON.parse(raw);
    if (typeof data.version !== 'number') throw new Error('нет поля version');
    return migrate(data);
  } catch (e) {
    console.error(e);
    store.set(STORAGE_KEY + '-broken-' + Date.now(), raw);
    setTimeout(() => toast('Сохранение повреждено, загружены данные по умолчанию. Старые данные сохранены отдельно.', 'error'), 300);
    return defaultState();
  }
}

let saveTimer = null;
// Что пишется в сохранение и экспорт: ступени стихий — только id, название и отметка «открыта» (остальное — правила из страницы)
function serializeState(pretty) {
  const em = state.elementalMagic;
  const slim = { ...state, elementalMagic: { ...em,
    elements: em.elements.map(el => ({ ...el, stages: el.stages.map(st => ({ id: st.id, name: st.name, unlocked: !!st.unlocked })) })),
    // связи «аффикс — ступень» тоже из правил: при открытии собираются заново
    affixes: em.affixes.map(a => ({ ...a, links: (a.links || []).filter(l => l.type !== 'stage') })) } };
  return pretty ? JSON.stringify(slim, null, 2) : JSON.stringify(slim);
}

function saveState() {
  clearTimeout(saveTimer);
  saveTimer = null;
  try {
    store.set(STORAGE_KEY, serializeState());
    document.getElementById('saveDot')?.classList.remove('dirty');
  } catch (e) {
    console.error(e);
    toast(e.name === 'QuotaExceededError' ? 'Хранилище браузера переполнено! Удали старые резервные копии во вкладке «Данные» и сделай экспорт JSON.' : 'Не удалось сохранить: ' + e.message, 'error');
  }
}
function saveSoon() {
  document.getElementById('saveDot')?.classList.add('dirty');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 400);
}
window.addEventListener('beforeunload', () => { if (saveTimer) saveState(); });

function commit() {
  clampMana();
  saveState();
  render();
}

function getBackups() {
  try { return JSON.parse(store.get(BACKUP_KEY) || '[]'); } catch { return []; }
}
function createBackup(label = 'Ручная копия') {
  const list = getBackups();
  list.unshift({ id: uid('bk'), date: new Date().toISOString(), label, data: serializeState() });
  while (list.length > MAX_BACKUPS) list.pop();
  try {
    store.set(BACKUP_KEY, JSON.stringify(list));
    return true;
  } catch (e) {
    toast('Не удалось создать копию: ' + e.message, 'error');
    return false;
  }
}

function dateStamp(d = new Date()) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function downloadText(text, filename) {
  const blob = new Blob([text], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: filename });
  document.body.append(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportJSON() {
  downloadText(serializeState(true), `${FILE_PREFIX}-${dateStamp()}.json`);
  toast('Файл экспортирован', 'ok');
}
function replaceState(data, label) {
  if (!isPlain(data)) throw new Error('это не объект JSON');
  if (typeof data.version !== 'number') throw new Error('в файле нет поля version');
  const migrated = migrate(data);
  createBackup(label);
  state = migrated;
  ui.editing.clear();
  ui.pending = {};
  ui.draft = emptyDraft();
  saveState();
  render();
}
function importJSONFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch (e) { toast('Файл не является корректным JSON', 'error'); return; }
    if (!isPlain(data) || typeof data.version !== 'number') { toast('В файле нет поля version — это не сохранение листа', 'error'); return; }
    if (!confirm(`Заменить текущие данные содержимым файла «${file.name}»?\nТекущее состояние будет сохранено в резервную копию.`)) return;
    try {
      replaceState(data, 'Перед импортом');
      toast('Данные импортированы', 'ok');
    } catch (e) { toast('Ошибка импорта: ' + e.message, 'error'); }
  };
  reader.readAsText(file);
}

/* =====================================================================
   CHARACTER STATS — мана, золото, характеристики, модификаторы, пороги
   ===================================================================== */
const statDef = key => STAT_DEFS.find(d => d.key === key);
function getBase(key) {
  const d = statDef(key);
  if (d?.get) return Number(d.get(state)) || 0;
  return Number(state.character.stats[key]) || 0;
}
function setBase(key, v) {
  const d = statDef(key);
  if (d?.set) d.set(state, v); else state.character.stats[key] = v;
}
// Всё, что сейчас «надето»: используемые предметы и записи дисциплин, чей уровень достигнут.
// item.name — подпись источника для расшифровки бонусов.
function activeEffectSources() {
  const res = state.inventory.filter(it => it.equipped).map(it => ({ name: it.name, effects: it.effects || [] }));
  for (const d of state.disciplines) for (const lv of d.levels || [])
    if ((Number(d.level) || 0) >= (Number(lv.level) || 0))
      res.push({ name: `${d.name} ур. ${lv.level}`, effects: lv.effects || [], discipline: true });
  return res;
}
function statModifiers(key) {
  const res = [];
  for (const src of activeEffectSources())
    for (const ef of src.effects) if (ef.type === 'stat' && ef.stat === key) res.push({ item: src, ef });
  return res;
}
// Активные эффекты нужного типа: [{ src, ef }]
const activeEffects = type => activeEffectSources().flatMap(src => src.effects.filter(e => e.type === type).map(ef => ({ src, ef })));
const elementBonus = id => activeEffects('elementLevel').filter(x => x.ef.elementId === id);
const elLevel = el => Math.max(0, (Number(el.level) || 0) + elementBonus(el.id).reduce((t, x) => t + (Number(x.ef.value) || 0), 0));
const stageOpeners = id => activeEffects('unlockStage').filter(x => x.ef.stageId === id).map(x => x.src.name);
const freeAffixGivers = id => activeEffects('freeAffix').filter(x => x.ef.affixId === id).map(x => x.src.name);
// Раздел «Комбо» доступен, пока есть активный эффект «Открывает комбо»
const comboGivers = () => activeEffects('unlockCombos').map(x => x.src.name);
const isFreeAffix = a => a.links.some(l => l.type === 'free') || freeAffixGivers(a.id).length > 0;
const bonusText = key => statModifiers(key).map(({ item, ef }) => `${opText(ef)} от «${item.name}»`).join(', ');
// total = base + активные модификаторы (сначала +/−, потом ×)
function getTotal(key) {
  let add = 0, mul = 1;
  for (const { ef } of statModifiers(key)) {
    const v = Number(ef.value) || 0;
    if (ef.operation === 'mul') mul *= v;
    else if (ef.operation === 'sub') add -= v;
    else add += v;
  }
  return Math.floor((getBase(key) + add) * mul);
}
const opText = ef => (OPS[ef.operation]?.sign || '+') + ef.value;
const maxMana = () => Math.max(0, getTotal('maxMana'));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function clampMana() {
  const m = state.character.mana;
  m.current = clamp(Number(m.current) || 0, 0, maxMana());
}
function adjMana(d) {
  const m = state.character.mana;
  m.current = clamp(m.current + d, 0, maxMana());
  commit();
}
function adjGold(d) {
  state.character.gold = Math.max(0, (Number(state.character.gold) || 0) + d);
  commit();
}

const pendingTotal = () => Object.values(ui.pending).reduce((a, b) => a + b, 0);
function applyPending() {
  for (const [k, p] of Object.entries(ui.pending)) setBase(k, getBase(k) + p);
  state.character.freeStatPoints -= pendingTotal();
  ui.pending = {};
  commit();
  toast('Очки распределены', 'ok');
}

const thrKey = (stat, t) => `thr:${stat}:${t}`;
function getThr(stat, t, create) {
  const list = state.character.statThresholds;
  let r = list.find(x => x.stat === stat && x.threshold === t);
  if (!r && create) {
    r = { id: uid('thr'), stat, threshold: t, title: '', description: '' };
    list.push(r);
  }
  return r;
}

/* =====================================================================
   ELEMENTAL MAGIC — стихии, ступени, формы, доступность
   ===================================================================== */
const EM = () => state.elementalMagic;
const findElement = id => EM().elements.find(e => e.id === id);
const findForm = id => EM().forms.find(f => f.id === id);
const findAffix = id => EM().affixes.find(a => a.id === id);
function findStage(id) {
  for (const el of EM().elements) {
    const st = el.stages.find(s => s.id === id);
    if (st) return { el, st };
  }
  return null;
}
const hasMinLevel = st => st.minLevel !== null && st.minLevel !== undefined && st.minLevel !== '';
// Уровень 0 = стихия не изучена: ни она, ни её ступени недоступны
const isElementAvailable = el => elLevel(el) >= 1 || el.stages.some(st => stageOpeners(st.id).length);
const elementLockReason = el => isElementAvailable(el) ? '' : `${el.name} не изучена (уровень 0)`;
const isStageAvailable = (el, st) => stageOpeners(st.id).length > 0
  || (elLevel(el) >= 1 && (!!st.unlocked || (hasMinLevel(st) && elLevel(el) >= Number(st.minLevel))));
function stageLockReason(el, st) {
  if (isStageAvailable(el, st)) return '';
  if (!isElementAvailable(el)) return elementLockReason(el);
  if (hasMinLevel(st)) return `требуется ${el.name} ${st.minLevel}`;
  return 'ступень не открыта';
}

const formUnlockers = id => state.inventory.filter(i => (i.effects || []).some(e => e.type === 'unlockForm' && e.targetId === id));
const formUnlockedByDiscipline = id => activeEffectSources().some(src => src.discipline && src.effects.some(e => e.type === 'unlockForm' && e.targetId === id));
const isFormAvailable = f => !!f.known || formUnlockers(f.id).some(i => i.equipped) || formUnlockedByDiscipline(f.id);
function formLockReason(f) {
  if (isFormAvailable(f)) return '';
  const u = formUnlockers(f.id);
  return u.length ? 'нужен предмет: ' + u.map(i => i.name).join(' / ') : 'форма не изучена';
}

/* =====================================================================
   AFFIXES — единый справочник и связи
   ===================================================================== */
function newLink(type, targetId = '') {
  const l = { id: uid('link'), type };
  if (type !== 'free') l.targetId = targetId;
  if (type === 'element') l.minLevel = 0;
  return l;
}
function linkStatus(l) {
  switch (l.type) {
    case 'element': {
      const el = findElement(l.targetId);
      if (!el) return { ok: false, reason: 'стихия не указана' };
      const need = Math.max(1, Number(l.minLevel) || 0);
      return elLevel(el) >= need ? { ok: true } : { ok: false, reason: `требуется ${el.name} ${need}` };
    }
    case 'stage': {
      const r = findStage(l.targetId);
      if (!r) return { ok: false, reason: 'ступень не найдена' };
      if (isStageAvailable(r.el, r.st)) return { ok: true };
      return { ok: false, reason: `требуется ступень «${r.st.name}»` + (hasMinLevel(r.st) ? ` (${r.el.name} ${r.st.minLevel})` : '') };
    }
    case 'form': {
      const f = findForm(l.targetId);
      if (!f) return { ok: false, reason: 'форма не найдена' };
      return isFormAvailable(f) ? { ok: true } : { ok: false, reason: `форма «${f.name}»: ${formLockReason(f)}` };
    }
    case 'free': return { ok: true };
  }
  return { ok: false, reason: 'неизвестная связь' };
}
function linkLabel(l) {
  switch (l.type) {
    case 'element': { const el = findElement(l.targetId); return `${el ? el.name : '?'}${l.minLevel ? ' ≥ ' + l.minLevel : ''}`; }
    case 'stage': { const r = findStage(l.targetId); return r ? `${r.el.name}: ${r.st.name}` : 'ступень удалена'; }
    case 'form': { const f = findForm(l.targetId); return `Форма: ${f ? f.name : '?'}`; }
    case 'free': return 'Свободный';
  }
  return '?';
}
const affixesForTarget = (type, id) => EM().affixes.filter(a => a.links.some(l => l.type === type && l.targetId === id));
const affName = id => findAffix(id)?.name;
// подсказка при наведении: описание аффикса (если есть)
const affTip = id => { const a = findAffix(id); return a ? a.name + (a.description?.trim() ? ' — ' + a.description.trim() : '') : ''; };

// Строит вариант для селекта из набора подходящих связей аффикса
function optionFromLinks(a, links) {
  const st = links.map(linkStatus);
  const ok = st.some(s => s.ok);
  return { id: a.id, label: a.name, locked: !ok, reason: ok ? '' : st[0].reason };
}
const sortOpts = arr => arr.sort((a, b) => (a.locked - b.locked) || a.label.localeCompare(b.label, 'ru'));

function freeAffixOptions() {
  return sortOpts(EM().affixes.filter(isFreeAffix).map(a => ({ id: a.id, label: a.name })));
}

/* =====================================================================
   SPELLBOOK — структура заклинания, конструктор, применение
   Стихия даёт ВСЕ аффиксы своей ступени, форма — ВСЕ свои аффиксы.
   Выбираются: стихия, ступень, форма и свободные аффиксы.
   ===================================================================== */
// Правила (уточнены у мастера): при превращении аффиксы тратятся, потраченные ячейки не заполняются заново,
// аффиксы самой стихии в требования не засчитываются. Пояснение для игроков — в справке («Превращения и стоимость»).

// Ключи ячеек свободных аффиксов: freeAffixId, freeAffixId2, freeAffixId3…
const freeKey = i => i ? 'freeAffixId' + (i + 1) : 'freeAffixId';
const freeSlotCount = () => clamp(Math.round(getTotal('freeSlots')) || 0, 0, 5);
const freeKeys = () => Array.from({ length: freeSlotCount() }, (_, i) => freeKey(i));

// Учитывает ступени, полученные превращением в этом заклинании (obj.chain)
const stageOkFor = (d, el, st) => isStageAvailable(el, st) || !!d.chain?.includes(st.id);

// Самая «высокая» доступная ступень линейного развития — подставляется при выборе стихии
function defaultStage(el) {
  const avail = el.stages.filter(st => isStageAvailable(el, st));
  const linear = avail.filter(st => st.tier === 'linear' && hasMinLevel(st)).sort((a, b) => b.minLevel - a.minLevel);
  return (linear[0] || avail[0])?.id || null;
}

// Все аффиксы ступени (плюс аффиксы, привязанные к стихии по уровню)
function elementAffixesOf(obj) {
  const el = findElement(obj.elementId);
  if (!el || !obj.stageId) return [];
  return EM().affixes.filter(a => a.links.some(l =>
    (l.type === 'stage' && l.targetId === obj.stageId) ||
    (l.type === 'element' && l.targetId === el.id && linkStatus(l).ok))).sort(byName).map(a => a.id);
}
// Все аффиксы формы, доступные по её уровню. Потраченные превращением (obj.consumedForm) исключаются.
function formAffixesOf(obj, includeConsumed) {
  const f = findForm(obj.formId);
  if (!f) return [];
  const ids = EM().affixes.filter(a => a.links.some(l => l.type === 'form' && l.targetId === f.id))
    .sort(byName).map(a => a.id);
  if (includeConsumed) return ids;
  const spent = [...(obj.consumedForm || [])];
  return ids.filter(id => { const i = spent.indexOf(id); if (i < 0) return true; spent.splice(i, 1); return false; });
}

// «Стена (ур. 1) — Укрепление, Быстрая»: в выпадающем списке сразу видно, что даёт форма или ступень
const withAffixes = (label, ids) => ids.length ? label + ' — ' + ids.map(affName).filter(Boolean).join(', ') : label;

// Выбираемые части заклинания. Если правила изменятся — правится этот список.
function spellParts() {
  return [
    { key: 'elementId', label: 'Стихия', css: 'el',
      options: () => EM().elements.map(e => ({ id: e.id, label: `${ELEMENT_ICON[e.id] || ''} ${e.name} (ур. ${elLevel(e)})`,
        locked: !isElementAvailable(e), reason: elementLockReason(e) })),
      name: id => findElement(id)?.name },
    { key: 'stageId', label: 'Ступень стихии', deps: ['elementId'],
      options: d => {
        const el = findElement(d.elementId);
        if (!el) return [];
        return el.stages.map(st => ({ id: st.id, label: withAffixes(st.name, stageAffixIds(st.id)), locked: !stageOkFor(d, el, st), reason: stageLockReason(el, st) }));
      },
      name: id => findStage(id)?.st.name },
    { key: 'formId', label: 'Форма',
      options: () => sortOpts(EM().forms.map(f => ({ id: f.id, label: withAffixes(f.name, formAffixesOf({ formId: f.id })), locked: !isFormAvailable(f), reason: formLockReason(f) }))),
      name: id => findForm(id)?.name },
    ...freeKeys().map((key, i) => ({ key, label: 'Свободный аффикс' + (i ? ' ' + (i + 1) : ''), affix: true, free: true,
      options: freeAffixOptions, name: affName })),
  ];
}
const comboFields = () => spellParts().map(p => p.key);
const partByKey = k => spellParts().find(p => p.key === k);

function emptyDraft() {
  return { elementId: null, stageId: null, formId: null, freeAffixId: null, image: '',
    name: '', manaCost: 0, description: '', notes: '' };
}

function resetDependents(obj, changedKey) {
  for (const p of spellParts()) {
    if (!p.deps || !p.deps.includes(changedKey) || !obj[p.key]) continue;
    if (!p.options(obj).some(o => o.id === obj[p.key])) { obj[p.key] = null; resetDependents(obj, p.key); }
  }
}

const isConsumed = (obj, key) => !!obj.consumed?.includes(key);

function spellIssues(obj) {
  const issues = [];
  for (const p of spellParts()) {
    const v = obj[p.key];
    if (!v) {
      if (!p.optional && !isConsumed(obj, p.key)) issues.push({ kind: 'missing', text: `не выбрано: ${p.label.toLowerCase()}` });
      continue;
    }
    const opt = p.options(obj).find(o => o.id === v);
    if (!opt) issues.push({ kind: 'broken', text: `${p.label}: ${p.name(v) ? '«' + p.name(v) + '» больше не связан' : 'объект удалён'}` });
    else if (opt.locked) issues.push({ kind: 'locked', text: `🔒 ${p.label} «${p.name(v)}»: ${opt.reason}` });
  }
  return issues;
}

function partView(p, obj) {
  const v = obj[p.key];
  if (!v) return isConsumed(obj, p.key) ? h('span', { class: 'part consumed', title: p.label + ' — потрачен' }, '—') : null;
  const name = p.name(v) || '(удалено)';
  const opt = p.options(obj).find(o => o.id === v);
  const cls = 'part' + (p.css === 'el' ? ' el el-' + v : '') + (p.affix ? ' affix' : '') + (opt && opt.locked ? ' locked' : '');
  const desc = p.affix ? findAffix(v)?.description : p.key === 'formId' ? findForm(v)?.description : '';
  return h('span', { class: cls, title: p.label + (opt && opt.locked ? ' — ' + opt.reason : '') + (desc?.trim() ? '\n' + desc.trim() : '') },
    (p.css === 'el' ? (ELEMENT_ICON[v] || '') + ' ' : '') + name);
}

// Аффиксы формы с отметкой потраченных — для отображения
function formAffixView(obj) {
  const spent = [...(obj.consumedForm || [])];
  return formAffixesOf(obj, true).map(id => {
    const i = spent.indexOf(id);
    if (i >= 0) { spent.splice(i, 1); return { id, spent: true }; }
    return { id, spent: false };
  });
}

function spellFormula(obj, big) {
  const q = () => h('span', { class: 'q' }, '?');
  const affs = list => list.length ? h('span', { class: 'affs' }, '(', list.map((x, i) => [i ? ', ' : '',
    x.spent ? h('span', { class: 'part consumed', title: affName(x.id) + ' — потрачен' }, '—') : h('span', { class: 'part affix', title: affTip(x.id) }, affName(x.id))]), ')') : null;
  const out = [partView(partByKey('elementId'), obj) || q()];
  if (obj.stageId) out.push(h('span', { class: 'muted small' }, '›'), partView(partByKey('stageId'), obj));
  out.push(affs(elementAffixesOf(obj).map(id => ({ id }))));
  out.push(h('span', { class: 'plus' }, '+'), partView(partByKey('formId'), obj) || q(), affs(formAffixView(obj)));
  for (const k of freeKeys()) out.push(h('span', { class: 'plus' }, '+'), partView(partByKey(k), obj) || q());
  return h('div', { class: 'formula' + (big ? ' big' : '') }, out);
}

function autoSpellName(obj) {
  const n = [findStage(obj.stageId)?.st.name || findElement(obj.elementId)?.name, findForm(obj.formId)?.name,
    ...freeKeys().map(k => affName(obj[k]))].filter(Boolean);
  return n.length ? n.join(' ') : 'Безымянное заклинание';
}

/* ---------- превращения ---------- */
// Аффиксы, засчитываемые в требования, в порядке траты: свободные → формы (аффиксы стихии не считаются)
function affixSlots(obj) {
  const slots = [];
  for (const k of freeKeys()) if (obj[k]) slots.push({ kind: 'free', key: k, affixId: obj[k] });
  for (const id of formAffixesOf(obj)) slots.push({ kind: 'form', affixId: id });
  return slots;
}

// Какие дочерние ступени текущей можно получить и чего не хватает до остальных
function transformCheck(obj) {
  const res = { possible: [], missing: [] };
  if (!obj.elementId || !obj.stageId) return res;
  const r = findStage(obj.stageId);
  if (!r || r.el.id !== obj.elementId) return res;
  const slots = affixSlots(obj);
  for (const st of r.el.stages.filter(s => s.parentId === obj.stageId && (s.reqs || []).length)) {
    const pool = slots.slice(), consume = [], missing = [];
    for (const q of st.reqs) {
      let need = Math.max(1, Number(q.count) || 1);
      for (let i = 0; i < pool.length && need > 0;) {
        if (pool[i].affixId === q.affixId) { consume.push(pool[i]); pool.splice(i, 1); need--; } else i++;
      }
      if (need > 0) missing.push({ affixId: q.affixId, n: need });
    }
    if (missing.length) res.missing.push({ stage: st, missing });
    else res.possible.push({ stage: st, consume });
  }
  return res;
}

const stageAffixIds = stageId => affixesForTarget('stage', stageId).sort(byName).map(a => a.id);
const snapshotParts = obj => Object.fromEntries(comboFields().map(k => [k, obj[k] || null]));

function applyTransform(obj, opt) {
  if (!obj.chain?.length) {
    obj.origin = snapshotParts(obj);
    obj.chain = [obj.stageId];
  }
  obj.chain.push(opt.stage.id);
  obj.stageId = opt.stage.id;
  for (const s of opt.consume) {
    if (s.kind === 'free') { obj[s.key] = null; obj.consumed = [...new Set([...(obj.consumed || []), s.key])]; }
    if (s.kind === 'form') obj.consumedForm = [...(obj.consumedForm || []), s.affixId];
  }
}
function clearTransform(obj) {
  delete obj.chain; delete obj.origin; delete obj.consumed; delete obj.consumedForm;
}
function undoTransform(obj) {
  if (obj.origin) Object.assign(obj, obj.origin);
  clearTransform(obj);
}

// Случайная цепочка превращений (для непроверенных комбинаций)
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function randomTransform(combo) {
  const obj = { ...combo };
  for (let step = 0; step < 6; step++) {
    const c = transformCheck(obj);
    if (!c.possible.length) break;
    applyTransform(obj, pick(c.possible));
  }
  return obj.chain ? obj : null;
}

function chainText(obj) {
  return (obj.chain || []).map(id => findStage(id)?.st.name || '?').join(' → ');
}
/* ---------- уровень ступени и стоимость ---------- */
// Уровень ступени — число шагов от стартовой ступени (Вода 1, Лёд 2, Древний лёд 3, Кровь 2). Считается сам.
function stageLevel(el, st, seen = new Set()) {
  if (seen.has(st.id)) return null;
  seen.add(st.id);
  const parent = st.parentId && el.stages.find(s => s.id === st.parentId);
  if (parent) { const p = stageLevel(el, parent, seen); return p == null ? null : p + 1; }
  return st.tier === 'linear' ? 1 : null; // стартовая ступень; у мастерских без «родителя» уровень неизвестен
}
// Множитель стоимости — свой у каждой ступени, задаётся вручную (Кровь ×8, Древний лёд ×4…)
const stageMultiplier = (el, st) => STAGE_MULTIPLIERS.get(el.id + '|' + st.name) ?? null;
function magicLevelOf(obj) {
  const r = findStage(obj.stageId);
  return r ? stageLevel(r.el, r.st) : null;
}
// Все аффиксы заклинания, кроме потраченных на превращение
const spellAffixCount = obj => elementAffixesOf(obj).length + formAffixesOf(obj).length + freeKeys().filter(k => obj[k]).length;
// Расчёт стоимости: { cost, count, level, mult } или { error }
function costCalc(obj) {
  if (!obj.stageId) return { error: 'выбери ступень стихии' };
  const r = findStage(obj.stageId), count = spellAffixCount(obj);
  if (!r) return { error: 'ступень удалена', count };
  const level = stageLevel(r.el, r.st), mult = stageMultiplier(r.el, r.st), stage = r.st.name;
  if (mult == null) return { error: `у ступени «${stage}» нет множителя в правилах`, count, level, stage };
  return { cost: Math.round(count * mult), count, level, mult, stage };
}
// Итоговая стоимость: своя (если включена) или расчётная; у тайных заклинаний — указанная
function spellCost(s) {
  if (s.costManual || !s.stageId) return Math.max(0, Number(s.manaCost) || 0);
  const c = costCalc(s);
  return c.cost ?? Math.max(0, Number(s.manaCost) || 0);
}
const costText = c => c.error ? c.error : `${c.count} аффикс. × ${c.mult} (множитель ступени «${c.stage}») = ${c.cost}`;
const reqText = reqs => (reqs || []).map(q => `${affName(q.affixId) || '?'} ×${q.count}`).join(', ');
const missingText = list => list.map(m => `${affName(m.affixId) || '?'} ×${m.n}`).join(', ');
const consumeText = list => list.map(s => affName(s.affixId)).join(', ');

function castSpell(spell) {
  const cost = spellCost(spell);
  const m = state.character.mana;
  if (m.current < cost) { toast('Недостаточно маны', 'error'); return; }
  m.current -= cost;
  spell.uses = (spell.uses || 0) + 1;
  commit();
  toast(`${spell.name || 'Заклинание'}: −${cost} маны`, 'ok');
}

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  let value;
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'value') value = v;
    else if (k === 'checked' || k === 'disabled' || k === 'open') el[k] = true;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  if (value !== undefined) el.value = value;
  return el;
}
const btn = (label, fn, cls = '', disabled = false, title = null) =>
  h('button', { type: 'button', class: 'btn ' + cls, disabled, title, onclick: fn }, label);
const chip = (text, cls = '', title = null) => h('span', { class: 'chip ' + cls, title }, text);

function txt(obj, key, o = {}) {
  return h(o.multi ? 'textarea' : 'input', {
    class: o.class, placeholder: o.placeholder, rows: o.multi ? (o.rows || 3) : null, list: o.list,
    'data-name-for': o.nameFor,
    value: obj[key] ?? '',
    oninput: e => { obj[key] = e.target.value; saveSoon(); },
  });
}
function num(obj, key, o = {}) {
  return h('input', {
    type: 'number', class: 'num ' + (o.class || ''), step: o.step || 1, min: o.min, value: obj[key] ?? 0,
    onchange: e => {
      let n = parseFloat(String(e.target.value).replace(',', '.'));
      if (!isFinite(n)) n = o.min ?? 0;
      if (!o.float) n = Math.round(n);
      if (o.min != null) n = Math.max(o.min, n);
      if (o.max) n = Math.min(o.max(), n);
      obj[key] = n;
      (o.onChange || commit)();
    },
  });
}
function sel(value, items, onChange, cls = '') {
  const s = h('select', { class: cls, onchange: e => onChange(e.target.value) });
  const add = (parent, it) => {
    if (it.group) {
      if (!it.items.length) return;
      const g = h('optgroup', { label: it.group });
      it.items.forEach(x => add(g, x));
      parent.append(g);
      return;
    }
    const [v, l, o = {}] = it;
    parent.append(h('option', { value: v, disabled: o.disabled }, l));
  };
  items.forEach(it => add(s, it));
  s.value = value ?? '';
  return s;
}
function levelCtl(obj, key, min = 0) {

    num(obj, key, { min, class: 'lvl-num' }),

}

function fold(key, summary, content, defOpen = false, cls = '') {

function statCard(def, left) {
  const base = getBase(def.key), p = ui.pending[def.key] || 0, total = getTotal(def.key), mods = statModifiers(def.key);
  const baseObj = { v: base };
  return h('div', { class: 'stat-card' },
    h('div', { class: 'stat-head' },
      h('span', { class: 'stat-name' }, def.name),
      h('span', { class: 'stat-total' }, total, p ? h('span', { class: 'plan' }, ' → ' + (total + p)) : null)),
    h('div', { class: 'small muted' },
      'База ', base, p ? h('span', { class: 'plan' }, ` · план +${p}`) : null,
      mods.map(({ item, ef }) => ` · ${item.name} ${opText(ef)}`)),
    def.allocatable ? h('div', { class: 'row', style: 'margin-top:8px' },
      btn('−', () => { if (p > 1) ui.pending[def.key] = p - 1; else delete ui.pending[def.key]; render(); }, 'big', p <= 0, 'Убрать запланированное очко'),
      btn('+', () => { ui.pending[def.key] = p + 1; render(); }, 'big primary', left <= 0, left <= 0 ? 'Нет свободных очков' : 'Вложить очко'),
      h('span', { class: 'grow' }),
      fold('base-' + def.key, 'база', h('div', { class: 'row small' }, 'Базовое значение:',
        num(baseObj, 'v', { min: 0, onChange: () => { setBase(def.key, baseObj.v); commit(); } }))))
      : null,
    def.thresholds ? thresholdBlock(def, total) : null);
}

function thresholdBlock(def, total) {
  const reached = Math.floor(Math.max(0, total) / THRESHOLD_STEP);
  const next = (reached + 1) * THRESHOLD_STEP;
  const defined = state.character.statThresholds.filter(t => t.stat === def.key).map(t => t.threshold);
  const maxT = Math.max(next, ...defined);
  const rows = [];
  for (let t = THRESHOLD_STEP; t <= maxT; t += THRESHOLD_STEP)
    if (t <= next || defined.includes(t)) rows.push(thrRow(def.key, t, total));
  return fold('thr-' + def.key,
    `Пороговые свойства: открыто ${reached} · следующий ${next} (осталось ${next - total})`,
    h('div', { class: 'thr-list' }, rows,
      h('div', null, btn('+ описать порог дальше', () => {
        const t = maxT + THRESHOLD_STEP;
        getThr(def.key, t, true);
        ui.editing.add(thrKey(def.key, t));
        commit();
      }, 'ghost small'))));
}

function thrRow(stat, t, total) {
  const reached = total >= t, rec = getThr(stat, t, false), key = thrKey(stat, t), ed = ui.editing.has(key);
  return h('div', { class: 'thr ' + (reached ? 'reached' : 'future') },
    h('span', { class: 'thr-badge' }, (reached ? '✦ ' : '○ ') + t),
    ed && rec
      ? h('div', { class: 'grow form', style: 'margin:0' },
          field('Название свойства', txt(rec, 'title')),
          field('Описание', txt(rec, 'description', { multi: true, rows: 2 })))
      : h('div', { class: 'grow' },
          h('b', { class: rec?.title ? '' : 'muted' }, rec?.title || (reached ? 'свойство не описано' : '—')),
          rec?.description ? h('div', { class: 'small desc', style: 'margin:2px 0 0' }, rich(rec.description)) : null,
          !reached ? h('div', { class: 'small muted' }, `осталось ${t - total}`) : null),
    btn(ed ? '✓' : '✎', () => {
      if (ed) {
        ui.editing.delete(key);
        if (rec && !rec.title.trim() && !rec.description.trim()) {
          const l = state.character.statThresholds;
          l.splice(l.indexOf(rec), 1);
        }
      } else { getThr(stat, t, true); ui.editing.add(key); }
      commit();
    }, 'ghost small sq'));
}
